name: Overlay provenance diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: false
      - name: Build and compare reviewed overlay inputs without executing guest code
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess
          root=pathlib.Path.cwd(); out=root/'diagnosis';out.mkdir()
          refs={'before_main':'94a0ae2afe19ae494a6bd6fad5c846f16e6d7c77','before_lock':'6233bc7e53d832dd8a62dd63c722a7d26cacac24','after_main':'241cb37c5e7802cc349fd4bcdbc41b86de4fc2cf','after_lock':'dad073d693ae29b044796b3791cfb30a80ff2c30'}
          def run(args,cwd):return subprocess.check_output(args,cwd=cwd,text=True)
          def sha(p):return hashlib.sha256(p.read_bytes()).hexdigest()
          rows={}
          for name,ref in refs.items():
              tree=out/name
              subprocess.run(['git','worktree','add','--detach',str(tree),ref],check=True)
              binary=out/(name+'.relay')
              run(['go','build','-trimpath','-buildvcs=false','-o',str(binary),'./guest/ssm-relay'],tree)
              unit=tree/'guest/ssm-relay/tenkacloud-session-relay.service';license=tree/'LICENSE'
              receipt=json.loads(run(['python3','-I',str(tree/'scripts/guest-image/session-overlay.py'),'--binary',str(binary),'--binary-sha256',sha(binary),'--unit',str(unit),'--unit-sha256',sha(unit),'--license',str(license),'--license-sha256',sha(license),'--output',str(out/(name+'.tar'))],tree))
              receipt.update(ref=ref,build_info=run(['go','version','-m',str(binary)],tree),build_id=run(['go','tool','buildid',str(binary)],tree),go_mod=(tree/'go.mod').read_text())
              rows[name]=receipt
          assert rows['before_main']['overlaySHA256']==rows['before_lock']['overlaySHA256']
          assert rows['after_main']['overlaySHA256']==rows['after_lock']['overlaySHA256']
          # Isolate the module go directive from the changed gVisor export.
          tree=out/'after_main';mod=tree/'go.mod';original=mod.read_text();mod.write_text(original.replace('go 1.26.3\n','go 1.26.0\n'))
          binary=out/'after_main_old_directive.relay'
          try:
              run(['go','build','-mod=readonly','-trimpath','-buildvcs=false','-o',str(binary),'./guest/ssm-relay'],tree)
              rows['old_directive']={'binarySHA256':sha(binary),'build_info':run(['go','version','-m',str(binary)],tree)}
          except subprocess.CalledProcessError as e:
              rows['old_directive']={'exit':e.returncode,'output':e.output}
          finally:mod.write_text(original)
          (out/'comparison.json').write_text(json.dumps(rows,indent=2)+'\n')
          print(json.dumps(rows,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: overlay-provenance-${{ github.sha }}
          path: diagnosis/comparison.json
          if-no-files-found: error
