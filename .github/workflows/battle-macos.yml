name: battle-macos
# Apple silicon evidence for the Battle VM runtime: Darwin process supervision
# tests, then the unchanged Hello World Battle on a real QEMU TCG guest. GitHub's
# macOS runners have no nested virtualization, which this TCG runtime does not
# use. The rehearsal stands in for the host; it is not TenkaCloud host acceptance.
on:
  pull_request:
    paths:
      - 'internal/workload/guestprocess/**'
      - 'internal/workload/guestvm/**'
      - 'internal/aws/ec2_*'
      - 'internal/server/battle_*'
      - 'cmd/simulator/battle_*'
      - 'test/battle/**'
      - '.github/workflows/battle-macos.yml'
  workflow_dispatch:
    inputs:
      challenge_ref:
        description: TenkaCloudChallenge commit holding the unchanged problem
        required: false
        default: 5b5cd1a422e98d2648784aaea7fde02bc722e96d
permissions:
  contents: read
env:
  CHALLENGE_REF: ${{ inputs.challenge_ref || '5b5cd1a422e98d2648784aaea7fde02bc722e96d' }}
jobs:
  darwin-unit:
    name: Darwin child supervision tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: true
      - name: Vet and test the Darwin runtime packages
        env:
          GOTOOLCHAIN: local
        run: |
          go vet ./...
          go test -count=1 -race ./internal/workload/guestprocess/ ./internal/workload/guestvm/ ./internal/workload/probeclock/ ./cmd/simulator/
  battle-rehearsal:
    name: Unchanged Hello World Battle on Apple silicon (QEMU TCG)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: susumutomita/TenkaCloudChallenge
          ref: ${{ env.CHALLENGE_REF }}
          path: challenge
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.11'
          cache: true
      - name: Install the emulator and pinned SDK
        timeout-minutes: 20
        run: |
          brew install qemu
          qemu-system-x86_64 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install boto3==1.42.0 botocore==1.41.6 jmespath==1.1.0 python-dateutil==2.9.0.post0 s3transfer==0.16.1 six==1.17.0 urllib3==2.8.0
      - name: Build the simulator under test
        env:
          GOTOOLCHAIN: local
        run: make build
      - name: Build the pinned guest bundle on this machine
        timeout-minutes: 75
        env:
          GOTOOLCHAIN: local
          # The macOS system trust store; certificate and hostname checks stay on.
          SSL_CERT_FILE: /etc/ssl/cert.pem
        run: python3 test/battle/image/build_bundle.py --out "$RUNNER_TEMP/bundle" --work /tmp/bb --keep-work
      - name: Run the rehearsal
        timeout-minutes: 60
        run: |
          rm -rf /tmp/bb/tree /tmp/bb/download
          mkdir -m 700 /tmp/hwb
          "$RUNNER_TEMP/venv/bin/python" -I test/battle/rehearsal.py --binary "$PWD/dist/tenkacloud-simulator" \
            --bundle "$RUNNER_TEMP/bundle" --challenge-root "$PWD/challenge" --work /tmp/hwb/r1
      - name: Retain rehearsal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: battle-macos-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/bundle/manifest.json
            ${{ runner.temp }}/bundle/build-summary.json
            /tmp/bb/builder-serial.log
            /tmp/bb/provenance.jsonl
            /tmp/hwb/r1/report.json
            /tmp/hwb/r1/simulator.log
          if-no-files-found: warn
          retention-days: 14
