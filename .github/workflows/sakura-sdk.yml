name: Sakura SDK acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sakura-sdk:
    name: Pinned Sakura SDK against two standalone CLIs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
          cache-dependency-path: |
            go.sum
            test/sdk/sakura/go.sum
      - name: Build actual simulator and isolated pinned SDK fixture
        run: |
          make build
          cd test/sdk/sakura
          go mod download
          go mod verify
          go vet ./...
          go test -race ./...
          go build -mod=readonly -o ../../../dist/sakura-sdk .
      - name: Verify real SDK effects, errors, isolation and cleanup
        run: |
          python3 -m unittest discover -s test/e2e -p test_sakura_sdk.py -v
          python3 test/e2e/sakura_sdk.py --binary dist/tenkacloud-simulator --client dist/sakura-sdk --report reports/sakura-sdk.json
      - name: Retain safe SDK evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sakura-sdk-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/sakura-sdk.json
          if-no-files-found: error
          retention-days: 14
