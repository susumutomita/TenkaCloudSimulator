name: Verify local Kinesis Video ingestion and playback
on: workflow_dispatch
permissions:
  contents: read
jobs:
  video-sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: b03e263db612480111aa6369b4aa255cba02dc35
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
      - name: Verify the immutable source and build
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/video-receipts"
          test "$(id -u)" -ne 0
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = b03e263db612480111aa6369b4aa255cba02dc35
          test "$(git rev-parse 'HEAD^{tree}')" = bab16e89a9c7043940bba793854e7c5974191a27
          test "$(git rev-parse --is-shallow-repository)" = true
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/video-receipts/source.txt"
          test "$(go env GOVERSION)" = go1.26.11
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert not any(k.startswith(('AWS_', 'BOTO_')) for k in os.environ)
          assert not os.environ.get('GOFLAGS')
          for p in [Path.home()/s for s in ('.aws/config','.aws/credentials','.boto')]+[Path('/etc/boto.cfg')]:
              assert not p.exists() and not p.is_symlink()
          PY
          make build
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/video-receipts/go-build.txt"
          grep -F 'vcs.revision=b03e263db612480111aa6369b4aa255cba02dc35' "$RUNNER_TEMP/video-receipts/go-build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/video-receipts/go-build.txt"
          grep -F 'v0.0.0-20261128143957-b03e263db612' "$RUNNER_TEMP/video-receipts/go-build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/video-receipts/measured.sha256"
          echo '52686634921953e18c86376e7095008650fd5a361c697998ad0c2253c95dabfa  dist/tenkacloud-simulator' > "$RUNNER_TEMP/video-receipts/expected.sha256"
          sha256sum --check "$RUNNER_TEMP/video-receipts/expected.sha256"
      - name: Prepare pinned stock clients before the offline run
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3,12,16)'
          "$python" -m venv "$RUNNER_TEMP/video-venv"
          "$RUNNER_TEMP/video-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/video-venv/bin/pip" check
          "$RUNNER_TEMP/video-venv/bin/python" -B -c 'import boto3,botocore; assert (boto3.__version__,botocore.__version__)==("1.42.0","1.41.6")'
          "$RUNNER_TEMP/video-venv/bin/python" -B test/e2e/kinesis_video_fragments.py --prepare-java "$RUNNER_TEMP/video-jars"
          sha256sum test/e2e/kinesis_video_fragments.py test/e2e/kinesis_video/* > "$RUNNER_TEMP/video-receipts/fixtures.sha256"
          test -x "$JAVA_HOME_17_X64/bin/java"
          "$JAVA_HOME_17_X64/bin/java" --version > "$RUNNER_TEMP/video-receipts/java.txt"
          # Ubuntu runner images may omit FFmpeg; install the distro package before isolation.
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version > "$RUNNER_TEMP/video-receipts/ffmpeg.txt"
      - name: Exercise the unmodified SDK fixture and original media
        run: |
          set -euo pipefail
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_BINARY_SHA256=52686634921953e18c86376e7095008650fd5a361c697998ad0c2253c95dabfa
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          export PYTHONDONTWRITEBYTECODE=1
          result=0
          unshare --user --map-current-user --net --keep-caps sh -eu -c '
            ip link set lo up
            test "$(ip -o link show | cut -d: -f2 | tr -d " ")" = lo
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all sh -eu -c '\''
              test "$(id -u)" -ne 0
              test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = 0000000000000000
              echo "loopback only, nonroot, effective capabilities zero" > "$RUNNER_TEMP/video-receipts/isolation.txt"
              exec "$RUNNER_TEMP/video-venv/bin/python" -B test/e2e/kinesis_video_fragments.py --java-libs "$RUNNER_TEMP/video-jars"
            '\''
          ' > "$RUNNER_TEMP/video-private.log" 2>&1 || result=$?
          echo "$result" > "$RUNNER_TEMP/video-receipts/fixture.exit"
          python3 - "$result" <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          text = (base/'video-private.log').read_text(errors='replace')
          out = {'exit':int(sys.argv[1])}
          if out['exit']:
              files = set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
              selected = [(p.removeprefix(str(Path.cwd())+'/'),int(n)) for p,n in re.findall(r'File "([^"\n]+)", line (\d+)', text)]
              out['trackedFrames'] = [{'file':p,'line':n} for p,n in selected if p in files][-12:]
              out['failedPhase'] = [name for name in ('ProfileNotFound','AssertionError','TimeoutError','CalledProcessError','FileNotFoundError','Checksum mismatch','Unable to locate','Blocked','ClientError','RuntimeError') if name in text]
          else:
              lines = [json.loads(line) for line in text.splitlines() if line.startswith('{"acknowledgments":')]
              assert len(lines)==1
              f=lines[0]
              assert f['boto3Calls']>30 and f['producer']=='1.12.0' and f['netty']=='1.12.797'
              assert f['acknowledgments']==['BUFFERING','RECEIVED','PERSISTED'] and f['zeroRetentionAcknowledgments']==['BUFFERING','RECEIVED']
              assert all(f[k]==401 for k in ('readerAsWriter','writerAsReader','foreignParticipant','nettyWithoutLocalHeader'))
              assert all(f[k] is True for k in ('cursorSelectedSecond','sameNamePeerUnchanged','reopenedDecoded','cleanup'))
              assert len(f['fragmentNumbers'])==2 and all(re.fullmatch('[0-9]+',n) for n in f['fragmentNumbers']) and int(f['fragmentNumbers'][0])<int(f['fragmentNumbers'][1])
              assert len(f['inputSHA256'])==2 and len(set(f['inputSHA256']))==2 and all(re.fullmatch('[0-9a-f]{64}',h) for h in f['inputSHA256'])
              assert len(f['frameMD5'])==2 and f['frameMD5'][0]!=f['frameMD5'][1] and all(len(v)==2 and all(re.fullmatch('[0-9a-f]{32}',h) for h in v) for v in f['frameMD5'])
              out['fixture']={k:f[k] for k in ('boto3Calls','producer','netty','fragmentNumbers','inputSHA256','frameMD5','acknowledgments','zeroRetentionAcknowledgments','nettyWithoutLocalHeader','readerAsWriter','writerAsReader','foreignParticipant','cursorSelectedSecond','sameNamePeerUnchanged','reopenedDecoded','cleanup')}
          (base/'video-receipts'/'result.json').write_text(json.dumps(out,indent=2)+'\n')
          PY
          sha256sum --check "$RUNNER_TEMP/video-receipts/expected.sha256"
          test -z "$(git status --porcelain)"
          exit "$result"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: kinesis-video-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/video-receipts/
          if-no-files-found: error
          retention-days: 7
