name: Exact B2BI quota native before-commit gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  before-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRODUCT: 1bbc39fbe20103d0c4448588054732ec3447fbbe
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 1bbc39fbe20103d0c4448588054732ec3447fbbe
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify clean source and run the repository gate
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/210-b2bi-normal-gate
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = a9362fb23fcf72e845f7c86fc867761abbb841e8
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          mkdir "$RUNNER_TEMP/receipts"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 scripts/check-formal-applicability.py check --base 70695e3f5c040ea98b3132a6a097a4b7ebea31ab
          make before-commit 2>&1 | tee "$RUNNER_TEMP/receipts/before-commit.log"
          test -z "$(git status --porcelain)"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/binary.sha256"
      - name: Retain native gate results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: b2bi-normal-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
          retention-days: 14
