name: Temporary exact Console regression evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  two-console-fixtures:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 0d897ff0e4f8265eeb8f476ceeddfc8fdf52dad7
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build clean exact product and record identity
        run: |
          test "$(git rev-parse HEAD)" = 0d897ff0e4f8265eeb8f476ceeddfc8fdf52dad7
          test "$(git rev-parse HEAD^{tree})" = 2b807c9fbf5d90cd892140b2a86f5e6936fef928
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          make build
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/console-build.txt"
          grep -F 'vcs.revision=0d897ff0e4f8265eeb8f476ceeddfc8fdf52dad7' "$RUNNER_TEMP/console-build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/console-build.txt"
          mkdir -p reports/console-regression-evidence
          cp "$RUNNER_TEMP/console-build.txt" reports/console-regression-evidence/build.txt
          sha256sum dist/tenkacloud-simulator > reports/console-regression-evidence/binary.sha256
          git rev-parse HEAD HEAD^{tree} > reports/console-regression-evidence/source.txt
      - name: Install original pinned SDK and sandboxed Chromium prerequisites
        run: |
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test -x "$python"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3,12,16)'
          "$python" -m venv /tmp/simulator-tests
          /tmp/simulator-tests/bin/python -m pip install -r scripts/requirements-test.txt
          /tmp/simulator-tests/bin/python -m pip check
          /tmp/simulator-tests/bin/playwright install --with-deps chromium
          /tmp/simulator-tests/bin/python scripts/get-audit-tools.py /tmp/simulator-audit
      - name: Run complete original EC2 Console entry point
        run: |
          set +e
          /tmp/simulator-tests/bin/python test/e2e/ec2_readonly_console.py 2>&1 | tee reports/console-regression-evidence/ec2.log
          codes=("${PIPESTATUS[@]}")
          result=${codes[0]}
          if test "$result" -eq 0 && test "${codes[1]}" -ne 0; then result=${codes[1]}; fi
          set -e
          printf '%s\n' "$result" > reports/console-regression-evidence/ec2.exit
          exit "$result"
      - name: Run complete original language Console entry point
        if: always()
        env:
          AXE_SCRIPT: /tmp/simulator-audit/axe.min.js
        run: |
          set +e
          /tmp/simulator-tests/bin/python test/e2e/console_language.py 2>&1 | tee reports/console-regression-evidence/language.log
          codes=("${PIPESTATUS[@]}")
          result=${codes[0]}
          if test "$result" -eq 0 && test "${codes[1]}" -ne 0; then result=${codes[1]}; fi
          set -e
          printf '%s\n' "$result" > reports/console-regression-evidence/language.exit
          exit "$result"
      - name: Record source-only result receipt
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('reports/console-regression-evidence')
          root.mkdir(parents=True, exist_ok=True)
          exits = {name: int((root / (name + '.exit')).read_text())
                   if (root / (name + '.exit')).exists() else None for name in ('ec2','language')}
          digest = root / 'binary.sha256'
          record = {'source': '0d897ff0e4f8265eeb8f476ceeddfc8fdf52dad7',
                    'tree': '2b807c9fbf5d90cd892140b2a86f5e6936fef928',
                    'binary_sha256': digest.read_text().split()[0] if digest.exists() else None,
                    'entry_point_exits': exits,
                    'scope': 'Complete original entry points; no selected cases, credential/profile overrides, or failure suppression.'}
          (root / 'receipt.json').write_text(json.dumps(record, indent=2) + '\n')
          PY
      - name: Retain safe exact regression evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: console-regression-${{ github.run_id }}
          path: reports/console-regression-evidence/
          if-no-files-found: error
          retention-days: 14
