name: Cloud Trace v1 SDK, Scalar and Console acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 57f3709eb47672dc26241d30d1804303589051a9
      PYTHONPYCACHEPREFIX: /tmp/trace-v1-pycache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 57f3709eb47672dc26241d30d1804303589051a9
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the standalone product from the exact clean source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = 96e82de92ae4dac079aa59f33945ac730ca599f6
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          make build
          mkdir -p "$RUNNER_TEMP/trace-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/trace-receipts/build.txt"
          grep -F "vcs.revision=$SOURCE_SHA" "$RUNNER_TEMP/trace-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/trace-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/trace-receipts/binary.sha256"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/trace-receipts/source.txt"
      - name: Prepare the pinned official Google client and sandboxed Chromium
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv /tmp/trace-v1-tests
          /tmp/trace-v1-tests/bin/python -m pip install -r scripts/requirements-test.txt
          /tmp/trace-v1-tests/bin/playwright install --with-deps chromium
      - name: Run the shipped fixtures with only private loopback available
        run: |
          export PATH="/tmp/trace-v1-tests/bin:$PATH"
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_BINARY_SHA256=$(cut -d " " -f 1 "$RUNNER_TEMP/trace-receipts/binary.sha256")
          export CHROMIUM_EXECUTABLE=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          export TRACE_NAMESPACE_CHECK="$RUNNER_TEMP/trace-check-namespace.py"
          cat > "$TRACE_NAMESPACE_CHECK" <<'PYTHON'
          import os, pathlib, socket, sys
          assert os.geteuid() != 0
          assert [name for _, name in socket.if_nameindex()] == ['lo']
          status = dict(line.split(':', 1) for line in pathlib.Path('/proc/self/status').read_text().splitlines() if ':' in line)
          assert all(int(status[name], 16) == 0 for name in ('CapEff', 'CapAmb', 'CapBnd'))
          assert int(status['NoNewPrivs']) == 1
          fixture = os.environ['TRACE_FIXTURE']
          assert fixture in ('gcp_trace_sdk', 'gcp_trace_scalar', 'gcp_trace_console')
          os.execv(sys.executable, [sys.executable, 'test/e2e/' + fixture + '.py'])
          PYTHON
          for fixture in gcp_trace_sdk gcp_trace_scalar gcp_trace_console; do
            export TRACE_FIXTURE="$fixture"
            set +e
            unshare --user --map-current-user --net --keep-caps sh -ec 'ip link set lo up; exec setpriv --no-new-privs --inh-caps=-all --ambient-caps=-all --bounding-set=-all python "$TRACE_NAMESPACE_CHECK"' > "$RUNNER_TEMP/$fixture.log" 2>&1
            result=$?
            set -e
            python - "$fixture" "$result" <<'PY'
          import json, os, pathlib, re, sys
          name, code = sys.argv[1], int(sys.argv[2])
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          text = (root / (name + '.log')).read_text(errors='replace')
          expected = {
              'gcp_trace_sdk': 'Cloud Trace v1 append, get, three list views, duplicate spans, isolated projects, restart and cleanup passed',
              'gcp_trace_scalar': 'Cloud Trace v1: three real Scalar Sends, official SDK readback, peer isolation and cleanup passed',
          }.get(name)
          receipt = {'source': os.environ['SOURCE_SHA'], 'fixture': name, 'exit': code,
                     'binary': (root/'trace-receipts/binary.sha256').read_text().split()[0]}
          if code == 0:
              if name == 'gcp_trace_console':
                  rendered = [json.loads(line) for line in text.splitlines() if line.startswith('{"ok":')]
                  want = {'ok': True, 'binarySha256': receipt['binary'], 'sdkSeededTraces': 26,
                          'duplicateSpanObservations': 3, 'paging': True, 'nativeErrorRecovery': True,
                          'japaneseNarrow': True, 'peerUnchanged': True, 'restart': True,
                          'participantHidden': True, 'cleanup': True, 'externalCloud': False}
                  assert rendered == [want]
                  receipt['checkedOutcome'] = rendered[0]
              else:
                  assert expected and text.splitlines().count(expected) == 1
                  receipt['checkedOutcome'] = expected
          else:
              receipt['frames'] = [(pathlib.Path(file).name, line) for file,line in
                                   re.findall(r'File "([^"\n]+)", line ([0-9]+)', text)][-10:]
              receipt['exception'] = re.findall(r'^([a-zA-Z_.]*(?:Error|Exception)):', text, re.MULTILINE)[-1:]
          (root/'trace-receipts'/(name + '.json')).write_text(json.dumps(receipt, indent=2) + '\n')
          PY
            test "$result" -eq 0
          done
          test -z "$(git status --porcelain)"
      - name: Preserve fixture, source and build receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trace-native-sdk-scalar-${{ github.run_id }}
          path: ${{ runner.temp }}/trace-receipts/
          if-no-files-found: error
          retention-days: 14
