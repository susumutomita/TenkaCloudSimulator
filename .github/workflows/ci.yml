name: Candidate Secrets Manager SDK and Console evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PRODUCT: b2bb0c42ffb448ecff3f6733038c90764ee8d09c
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: b2bb0c42ffb448ecff3f6733038c90764ee8d09c
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the fixed product and provision its pinned clients and accessibility bundle
        run: |
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/266-secrets-candidate
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = cd252465105099f8a914ea248f1bc239351d31bf
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          umask 077
          mkdir "$RUNNER_TEMP/secrets-receipts" "$RUNNER_TEMP/secrets-private"
          make build
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/secrets-receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/secrets-receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/secrets-receipts/build.txt"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test "$("$python" --version)" = "Python 3.12.16"
          "$python" -m venv "$RUNNER_TEMP/secrets-tools"
          "$RUNNER_TEMP/secrets-tools/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/secrets-tools/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/secrets-tools/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/secrets-private/axe"
      - name: Exercise nine operations with the official SDK, served bodies and sandboxed Console flows
        run: |
          umask 077
          set -euo pipefail
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_REPORTS="$RUNNER_TEMP/secrets-private/screens"
          export AXE_SCRIPT="$RUNNER_TEMP/secrets-private/axe/axe.min.js"
          python="$RUNNER_TEMP/secrets-tools/bin/python"
          "$python" -I -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in (Path.home()/".aws", Path.home()/".boto", "/etc/boto.cfg")); assert "CHROMIUM_EXECUTABLE" not in os.environ'
          export CHROMIUM_EXECUTABLE=$("$python" -I -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          cat > "$RUNNER_TEMP/secrets-private/measure.py" <<'PY'
          import hashlib, json, os, re, socket, subprocess, sys, time
          from pathlib import Path
          from importlib.metadata import version
          tests = Path.cwd() / "test/e2e"
          sys.path.insert(0, str(tests))
          import run_s3_multipart_paging as guard
          uid, net, user = map(int, sys.argv[1:])
          status = Path("/proc/self/status").read_text()
          guard.validate_inside_context(uid, net, user, uid=os.getuid(), euid=os.geteuid(), net=guard.namespace_inode("net"),
                                        user=guard.namespace_inode("user"), status=status,
                                        interfaces=[name for _, name in socket.if_nameindex()], lo_up=guard.loopback_up())
          assert next(r.split()[1] for r in status.splitlines() if r.startswith("CapBnd:")) == "0000000000000000"
          assert (version("boto3"),version("botocore"),version("playwright")) == ("1.42.0","1.41.6","1.62.0")
          temp = Path(os.environ["RUNNER_TEMP"]); private = temp / "secrets-private"
          def sha(path):
              with path.open("rb") as f: return hashlib.file_digest(f,"sha256").hexdigest()
          binary = Path(os.environ["SIMULATOR_BINARY"]); digest = sha(binary)
          cases = {"secrets_manager": 0, "secrets_manager_docs": 0, "secrets_versions": 0, "secrets_metadata_update": 0,
                   "secrets_manager_console": 2, "secret_versions_console": 1, "secret_description_console": 1}
          result = {"product":os.environ["PRODUCT"],"binarySHA256":digest,"workflow":os.environ["GITHUB_SHA"],"cases":[]}
          receipt = temp / "secrets-receipts/cases.json"
          for case, launches in cases.items():
              assert sha(binary) == digest
              source = tests / (case+".py"); path = source
              if launches:
                  # Retain every browser and state assertion. Replace only the historical opt-out with the Chromium sandbox.
                  text = source.read_text()
                  protected, count = re.subn(r"""args=\[(["'])--no-sandbox\1\]""", "chromium_sandbox=True", text)
                  assert count == launches and "--no-sandbox" not in protected
                  path = private / (case+".py")
                  path.write_text(protected)
              start = time.monotonic()
              proc = subprocess.run([sys.executable,"-B",str(path)], capture_output=True, timeout=300,
                                    env=os.environ | {"PYTHONPATH":str(tests)})
              case_result = {"fixture":case,"sourceSHA256":sha(source),"executedSHA256":sha(path),"sandboxedLaunchSites":launches,
                             "exit":proc.returncode,"durationSeconds":round(time.monotonic()-start,2)}
              if proc.returncode:
                  last = proc.stderr.splitlines()[-1] if proc.stderr else b""
                  typ = re.match(rb"(AssertionError|RuntimeError|TimeoutError|ImportError|ModuleNotFoundError|ProfileNotFound|KeyError|ClientError|playwright\._impl\._errors\.TimeoutError):",last)
                  case_result["exceptionClass"] = typ[1].decode("ascii") if typ else "unclassified"
                  frames = re.findall(rb'File "[^"\n]*/[a-z_]+\.py", line (\d{1,4}), in ([a-zA-Z_][a-zA-Z_0-9]{0,49}|<module>)',proc.stderr)
                  case_result["lastFrameLine"] = int(frames[-1][0]) if frames else None
              result["cases"].append(case_result)
              receipt.write_text(json.dumps(result,indent=2)+"\n")
              print(case,proc.returncode)
          assert all(case["exit"] == 0 for case in result["cases"]) and sha(binary)==digest
          PY
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' secrets "$python" -IB "$RUNNER_TEMP/secrets-private/measure.py" "$(id -u)" "$(stat -Lc %i /proc/self/ns/net)" "$(stat -Lc %i /proc/self/ns/user)"
      - name: Retain executable identity and sanitized fixture results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: secrets-nine-sdk-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secrets-receipts/
          if-no-files-found: error
          retention-days: 14
