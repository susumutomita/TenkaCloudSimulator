name: Verify nine real Secrets Manager Scalar Sends and same-resource Console readback
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PRODUCT: b97ddbd26f3e78905bd8e26a944fb7f0a28d8a42
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: b97ddbd26f3e78905bd8e26a944fb7f0a28d8a42
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the exact product and provision its pinned Chromium
        run: |
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/266-final-main-scalar
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = 51963bb256578ccbbd6a80cd8b13843baba2b340
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          umask 077
          mkdir "$RUNNER_TEMP/secrets-receipts" "$RUNNER_TEMP/secrets-private"
          make build
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/secrets-receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/secrets-receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/secrets-receipts/build.txt"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test "$("$python" --version)" = "Python 3.12.16"
          "$python" -m venv "$RUNNER_TEMP/secrets-tools"
          test "$(grep -Fx playwright==1.62.0 scripts/requirements-test.txt)" = playwright==1.62.0
          "$RUNNER_TEMP/secrets-tools/bin/python" -m pip install playwright==1.62.0
          "$RUNNER_TEMP/secrets-tools/bin/playwright" install --with-deps chromium
      - name: Run the original nine browser sends against the merged examples
        run: |
          set -euo pipefail
          umask 077
          python="$RUNNER_TEMP/secrets-tools/bin/python"
          "$python" -I -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in (Path.home()/".aws", Path.home()/".boto", "/etc/boto.cfg")); assert "CHROMIUM_EXECUTABLE" not in os.environ'
          cat > "$RUNNER_TEMP/secrets-private/scalar_nine_console.py" <<'PYTHON'
          """Private same-team #630 witness. Emit only checked operation names, states and no values."""
          import hashlib, json, os, re, socket, subprocess, tempfile, time, traceback
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import build_opener, Request, ProxyHandler
          from playwright.sync_api import sync_playwright, expect

          BINARY=Path.cwd()/'dist/tenkacloud-simulator'
          DIGEST='bbeb5ea2f939e98df573ca6e84a217ef4ac4ab0efc275c38526854c78590db82'
          BASE='b97ddbd26f3e78905bd8e26a944fb7f0a28d8a42'
          PLACE=Path(os.environ['RUNNER_TEMP'])/'secrets-private'
          MEDIA='application/x-amz-json-1.1'
          ACTIONS=['CreateSecret','ListSecrets','DescribeSecret','PutSecretValue','GetSecretValue','ListSecretVersionIds','UpdateSecretVersionStage','UpdateSecret','DeleteSecret']
          ROTATION={'RotationEnabled','RotationRules','RotationLambdaARN','LastRotatedDate','NextRotationDate'}
          stage='preflight'
          receipt={'source':BASE,'binarySHA256':DIGEST,'browserSends':[]}

          def required(x,reason):
              if not x: raise ValueError(reason)

          def run():
              global stage
              with BINARY.open('rb') as stream: required(hashlib.file_digest(stream,'sha256').hexdigest()==DIGEST,'source')
              required(os.geteuid()>0 and tuple(n for _,n in socket.if_nameindex())==('lo',),'namespace')
              with tempfile.TemporaryDirectory(dir=PLACE) as tmp, socket.socket() as reserved:
                  p=Path(tmp); tok=p/'operator-token'
                  reserved.bind(('127.0.0.1',0)); port=reserved.getsockname()[1];reserved.close()
                  url=f'http://127.0.0.1:{port}'; http=build_opener(ProxyHandler({}))
                  process=subprocess.Popen([BINARY,'--listen',f'127.0.0.1:{port}','--state',p/'state.db','--token-file',tok],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
                  arn=None; deleted=False
                  try:
                      for _ in range(160):
                          try:
                              token=tok.read_text().strip()
                              with http.open(Request(url+'/_simulator/health',headers={'X-Simulator-Token':token}),timeout=1) as r:required(r.status==200,'health')
                              break
                          except OSError:time.sleep(.1)
                      else:raise ValueError('startup')
                      def native(op,params):
                          hdr={'Content-Type':MEDIA,'X-Simulator-Token':token,'X-Simulator-Service':'secretsmanager','X-Simulator-Region':'us-east-1','X-Amz-Target':'secretsmanager.'+op}
                          with http.open(Request(url+'/',method='POST',data=json.dumps(params).encode(),headers=hdr),timeout=3) as response:
                              required(response.status==200,'native');return json.load(response)
                      def metadata(v):
                          public=json.dumps(v)
                          required('SecretString' not in public and 'SecretBinary' not in public and 'DUMMY-secret-' not in public,'redaction')
                      with sync_playwright() as pw:
                          browser=pw.chromium.launch(chromium_sandbox=True)
                          outside=[]; ctx=browser.new_context(service_workers='block',locale='en-US')
                          def guard(route):
                              if route.request.url.startswith(url+'/'):route.continue_()
                              else:outside.append(True);route.abort()
                          ctx.route('**/*',guard); login=ctx.new_page()
                          login.goto(url+'/_simulator/console/')
                          login.get_by_label('Access token',exact=True).fill(token);login.get_by_role('button',name='Open sandbox',exact=True).click()
                          expect(login.get_by_role('button',name='Services',exact=True)).to_be_visible()
                          cookies=ctx.cookies();capture=ctx.new_page()
                          with capture.expect_response(lambda r:r.url==url+'/_simulator/docs/openapi.json') as snap:capture.goto(url+'/_simulator/docs/')
                          spec=snap.value.json(); root=spec['paths']['/']['post'];examples=root['requestBody']['content'][MEDIA]['examples']
                          required(root['operationId']=='awsRegionalOperation' and set(ACTIONS)<=examples.keys(),'served examples')
                          name=examples['CreateSecret']['value']['Name'];first=None;second=None
                          for op in ACTIONS:
                              stage=op+'-open'
                              fresh=browser.new_context(service_workers='block',locale='en-US',storage_state={'cookies':cookies,'origins':[]})
                              try:
                                  fresh.route('**/*',guard);page=fresh.new_page();page.set_default_timeout(7500)
                                  posts=[];page.on('request',lambda req:posts.append(req) if req.method=='POST' and req.url==url+'/' else None)
                                  page.goto(url+'/_simulator/docs/')
                                  page.get_by_role('link',name='Shared AWS JSON/Query endpoint',exact=True).click()
                                  page.get_by_test_id('example-picker').click()
                                  page.get_by_role('option',name=examples[op]['summary'],exact=True).click()
                                  page.get_by_role('button',name='Test Request (post /)',exact=True).click()
                                  dialog=page.get_by_role('dialog').filter(has=page.get_by_role('button',name='Close Client',exact=True))
                                  request=dialog.get_by_role('region',name='Request: '+root['summary'],exact=True)
                                  stage=op+'-body'
                                  request.get_by_role('tab',name='Body',exact=True).press('Enter')
                                  editor=request.locator('.cm-content[contenteditable=true]:visible')
                                  example=examples[op]['value'].copy()
                                  required(json.loads(editor.inner_text())==example,'selected example body')
                                  payload=example.copy()
                                  if 'SecretId' in payload:payload['SecretId']=arn
                                  if op=='UpdateSecretVersionStage':
                                      payload['MoveToVersionId']=first;payload['RemoveFromVersionId']=second
                                  if payload!=example:
                                      editor.click();editor.press('ControlOrMeta+a');page.keyboard.insert_text(json.dumps(payload))
                                      required(json.loads(editor.inner_text())==payload,'editor body')
                                  stage=op+'-headers'
                                  request.get_by_role('tab',name='Headers',exact=True).press('Enter')
                                  service=request.get_by_role('row',name=re.compile('^Include X-Simulator-Service in request '))
                                  service.get_by_role('button',name=re.compile('^(ssm|secretsmanager)$')).click()
                                  page.get_by_role('menuitem',name='secretsmanager',exact=True).click()
                                  service.get_by_role('checkbox').check()
                                  target=request.get_by_role('row',name=re.compile('^Include X-Amz-Target in request '))
                                  target.locator('[contenteditable=true][aria-label=" Value"]').fill('secretsmanager.'+op)
                                  target.get_by_role('checkbox').check()
                                  request.get_by_role('checkbox',name='Include X-Simulator-Region in request',exact=True).uncheck()
                                  required(not posts,'early request')
                                  stage=op+'-send'
                                  with page.expect_response(lambda r:r.request.method=='POST' and r.url==url+'/') as resp:
                                      dialog.get_by_role('button',name=re.compile('^Send post request to ')).click()
                                  response=resp.value;wire=response.request
                                  required(posts==[wire] and wire.post_data_json==payload,'observed request')
                                  heads=wire.all_headers()
                                  required(bool(heads.get('cookie')) and heads.get('x-simulator-service')=='secretsmanager' and heads.get('x-amz-target')=='secretsmanager.'+op and heads['content-type'].split(';')[0]==MEDIA,'headers')
                                  required(not {'x-simulator-token','x-simulator-principal','authorization'}&heads.keys(),'authority')
                                  required(response.status==200 and response.headers.get('cache-control')=='no-store' and response.headers.get('x-simulator-encryption')=='none','response status')
                                  value=response.json()
                                  if op=='CreateSecret':arn=value['ARN']
                                  panel=dialog.locator('.response-section-content-body').filter(has=page.get_by_role('link',name='Download Response Body',exact=True))
                                  expect(panel).to_be_visible()
                                  if op!='GetSecretValue':metadata(value)
                                  stage=op+'-state'
                                  if op=='CreateSecret':
                                      arn=value['ARN'];first=value['VersionId'];required(value['Name']==name and first==payload['ClientRequestToken'],'create')
                                  elif op=='ListSecrets':
                                      item=next(i for i in value['SecretList'] if i['ARN']==arn)
                                      required(not ROTATION&item.keys() and item['SecretVersionsToStages']=={first:['AWSCURRENT']},'list')
                                  elif op=='DescribeSecret':
                                      required(value['ARN']==arn and not ROTATION&value.keys() and value['VersionIdsToStages']=={first:['AWSCURRENT']},'describe')
                                  elif op=='PutSecretValue':
                                      second=value['VersionId'];required(first!=second and second==payload['ClientRequestToken'],'put')
                                  elif op=='GetSecretValue':
                                      selected=native('DescribeSecret',{'SecretId':arn})['VersionIdsToStages']
                                      version=next(k for k,v in selected.items() if payload.get('VersionStage','AWSCURRENT') in v)
                                      expected=examples['PutSecretValue' if version==second else 'CreateSecret']['value']['SecretString']
                                      required(value['VersionId']==version and value['SecretString']==expected,'get')
                                  elif op=='ListSecretVersionIds':
                                      required(value['ARN']==arn and {v['VersionId'] for v in value['Versions']}=={first,second},'version list')
                                  elif op=='UpdateSecretVersionStage':
                                      required(native('DescribeSecret',{'SecretId':arn})['VersionIdsToStages']=={first:['AWSCURRENT'],second:['AWSPREVIOUS']},'labels')
                                  elif op=='UpdateSecret':
                                      obj=native('DescribeSecret',{'SecretId':arn})
                                      required(set(value)=={'ARN','Name'} and value['ARN']==arn and obj['Description']==payload['Description'] and set(obj['VersionIdsToStages'])=={first,second},'description')
                                      stage='UpdateSecret-console-readback'
                                      login.goto(url+'/_simulator/console/#/secretsmanager')
                                      login.get_by_role('tab',name='Edit description',exact=True).click()
                                      login.get_by_label('Secret ARN for description',exact=True).fill(arn)
                                      with login.expect_response(lambda rr:rr.url==url+'/' and rr.request.headers.get('x-amz-target')=='secretsmanager.DescribeSecret') as update_view:
                                          login.get_by_role('button',name='Refresh description metadata',exact=True).click()
                                      view=update_view.value; observed=view.json()
                                      required(view.status==200 and observed['ARN']==arn and observed['Description']==payload['Description'],'description')
                                      metadata(observed)
                                      expect(login.get_by_label('Current saved description',exact=True)).to_have_value(payload['Description'])
                                      receipt['sameResourceConsoleReadback']=True
                                  elif op=='DeleteSecret':
                                      required(value['ARN']==arn and native('ListSecrets',{})['SecretList']==[],'delete')
                                      try:native('DescribeSecret',{'SecretId':arn})
                                      except HTTPError as err:required(err.code==400 and 'ResourceNotFoundException' in err.headers.get('x-amzn-errortype',''),'absence')
                                      else:raise ValueError('still exists')
                                      deleted=True
                                  receipt['browserSends'].append({'target':op,'httpStatus':response.status,'received':1})
                                  print('checked',op,flush=True)
                              finally:fresh.close()
                          required(not outside and len(receipt['browserSends'])==9,'completion')
                          ctx.close();browser.close()
                  finally:
                      if arn and not deleted:
                          try:native('DeleteSecret',{'SecretId':arn,'ForceDeleteWithoutRecovery':True})
                          except Exception:pass
                      process.terminate();process.wait(timeout=10)
              required(not Path(tmp).exists(),'temporary cleanup')
              receipt.update(checkedContent=True,ownedSecretAbsent=True,temporaryStateRemoved=True,outsideRequests=0,isolatedBrowserSandbox=True)
          if __name__=='__main__':
              try:run()
              except Exception as e:
                  loc=[f.lineno for f in traceback.extract_tb(e.__traceback__) if f.filename==__file__]
                  receipt.update(failure={'stage':stage,'class':type(e).__name__,'frames':loc,'reason':str(e) if type(e) is ValueError and str(e) in ['source','namespace','health','startup','native','redaction','served examples','selected example body','editor body','early request','observed request','headers','authority','response status','create','list','describe','put','get','version list','labels','description','delete','absence','still exists','completion','temporary cleanup'] else 'unclassified'})
              (PLACE/'scalar-console-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
              print(json.dumps(receipt,indent=2));raise SystemExit('failure' in receipt)
          PYTHON
          sha256sum "$RUNNER_TEMP/secrets-private/scalar_nine_console.py" | cut -d ' ' -f 1 > "$RUNNER_TEMP/secrets-receipts/witness.sha256"
          test "$(cat "$RUNNER_TEMP/secrets-receipts/witness.sha256")" = 43ef7a544b735049aded2eff7ff30101e8f85fb7673393d06c49ec45818416b2
          cat > "$RUNNER_TEMP/secrets-private/run.py" <<'PYTHON'
          import hashlib, json, os, runpy, socket, sys
          from importlib.metadata import version
          from pathlib import Path
          import playwright
          sys.path.insert(0, str(Path.cwd() / 'test/e2e'))
          import run_s3_multipart_paging as guard
          uid, net, user = map(int, sys.argv[1:])
          status = Path('/proc/self/status').read_text()
          guard.validate_inside_context(uid, net, user, uid=os.getuid(), euid=os.geteuid(), net=guard.namespace_inode('net'), user=guard.namespace_inode('user'), status=status, interfaces=[n for _, n in socket.if_nameindex()], lo_up=guard.loopback_up())
          assert next(r.split()[1] for r in status.splitlines() if r.startswith('CapBnd:')) == '0000000000000000'
          assert version('playwright') == '1.62.0'
          versions = json.loads((Path(playwright.__file__).parent / 'driver/package/browsers.json').read_text())
          browser = next(b for b in versions['browsers'] if b['name']=='chromium-headless-shell')
          evidence = Path(os.environ['RUNNER_TEMP']) / 'secrets-receipts'
          (evidence/'browser.json').write_text(json.dumps({'playwright':version('playwright'), 'browser':browser, 'privateLoopback':True,'zeroCapabilities':True}) + chr(10))
          runpy.run_path(str(Path(__file__).with_name('scalar_nine_console.py')), run_name='__main__')
          PYTHON
          result=0
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' secrets "$python" -IB "$RUNNER_TEMP/secrets-private/run.py" "$(id -u)" "$(stat -Lc %i /proc/self/ns/net)" "$(stat -Lc %i /proc/self/ns/user)" || result=$?
          if test -f "$RUNNER_TEMP/secrets-private/scalar-console-receipt.json"; then
            cp "$RUNNER_TEMP/secrets-private/scalar-console-receipt.json" "$RUNNER_TEMP/secrets-receipts/"
          fi
          test "$result" -eq 0
          test -z "$(git status --porcelain)"
      - name: Retain sanitized operation, cleanup and provenance receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: secrets-nine-scalar-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secrets-receipts/
          if-no-files-found: error
          retention-days: 14
