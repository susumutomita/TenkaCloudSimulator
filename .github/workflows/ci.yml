name: Verify the local SES domain, SDK, mailbox, Console and Scalar
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: c1d176bc17782b7c3a44232a26c179d5cc6c0274
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify pinned source and compile the standalone simulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/98-c1d176b-local-mail
          test "$(git rev-parse HEAD)" = c1d176bc17782b7c3a44232a26c179d5cc6c0274
          test "$(git rev-parse 'HEAD^{tree}')" = 81d1caed506b850ad3cc94ed37bbf5256621d427
          test -z "$(git status --porcelain)"
          printf '%s\n' '572f8b4a4b07ae4f03227d5f8573b9f53868f39dd6159fc89b062288acedfefb  test/e2e/ses_domain_identity.py' '7d75ef091a0cd15844fde21f51fc938f168a8f9e9d89f7e80467920fc12ce80c  test/e2e/sts_session_lifecycle.py' | sha256sum -c -
          echo "df64f872c2fc50839b6dce9b617b5204ea96853dd0567b7c90b5eab1e9b2e232  test/e2e/ses_local_mail.py" | sha256sum -c -
          echo "e38d53435097c628d541a0cb5bf14c75b18987f07a67c4e337498f08a2c9e8a3  test/e2e/ses_local_mail_console.py" | sha256sum -c -
          echo "10aa87156f18bbfec691586fd4ec828fce87a8e9f08b17fa70bc8920b9fd4dc0  test/e2e/reflow.py" | sha256sum -c -
          echo "fcd4e865e3b8f3e82920f199e88ad0ed8e80058f3f553751bd8ab658ad2be31c  scripts/get-audit-tools.py" | sha256sum -c -
          make build
          mkdir -m 700 "$RUNNER_TEMP/ses-proof"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/ses-proof/build.txt"
          grep -Fx $'\tbuild\tvcs.modified=false' "$RUNNER_TEMP/ses-proof/build.txt"
          grep -Fx $'\tbuild\tvcs.revision=c1d176bc17782b7c3a44232a26c179d5cc6c0274' "$RUNNER_TEMP/ses-proof/build.txt"
          printf '%s\n' '54b2ac9cd78bee7ae958433d061cd48dcb92b19637850e20b2de26b596155174  dist/tenkacloud-simulator' | sha256sum -c -
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/ses-proof/binary.sha256"
          git fetch --no-tags --depth=1 origin 110354ea421d576f12b9452e0d472eda2077cc11
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/check-formal-applicability.py check --base 110354ea421d576f12b9452e0d472eda2077cc11 > "$RUNNER_TEMP/ses-proof/applicability.txt"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/ses-tools"
          "$RUNNER_TEMP/ses-tools/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/ses-tools/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/ses-tools/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/ses-audit"
      - name: Run the genuine SDK and both browser surfaces on private loopback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python="$RUNNER_TEMP/ses-tools/bin/python"
          "$python" -I -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in (Path.home()/".aws", Path.home()/".boto", "/etc/boto.cfg"))'
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' ses-proof "$python" -B -c '
          import os, socket, sys, subprocess, re
          from pathlib import Path
          uid, oldnet, olduser = map(int, sys.argv[1:])
          status = Path("/proc/self/status").read_text()
          assert uid>0 and os.getuid()==uid and os.stat("/proc/self/ns/net").st_ino!=oldnet and os.stat("/proc/self/ns/user").st_ino!=olduser
          for kind in ("CapEff", "CapPrm", "CapBnd"): assert int(re.search(r"^"+kind+r":\s*([a-fA-F0-9]+)$", status, re.M)[1],16)==0
          assert socket.if_nameindex()==[(1,"lo")]
          cmd=[sys.executable,"-B","test/e2e/ses_domain_identity.py","--binary",str(Path("dist/tenkacloud-simulator").resolve()),"--binary-sha256","54b2ac9cd78bee7ae958433d061cd48dcb92b19637850e20b2de26b596155174"]
          r=subprocess.run(cmd,capture_output=True,text=True,timeout=120)
          if r.returncode:
              print("fixture frames",re.findall(r'\''File "[^"\n]*/([a-z_]+\.py)", line (\d+), in ([a-zA-Z_][\w]*|<module>)'\'',r.stderr)[-6:])
              sys.exit(r.returncode)
          receipt=r.stdout.strip()
          assert re.fullmatch(r"SESv2/Route53 stock SDK passed [1-9][0-9]+ signed requests and responses; two teams, restart, cleanup",receipt)
          Path(os.environ["RUNNER_TEMP"],"ses-proof","receipt.txt").write_text(receipt+"\nPrivate user and network namespace, loopback only, dropped capabilities.\n")
          print(receipt)
          import json
          root=Path(os.environ["RUNNER_TEMP"])
          for fixture in ("ses_local_mail.py","ses_local_mail_console.py"):
              args=[sys.executable,"-B","test/e2e/"+fixture,*cmd[3:]]
              if fixture.endswith("_console.py"): args.extend(["--axe",str(root/"ses-audit"/"axe.min.js")])
              result=subprocess.run(args,capture_output=True,text=True,timeout=220)
              if result.returncode:
                  frames=re.findall(r"File \"[^\"\n]*/([a-z_]+\.py)\", line (\d+), in ([a-zA-Z_][\w]*|<module>)",result.stderr)
                  print(fixture,"failed frames",frames[-7:])
                  sys.exit(result.returncode)
              value=json.loads(result.stdout)
              assert value["stockSDK"] and value["signed"]==value["responses"] and value["signed"]>=25
              assert value["reopen"]==2 and value["cleanup"] and value["downloadVerifiedAfterRestart"]
              accepted=[value[k] for k in ("simpleMessageId","templateMessageId","rejectedMessageId")]
              assert len(set(accepted))==3 and all(re.fullmatch("[a-z2-7]{32}",i) for i in accepted)
              assert (value["localOutcome"],value["unknownMailboxOutcome"],value["rejectedContentBytes"])==("delivered","rejected",0)
              browser=value["browser"]
              if fixture.endswith("_console.py"):
                  assert browser["scalar"]==["SendEmail"] and browser["unknownAutoSends"]==0 and browser["lostAcknowledgements"]==1
                  assert browser["staleReadIgnored"] and browser["consolePurgeConfirmed"]
                  assert browser["audits"]==["en-1440-delivered","en-1440-unknown","ja-390-receipts"]
                  assert {200,204,400,403} <= {c[2] for c in browser["browserCalls"]}
              else: assert browser is None
              (root/"ses-proof"/(fixture+".json")).write_text(json.dumps(value,indent=2)+"\n")
              print(fixture,value["signed"],"stock requests/responses; two CLI databases reopened and cleaned")
          ' "$(id -u)" "$(stat -Lc %i /proc/self/ns/net)" "$(stat -Lc %i /proc/self/ns/user)"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ses-mailbox-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ses-proof
          if-no-files-found: error
          retention-days: 7
