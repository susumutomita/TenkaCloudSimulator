name: Historical SimpleDB simulator build
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  build-historical-simulator:
    name: Build the fixed historical Linux simulator
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REPOSITORY: susumutomita/TenkaCloudSimulator
      SOURCE_REVISION: d95f8dbc3e6ddec4c65bc9d5e0124616a0e591da
      SOURCE_TREE: 9d4033d72d242d7d8c7483bd594c43426609b60c
      GOTOOLCHAIN: local
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: susumutomita/TenkaCloudSimulator
          ref: d95f8dbc3e6ddec4c65bc9d5e0124616a0e591da
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: false
      - name: Check the canonical source and historical toolchain
        run: |
          test "$GITHUB_REPOSITORY" = "$SOURCE_REPOSITORY"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(go env GOHOSTOS)/$(go env GOHOSTARCH)" = linux/amd64
          grep -Fx 'go 1.26.3' go.mod
      - name: Build the repository target and record its VCS stamp
        run: |
          output="$RUNNER_TEMP/historical-build"
          mkdir "$output"
          go mod download
          go mod verify
          make build
          test -z "$(git status --porcelain)"
          binary=dist/tenkacloud-simulator
          go version -m "$binary" > "$output/build-info.txt"
          for setting in "vcs.revision=$SOURCE_REVISION" vcs.modified=false CGO_ENABLED=0 GOOS=linux GOARCH=amd64 GOAMD64=v1; do
            grep -Fx "$(printf '\tbuild\t%s' "$setting")" "$output/build-info.txt"
          done
          readelf -h "$binary" > "$output/elf-header.txt"
          grep -Eq 'Class:[[:space:]]+ELF64' "$output/elf-header.txt"
          grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' "$output/elf-header.txt"
          tar --format=ustar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner --mode=0755 \
            -cf - -C dist tenkacloud-simulator | gzip -n > "$output/simulator-linux-amd64.tar.gz"
          binary_sha=$(sha256sum "$binary" | cut -d ' ' -f 1)
          archive_sha=$(sha256sum "$output/simulator-linux-amd64.tar.gz" | cut -d ' ' -f 1)
          test "$(tar -tzf "$output/simulator-linux-amd64.tar.gz")" = tenkacloud-simulator
          test "$(tar -xOzf "$output/simulator-linux-amd64.tar.gz" tenkacloud-simulator | sha256sum | cut -d ' ' -f 1)" = "$binary_sha"
          jq -n --arg repository "https://github.com/$SOURCE_REPOSITORY" --arg revision "$SOURCE_REVISION" \
            --arg tree "$SOURCE_TREE" --arg version "$(go env GOVERSION)" --arg binary "$binary_sha" --arg archive "$archive_sha" \
            --arg wrapper "$GITHUB_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{sourceRepository:$repository,sourceRevision:$revision,sourceTree:$tree,toolchain:$version,
              target:"linux/amd64",goAMD64:"v1",command:"make build",buildFlags:["-trimpath","-ldflags=-s -w"],
              binarySHA256:$binary,archiveSHA256:$archive,
              workflowRevision:$wrapper,workflowRun:$run}' > "$output/build-evidence.json"
      - name: Retain the binary archive and build evidence
        uses: actions/upload-artifact@v7.0.2
        with:
          name: historical-simulator-d95f8db-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/historical-build/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
