name: Verify the SES v2 template preview
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    name: SES v2 template preview / ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: before-commit
            os: ubuntu-24.04
          - check: sdk
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: e95246d069b72196955aeba84c9b503857a107a7
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify the immutable source, toolchain and neutral runner
        run: |
          test "$(git rev-parse HEAD)" = e95246d069b72196955aeba84c9b503857a107a7
          test "$(git rev-parse HEAD^{tree})" = a9db27000ca1e91f0c60a0690f25a59cfc16e91c
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          mkdir -m 700 -p "$RUNNER_TEMP/ses-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ses-evidence/source.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert not any(key.startswith(('AWS_', 'BOTO_')) for key in os.environ)
          assert not any(os.environ.get(key) for key in ('GOFLAGS', 'MAKEFLAGS', 'GO_TEST_RUN_FILE', 'GO_TEST_PACKAGES'))
          paths = [Path.home() / p for p in ('.aws/config', '.aws/credentials', '.boto')]
          assert not any(path.exists() or path.is_symlink() for path in [*paths, Path('/etc/boto.cfg')])
          PY
      - name: Run the unfiltered standard repository gate
        if: matrix.check == 'before-commit'
        run: |
          umask 077
          set +e
          make before-commit > "$RUNNER_TEMP/ses-private.log" 2>&1
          status=$?
          set -e
          printf '%d\n' "$status" > "$RUNNER_TEMP/ses-evidence/make-exit.txt"
          exit "$status"
      - name: Build the simulator for the SDK
        if: matrix.check == 'sdk'
        run: make build
      - name: Identify the exact binary
        run: |
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/ses-evidence/build.txt"
          grep -F 'vcs.revision=e95246d069b72196955aeba84c9b503857a107a7' "$RUNNER_TEMP/ses-evidence/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/ses-evidence/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/ses-evidence/binary.sha256"
          test "$(cut -d ' ' -f 1 "$RUNNER_TEMP/ses-evidence/binary.sha256")" = afdc270e9706eb4e6c460ef3584c4ce6a1066407f4e035c1cb4ab45e88e3c003
      - name: Install the pinned SDK
        if: matrix.check == 'sdk'
        run: |
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'
          "$python" -m venv "$RUNNER_TEMP/ses-venv"
          "$RUNNER_TEMP/ses-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/ses-venv/bin/pip" check
          "$RUNNER_TEMP/ses-venv/bin/python" - <<'PYTHON' > "$RUNNER_TEMP/ses-evidence/sdk.txt"
          from importlib.metadata import version
          assert version('boto3') == '1.42.0' and version('botocore') == '1.41.6'
          print('boto3', version('boto3'), 'botocore', version('botocore'))
          PYTHON
      - name: Exercise SES v2 template preview with stock boto3
        if: matrix.check == 'sdk'
        run: |
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export PYTHONDONTWRITEBYTECODE=1
          result=0
          "$RUNNER_TEMP/ses-venv/bin/python" test/e2e/aws_catalog_fixtures.py sesv2 > "$RUNNER_TEMP/ses-private.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/ses-evidence/sdk-exit.txt"
          test "$result" -eq 0 || exit "$result"
          grep -Fx 'Catalog fixture lifecycles passed for sesv2' "$RUNNER_TEMP/ses-private.log" > "$RUNNER_TEMP/ses-evidence/fixture-result.txt"
          sha256sum --check "$RUNNER_TEMP/ses-evidence/binary.sha256"
      - name: Record test counts and failure locations
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          out = temp / 'ses-evidence'
          out.mkdir(exist_ok=True)
          log = temp / 'ses-private.log'
          body = log.read_text(errors='replace') if log.is_file() else ''
          known = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          found = [(path.removeprefix(str(Path.cwd()) + '/'), int(line)) for path, line in re.findall(r'File "([^"\n]+)", line (\d+)', body)]
          module = 'github.com/susumutomita/TenkaCloudSimulator'
          packages = {module + '/' + str(Path(path).parent) for path in known if path.endswith('.go')}
          go_tests = set()
          for path in known:
              if path.endswith('_test.go'):
                  go_tests.update(re.findall(r'^func (Test[A-Za-z0-9_]+)\(', Path(path).read_text(), re.M))
          failed_packages = sorted(packages.intersection(re.findall(r'^FAIL\s+(\S+)', body, re.M)))
          failed_tests = sorted(go_tests.intersection(re.findall(r'^\s*--- FAIL: (Test[A-Za-z0-9_]+)', body, re.M)))
          terms = ('test timed out', 'no such table', 'race detected', 'permission denied', 'deadline exceeded', 'no space left on device', 'connection reset', 'signal: killed')
          coverage = re.search(r'^Go statements \(full module\): (\d+/\d+ \([\d.]+%; minimum \d+%\))$', body, re.M)
          data = {'go_packages_passed':len(re.findall(r'^ok\s+', body, re.M)), 'coverage':coverage.group(1) if coverage else None,
                  'locations':[{'path':path,'line':line} for path,line in found if path in known],
                  'failed_packages': failed_packages, 'failed_tests': failed_tests,
                  'fixed_diagnostics': [term for term in terms if term in body.lower()]}
          (out / 'checks.json').write_text(json.dumps(data)+'\n')
          PY
          test -z "$(git status --porcelain)"
      - name: Retain scoped verification receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ses-template-preview-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ses-evidence
          if-no-files-found: error
          retention-days: 14
