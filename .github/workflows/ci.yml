name: Kinesis Video catalog acceptance trial
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 047be001fb2b0758f3b846ead7f17654990e7a88
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the exact clean product before receipts
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = 047be001fb2b0758f3b846ead7f17654990e7a88
          test -z "$(git status --porcelain)"
          make build
          mkdir -p "$RUNNER_TEMP/280-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/280-receipts/build.txt"
          grep -F 'vcs.revision=047be001fb2b0758f3b846ead7f17654990e7a88' "$RUNNER_TEMP/280-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/280-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/280-receipts/binary.sha256"
      - name: Prepare stock pinned SDK, axe and Chromium
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv /tmp/kvs-tests
          /tmp/kvs-tests/bin/python -m pip install -r scripts/requirements-test.txt
          /tmp/kvs-tests/bin/playwright install --with-deps chromium
          /tmp/kvs-tests/bin/python scripts/get-audit-tools.py /tmp/kvs-audit
      - name: Invoke the unchanged full fixture and focused helper separately
        run: |
          cat > "$RUNNER_TEMP/280-focused.py" <<'PY'
          """Unchanged SDK guard and genuine focused invocation of the shipped helper."""
          import hashlib
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          import tempfile
          import boto3

          # Preserve normal inherited SDK profile/config selection; do this before harness imports.
          boto3.Session()
          root = Path.cwd()
          sha = '047be00'
          assert subprocess.check_output(['git', 'rev-parse', '--short=7', 'HEAD'], text=True).strip() == sha
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          binary = Path(os.environ['SIMULATOR_BINARY']).resolve(strict=True)
          assert hashlib.file_digest(binary.open('rb'), 'sha256').hexdigest() == os.environ['SIMULATOR_BINARY_SHA256']
          stamp = subprocess.check_output([os.environ['VERIFICATION_GO'], 'version', '-m', str(binary)], text=True)
          assert 'vcs.modified=false' in stamp and 'vcs.revision=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() in stamp
          sys.path.insert(0, str(root / 'test/e2e'))
          from aws_catalog import Team
          from aws_catalog_console import check_versioned_edits
          from playwright.sync_api import expect, sync_playwright
          with tempfile.TemporaryDirectory(prefix='kinesis-video-browser-') as directory:
              team = Team(directory)
              team.start()
              try:
                  with sync_playwright() as p:
                      with p.chromium.launch(executable_path=os.environ['CHROMIUM_EXECUTABLE'], chromium_sandbox=True,
                              args=['--proxy-server=http://127.0.0.1:9', '--proxy-bypass-list=127.0.0.1',
                                    '--host-resolver-rules=MAP * ~NOTFOUND, EXCLUDE 127.0.0.1']) as browser:
                          page = browser.new_page()
                          page.goto(team.endpoint + '/_simulator/console/')
                          page.get_by_label('Access token', exact=True).fill(team.token)
                          page.get_by_role('button', name='Open sandbox', exact=True).click()
                          page.get_by_role('button', name='Services', exact=True).click()
                          page.get_by_role('menuitem', name='Service catalog', exact=True).click()
                          expect(page.get_by_role('heading', level=1, name='AWS service catalog')).to_be_visible()
                          def field(member):
                              return page.locator(f'[id="catalog-field-{member}"]')
                          def back():
                              page.get_by_role('navigation', name='Catalog location').get_by_role('link').nth(1).click()
                              expect(page.get_by_role('heading', level=1, name='AWS service catalog')).to_be_visible()
                          check_versioned_edits(page, team, field, back)
              finally:
                  team.stop()
          print('Exact native SDK and Console versioned Network Firewall, MediaType and retention checks passed')
          PY
          cat > "$RUNNER_TEMP/280-full.py" <<'PY'
          """Run the existing full catalog fixture with the real Chromium sandbox."""
          import os
          from pathlib import Path
          import runpy
          import sys
          import boto3
          boto3.Session()  # Preserve inherited profile/config guard before harness imports.
          from playwright.sync_api import BrowserType
          launch = BrowserType.launch
          def sandboxed(self, *args, **kwargs):
              assert self.name == 'chromium' and not args
              assert kwargs.pop('args', None) == ['--no-sandbox']
              kwargs['chromium_sandbox'] = True
              kwargs['args'] = ['--proxy-server=http://127.0.0.1:9', '--proxy-bypass-list=127.0.0.1',
                                '--host-resolver-rules=MAP * ~NOTFOUND, EXCLUDE 127.0.0.1']
              return launch(self, **kwargs)
          BrowserType.launch = sandboxed
          sys.path.insert(0, str(Path.cwd() / 'test/e2e'))
          runpy.run_path('test/e2e/aws_catalog_console.py', run_name='__main__')
          PY
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_BINARY_SHA256=$(cut -d ' ' -f 1 "$RUNNER_TEMP/280-receipts/binary.sha256")
          export VERIFICATION_GO=$(command -v go)
          export CHROMIUM_EXECUTABLE=$(/tmp/kvs-tests/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          export AXE_SCRIPT=/tmp/kvs-audit/axe.min.js
          export SIMULATOR_REPORTS="$RUNNER_TEMP/280-browser-private"
          export PATH="/tmp/kvs-tests/bin:$PATH"
          set +e
          for scope in full focused; do
            unshare --user --map-current-user --net --keep-caps sh -eu -c 'ip link set lo up; exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all python "$1"' kvs "$RUNNER_TEMP/280-$scope.py" > "$RUNNER_TEMP/280-$scope.log" 2>&1
            result=$?
            printf '%s\n' "$result" > "$RUNNER_TEMP/280-receipts/$scope.exit"
            echo "$scope fixture exit: $result"
          done
          python - <<'PYDIAG'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          records = {}
          for scope in ('full', 'focused'):
              text = (root / ('280-' + scope + '.log')).read_text(errors='replace')
              frames = [{'file': pathlib.Path(name).name, 'line': int(line)}
                        for name, line in re.findall(r'File "([^"\n]+)", line ([0-9]+)', text)]
              kinds = re.findall(r'^([A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception))(?::|$)', text, re.MULTILINE)
              records[scope] = {'frames': frames[-12:], 'exception_types': kinds[-3:]}
          (root / '280-receipts' / 'diagnostics.json').write_text(json.dumps(records, indent=2) + '\n')
          PYDIAG
          test "$(cat "$RUNNER_TEMP/280-receipts/full.exit")" = 0 && test "$(cat "$RUNNER_TEMP/280-receipts/focused.exit")" = 0
      - name: Retain safe exact-source statuses
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kinesis-video-catalog-047be001fb2b0758f3b846ead7f17654990e7a88
          path: ${{ runner.temp }}/280-receipts/
          if-no-files-found: error
          retention-days: 7
