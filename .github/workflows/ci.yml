name: Temporary exact route53-reference complete local gate evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  complete-before-commit:
    name: Unfiltered standard make before-commit at 05f7bc6
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 05f7bc6a2adbdc60fa98ea9b4a58f42219f277c0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify fixed product source and ordinary runner
        run: |
          test "$(git rev-parse HEAD)" = 05f7bc6a2adbdc60fa98ea9b4a58f42219f277c0
          test "$(git rev-parse HEAD^{tree})" = 1fd787ea80aea7f88e511574ccc1d6963d443e76
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          mkdir -p "$RUNNER_TEMP/route53-reference-complete-gate"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/route53-reference-complete-gate/source.txt"
          uname -srmo > "$RUNNER_TEMP/route53-reference-complete-gate/platform.txt"
          go version > "$RUNNER_TEMP/route53-reference-complete-gate/go.txt"
          python3 --version > "$RUNNER_TEMP/route53-reference-complete-gate/python.txt"
      - name: Run original complete make before-commit
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          make before-commit 2>&1 | tee "$RUNNER_TEMP/route53-reference-complete-gate/full.log"
          codes=("${PIPESTATUS[@]}")
          result=${codes[0]}
          if test "$result" -eq 0 && test "${codes[1]}" -ne 0; then result=${codes[1]}; fi
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/route53-reference-complete-gate/make-exit.txt"
          exit "$result"
      - name: Preserve safe coverage and package outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'route53-reference-complete-gate'
          root.mkdir(parents=True, exist_ok=True)
          log = root / 'full.log'
          text = log.read_text(errors='replace') if log.exists() else ''
          safe = [line for line in text.splitlines()
                  if re.match(r'^(ok\s+github\.com/|FAIL(?:\s|$)|\?\s+github\.com/|coverage:|Ran \d+ tests? in|OK$|FAILED \()', line)
                  or 'coverage gate' in line.lower() or 'source coverage' in line.lower()
                  or 'statement coverage' in line.lower() or line.startswith('Go statements (full module)')]
          result = root / 'make-exit.txt'
          (root / 'summary.json').write_text(json.dumps({
              'source': '05f7bc6a2adbdc60fa98ea9b4a58f42219f277c0',
              'command': 'make before-commit',
              'make_exit': int(result.read_text()) if result.exists() else None,
              'observed_summaries': safe,
              'scope': 'Unfiltered standard command. Failure remains failure; later phases are not inferred executed.'
          }, indent=2) + '\n')
          PY
          git status --porcelain > "$RUNNER_TEMP/route53-reference-complete-gate/post-status.txt"
          if test -f dist/tenkacloud-simulator; then
            go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/route53-reference-complete-gate/build.txt"
            sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/route53-reference-complete-gate/binary.sha256"
          fi
      - name: Retain exact complete-gate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: route53-reference-complete-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/route53-reference-complete-gate/
            !${{ runner.temp }}/route53-reference-complete-gate/full.log
          if-no-files-found: error
          retention-days: 14
