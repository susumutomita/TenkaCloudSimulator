name: Route 53 PTR Console and SDK verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ptr:
    name: Route 53 Console and SDK on the exact main revision
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    env:
      PRODUCT_REVISION: 17e30e18d0eb2216961158ae48f8ef42a20225e8
      PRODUCT_TREE: 0f5776bef7e66bd003d8d628f78c564723efa7db
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: verification
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PRODUCT_REVISION }}
          path: product
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: product/go.sum
      - name: Build the clean product and install its pinned SDK and browser
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_REVISION"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          make build
          mkdir -p "$RUNNER_TEMP/ptr-receipt"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/ptr-receipt/build.txt"
          grep -F "vcs.revision=$PRODUCT_REVISION" "$RUNNER_TEMP/ptr-receipt/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/ptr-receipt/build.txt"
          echo "PRODUCT_ROOT=$PWD" >> "$GITHUB_ENV"
          echo "PRODUCT_DIGEST=$(sha256sum dist/tenkacloud-simulator | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/ptr-tools"
          "$RUNNER_TEMP/ptr-tools/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/ptr-tools/bin/playwright" install --with-deps chromium
      - name: Exercise the authenticated browser and native API in a private loopback namespace
        run: |
          "$RUNNER_TEMP/ptr-tools/bin/python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ), "ambient AWS configuration"'
          umask 077
          export CASE="$GITHUB_WORKSPACE/verification/.github/verification/route53/ptr_console.py"
          if ! unshare --user --map-current-user --net --keep-caps sh -eu -c '
            ip link set lo up
            exec setpriv --no-new-privs --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$RUNNER_TEMP/ptr-tools/bin/python" -B "$CASE"
          ' > "$RUNNER_TEMP/ptr-out" 2> "$RUNNER_TEMP/ptr-private-error"; then
            python3 - <<'PY'
          import os, re
          from pathlib import Path
          log = (Path(os.environ['RUNNER_TEMP'])/'ptr-private-error').read_text()
          print('Trace locations:', re.findall(r'File "[^"\n]*/([A-Za-z0-9_.-]+)", line (\d+)', log)[-8:])
          print('Failure classes:', re.findall(r'^([\w.]+(?:Error|Exception))[:\n]',log,re.M)[-2:])
          PY
            exit 1
          fi
          jq -se --arg rev "$PRODUCT_REVISION" --arg digest "$PRODUCT_DIGEST" 'length == 1 and (.[0] | .revision==$rev and .binarySha256==$digest and .allowed==200 and .denied==403 and .browserMutationRequests==2 and .freshNativeReadback and .referenceContract and .boundedDNSAnswer and .siblingsPreserved and .cleaned)' "$RUNNER_TEMP/ptr-out"
          cp "$RUNNER_TEMP/ptr-out" "$RUNNER_TEMP/ptr-receipt/ptr.json"
      - name: Save build and verified browser results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: route53-ptr-${{ github.run_id }}
          path: ${{ runner.temp }}/ptr-receipt/
          if-no-files-found: error
          retention-days: 14
