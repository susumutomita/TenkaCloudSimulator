name: Cloud Trace and AWS Support on the exact merged application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: 102099893c314349ad0b04e7e599e24f1f2999a3
      PYTHONPYCACHEPREFIX: /tmp/trace-v1-pycache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 102099893c314349ad0b04e7e599e24f1f2999a3
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the standalone product from the exact clean source
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = c1a6854918c7c421bf9e72ff7d6bd3f033927a19
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          make build
          mkdir -p "$RUNNER_TEMP/trace-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/trace-receipts/build.txt"
          grep -F "vcs.revision=$SOURCE_SHA" "$RUNNER_TEMP/trace-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/trace-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/trace-receipts/binary.sha256"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/trace-receipts/source.txt"
      - name: Prepare the pinned official Google client and sandboxed Chromium
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv /tmp/trace-v1-tests
          /tmp/trace-v1-tests/bin/python -m pip install -r scripts/requirements-test.txt
          /tmp/trace-v1-tests/bin/playwright install --with-deps chromium
      - name: Run the shipped fixtures with only private loopback available
        run: |
          export PATH="/tmp/trace-v1-tests/bin:$PATH"
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_BINARY_SHA256=$(cut -d " " -f 1 "$RUNNER_TEMP/trace-receipts/binary.sha256")
          export CHROMIUM_EXECUTABLE=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          export TRACE_NAMESPACE_CHECK="$RUNNER_TEMP/trace-check-namespace.py"
          cat > "$TRACE_NAMESPACE_CHECK" <<'PYTHON'
          import os, pathlib, socket, sys
          assert os.geteuid() != 0
          assert [name for _, name in socket.if_nameindex()] == ['lo']
          status = dict(line.split(':', 1) for line in pathlib.Path('/proc/self/status').read_text().splitlines() if ':' in line)
          assert all(int(status[name], 16) == 0 for name in ('CapEff', 'CapAmb', 'CapBnd'))
          assert int(status['NoNewPrivs']) == 1
          fixture = os.environ['TRACE_FIXTURE']
          assert fixture in ('gcp_trace_sdk', 'gcp_trace_scalar', 'gcp_trace_console')
          os.execv(sys.executable, [sys.executable, 'test/e2e/' + fixture + '.py'])
          PYTHON
          for fixture in gcp_trace_sdk gcp_trace_scalar gcp_trace_console; do
            export TRACE_FIXTURE="$fixture"
            set +e
            unshare --user --map-current-user --net --keep-caps sh -ec 'ip link set lo up; exec setpriv --no-new-privs --inh-caps=-all --ambient-caps=-all --bounding-set=-all python "$TRACE_NAMESPACE_CHECK"' > "$RUNNER_TEMP/$fixture.log" 2>&1
            result=$?
            set -e
            python - "$fixture" "$result" <<'PY'
          import json, os, pathlib, re, sys
          name, code = sys.argv[1], int(sys.argv[2])
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          text = (root / (name + '.log')).read_text(errors='replace')
          expected = {
              'gcp_trace_sdk': 'Cloud Trace v1 append, get, three list views, duplicate spans, isolated projects, restart and cleanup passed',
              'gcp_trace_scalar': 'Cloud Trace v1: three real Scalar Sends, official SDK readback, peer isolation and cleanup passed',
          }.get(name)
          receipt = {'source': os.environ['SOURCE_SHA'], 'fixture': name, 'exit': code,
                     'binary': (root/'trace-receipts/binary.sha256').read_text().split()[0]}
          if code == 0:
              if name == 'gcp_trace_console':
                  rendered = [json.loads(line) for line in text.splitlines() if line.startswith('{"ok":')]
                  want = {'ok': True, 'binarySha256': receipt['binary'], 'sdkSeededTraces': 26,
                          'duplicateSpanObservations': 3, 'paging': True, 'nativeErrorRecovery': True,
                          'japaneseNarrow': True, 'peerUnchanged': True, 'restart': True,
                          'participantHidden': True, 'cleanup': True, 'externalCloud': False}
                  assert rendered == [want]
                  receipt['checkedOutcome'] = rendered[0]
              else:
                  assert expected and text.splitlines().count(expected) == 1
                  receipt['checkedOutcome'] = expected
          else:
              receipt['frames'] = [(pathlib.Path(file).name, line) for file,line in
                                   re.findall(r'File "([^"\n]+)", line ([0-9]+)', text)][-10:]
              receipt['exception'] = re.findall(r'^([a-zA-Z_.]*(?:Error|Exception)):', text, re.MULTILINE)[-1:]
          (root/'trace-receipts'/(name + '.json')).write_text(json.dumps(receipt, indent=2) + '\n')
          PY
            test "$result" -eq 0
          done
          test -z "$(git status --porcelain)"
      - name: Preserve fixture, source and build receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trace-native-sdk-scalar-${{ github.run_id }}
          path: ${{ runner.temp }}/trace-receipts/
          if-no-files-found: error
          retention-days: 14
  check:
    name: Real AWS Support official SDK, Scalar responses and Cloudscape console
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PRODUCT: 102099893c314349ad0b04e7e599e24f1f2999a3
      PRODUCT_TREE: c1a6854918c7c421bf9e72ff7d6bd3f033927a19
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 102099893c314349ad0b04e7e599e24f1f2999a3
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - name: Build the exact clean standalone simulator
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          mkdir "$RUNNER_TEMP/support-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/support-receipts/build.txt"
          grep -F "vcs.revision=$PRODUCT" "$RUNNER_TEMP/support-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/support-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/support-receipts/binary.sha256"
      - name: Install the repository-pinned tools in the development runner
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/support-venv"
          "$RUNNER_TEMP/support-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/support-venv/bin/pip" check
          "$RUNNER_TEMP/support-venv/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/support-venv/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/support-axe"
      - name: Exercise normal SDK and Console in a private loopback namespace
        run: |
          python="$RUNNER_TEMP/support-venv/bin/python"
          "$python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          test "$(id -u)" -ne 0
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export AXE_SCRIPT="$RUNNER_TEMP/support-axe/axe.min.js"
          chromium=( "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux64/chrome )
          test "${#chromium[@]}" -eq 1
          test -x "${chromium[0]}"
          export CHROMIUM_EXECUTABLE="${chromium[0]}"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' verify sh -ec '
            actual_ifaces=$(awk -F: "NR>2 {gsub(/ /, \"\", \$1); print \$1}" /proc/net/dev)
            test "$actual_ifaces" = lo
            test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = 0000000000000000
            echo "Private loopback and zero effective capabilities verified"
            status=0
            "$1" -B test/e2e/support_cases.py > "$2/native.json" || status=1
            "$1" -B test/e2e/support_console.py --sdk > "$2/console.json" || status=1
            "$1" -B test/e2e/support_scalar.py > "$2/scalar.json" || status=1
            exit "$status"
          ' verify "$python" "$RUNNER_TEMP/support-receipts"
          jq -e '(.operations|length)==7 and .requests==.responses and .requests>0 and .twoTeams and .reopenedBothDatabases and .ownedFilesRemoved' "$RUNNER_TEMP/support-receipts/native.json"
          jq -e '.stockSDK and .sdkSends==.sdkResponses and .sdkSends>0 and (.audits|length)>=3 and .caseReadAfterRestart and .exactDownloadBytes==4 and .pagedCasesAndMessages and .cleanup' "$RUNNER_TEMP/support-receipts/console.json"
          jq -e '.stockSDKReadback and (.ownerSends|length)==4 and (.participantSends|length)==2 and (.peerSends|length)==1 and .cleanup' "$RUNNER_TEMP/support-receipts/scalar.json"
          sha256sum --check "$RUNNER_TEMP/support-receipts/binary.sha256"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: support-console-${{ github.run_id }}
          path: ${{ runner.temp }}/support-receipts/
          if-no-files-found: error
          retention-days: 14
  complete-before-commit:
    name: Unfiltered standard make before-commit at 1020998
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 102099893c314349ad0b04e7e599e24f1f2999a3
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify fixed product source and ordinary runner
        run: |
          test "$(git rev-parse HEAD)" = 102099893c314349ad0b04e7e599e24f1f2999a3
          test "$(git rev-parse HEAD^{tree})" = c1a6854918c7c421bf9e72ff7d6bd3f033927a19
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          mkdir -p "$RUNNER_TEMP/trace-complete-gate"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/trace-complete-gate/source.txt"
          uname -srmo > "$RUNNER_TEMP/trace-complete-gate/platform.txt"
          go version > "$RUNNER_TEMP/trace-complete-gate/go.txt"
          python3 --version > "$RUNNER_TEMP/trace-complete-gate/python.txt"
      - name: Run original complete make before-commit
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          make before-commit 2>&1 | tee "$RUNNER_TEMP/trace-complete-gate/full.log"
          codes=("${PIPESTATUS[@]}")
          result=${codes[0]}
          if test "$result" -eq 0 && test "${codes[1]}" -ne 0; then result=${codes[1]}; fi
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/trace-complete-gate/make-exit.txt"
          exit "$result"
      - name: Preserve safe coverage and package outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'trace-complete-gate'
          root.mkdir(parents=True, exist_ok=True)
          log = root / 'full.log'
          text = log.read_text(errors='replace') if log.exists() else ''
          safe = [line for line in text.splitlines()
                  if re.match(r'^(ok\s+github\.com/|FAIL(?:\s|$)|\?\s+github\.com/|coverage:|Ran \d+ tests? in|OK$|FAILED \()', line)
                  or 'coverage gate' in line.lower() or 'source coverage' in line.lower()
                  or 'statement coverage' in line.lower() or line.startswith('Go statements (full module)')]
          result = root / 'make-exit.txt'
          (root / 'summary.json').write_text(json.dumps({
              'source': '102099893c314349ad0b04e7e599e24f1f2999a3',
              'command': 'make before-commit',
              'make_exit': int(result.read_text()) if result.exists() else None,
              'observed_summaries': safe,
              'scope': 'Unfiltered standard command. Failure remains failure; later phases are not inferred executed.'
          }, indent=2) + '\n')
          PY
          git status --porcelain > "$RUNNER_TEMP/trace-complete-gate/post-status.txt"
          if test -f dist/tenkacloud-simulator; then
            go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/trace-complete-gate/build.txt"
            sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/trace-complete-gate/binary.sha256"
          fi
      - name: Retain exact complete-gate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: trace-complete-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/trace-complete-gate/
            !${{ runner.temp }}/trace-complete-gate/full.log
          if-no-files-found: error
          retention-days: 14
