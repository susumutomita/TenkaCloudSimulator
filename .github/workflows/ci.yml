name: Verify CodeCommit notification delivery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notifications:
    name: Send native Git changes through SNS to SQS using pinned SDKs
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      PRODUCT: 2a0a7ad2afd4d2781367e4dbc294c829db58c316
      PRODUCT_TREE: 25638d3b602c856f038023afa2967fcd3bfd0f18
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 2a0a7ad2afd4d2781367e4dbc294c829db58c316
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
      - name: Build the clean standalone binary
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          mkdir "$RUNNER_TEMP/notification-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/notification-receipts/build.txt"
          grep -F "vcs.revision=$PRODUCT" "$RUNNER_TEMP/notification-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/notification-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/notification-receipts/binary.sha256"
      - name: Install the repository-pinned SDK
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/sdk/bin/pip" check
      - name: Create branches and receive deliveries in two local authorities
        run: |
          python="$RUNNER_TEMP/sdk/bin/python"
          "$python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          test "$(id -u)" -ne 0
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' verify sh -ec '
            test "$(awk -F: "NR>2 {gsub(/ /,\"\",\$1);print \$1}" /proc/net/dev)" = lo
            test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = 0000000000000000
            "$1" -B test/e2e/codestar_notifications.py > "$RUNNER_TEMP/notification-receipts/sdk.json"
            cat "$RUNNER_TEMP/notification-receipts/sdk.json"
          ' verify "$python"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codestar-notifications-${{ github.run_id }}
          path: ${{ runner.temp }}/notification-receipts
          if-no-files-found: error
