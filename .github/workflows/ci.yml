name: Verify the saved SNS notification topic policy with official boto3
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sdk:
    name: Official SNS SDK upgrade, IAM and same-ARN isolation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      SOURCE: 60b960aae054e0d92f9628f16f99be303d525dfd
      PREVIOUS: 387fb84072981e391d0eeb701b01d5598f97b888
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 60b960aae054e0d92f9628f16f99be303d525dfd
          path: candidate
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 387fb84072981e391d0eeb701b01d5598f97b888
          path: historical
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: candidate/go.sum
      - name: Build both clean standalone executables
        shell: bash
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.26.11
          mkdir "$RUNNER_TEMP/sns-policy-receipts"
          for dir in . ../historical; do
            expected="$SOURCE"
            tree=2cf22c32172145516a93c0ffb208e9dd30aeabad
            label=candidate
            if test "$dir" = ../historical; then expected="$PREVIOUS"; tree=e69ed4b33edd8ecbb6b1ab2f6ba1617e3a678ba9; label=historical; fi
            test "$(git -C "$dir" rev-parse HEAD)" = "$expected"
            test "$(git -C "$dir" rev-parse 'HEAD^{tree}')" = "$tree"
            test -z "$(git -C "$dir" status --porcelain)"
            make -C "$dir" build
            go version -m "$dir/dist/tenkacloud-simulator" > "$RUNNER_TEMP/sns-policy-receipts/$label-build.txt"
            grep -F "vcs.revision=$expected" "$RUNNER_TEMP/sns-policy-receipts/$label-build.txt"
            grep -F "vcs.modified=false" "$RUNNER_TEMP/sns-policy-receipts/$label-build.txt"
            sha256sum "$dir/dist/tenkacloud-simulator" > "$RUNNER_TEMP/sns-policy-receipts/$label.sha256"
          done
      - name: Install pinned repository development dependencies
        shell: bash
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/sns-policy-venv"
          "$RUNNER_TEMP/sns-policy-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/sns-policy-venv/bin/pip" check
          "$RUNNER_TEMP/sns-policy-venv/bin/python" -c 'import boto3,botocore;print(boto3.__version__,botocore.__version__)' > "$RUNNER_TEMP/sns-policy-receipts/sdk-versions.txt"
      - name: Exercise both binaries under the normal SNS protocol
        shell: bash
        run: |
          set -euo pipefail
          sdk_python="$RUNNER_TEMP/sns-policy-venv/bin/python"
          "$sdk_python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          test "$(id -u)" -ne 0
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' verify sh -ec '
            actual_ifaces=$(awk -F: "NR>2 {gsub(/ /, \"\", \$1); print \$1}" /proc/net/dev)
            test "$actual_ifaces" = lo
            test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = 0000000000000000
            "$1" -B test/e2e/sns_notification_policy.py --previous-binary "$2" > "$3/receipt.json"
          ' verify "$sdk_python" "$PWD/../historical/dist/tenkacloud-simulator" "$RUNNER_TEMP/sns-policy-receipts"
          echo "4681d3e70be41b616c66cfb792ea239a001b418747a166826d19c12c9ceb6870  dist/tenkacloud-simulator" | sha256sum --check
          for stamp in candidate historical; do sha256sum --check "$RUNNER_TEMP/sns-policy-receipts/$stamp.sha256"; done
          jq -e --arg candidate "$(cut -d" " -f1 "$RUNNER_TEMP/sns-policy-receipts/candidate.sha256")" \
            --arg previous "$(cut -d" " -f1 "$RUNNER_TEMP/sns-policy-receipts/historical.sha256")" \
            '.historicalUpgrade and .twoTeams and .exactReadback and .cleanup and .sent==(.responses|length) and .sent>20 and .candidateBinarySha256==$candidate and .historicalBinarySha256==$previous' "$RUNNER_TEMP/sns-policy-receipts/receipt.json"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: sns-policy-sdk-${{ github.run_id }}
          path: ${{ runner.temp }}/sns-policy-receipts/
          if-no-files-found: error
          retention-days: 14
  complete-before-commit:
    name: Unfiltered standard make before-commit at 60b960a
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 60b960aae054e0d92f9628f16f99be303d525dfd
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify fixed product source and ordinary runner
        run: |
          test "$(git rev-parse HEAD)" = 60b960aae054e0d92f9628f16f99be303d525dfd
          test "$(git rev-parse HEAD^{tree})" = 2cf22c32172145516a93c0ffb208e9dd30aeabad
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          mkdir -p "$RUNNER_TEMP/notifications-complete-gate"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/notifications-complete-gate/source.txt"
          uname -srmo > "$RUNNER_TEMP/notifications-complete-gate/platform.txt"
          go version > "$RUNNER_TEMP/notifications-complete-gate/go.txt"
          python3 --version > "$RUNNER_TEMP/notifications-complete-gate/python.txt"
      - name: Run original complete make before-commit
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          make before-commit 2>&1 | tee "$RUNNER_TEMP/notifications-full.log"
          codes=("${PIPESTATUS[@]}")
          result=${codes[0]}
          if test "$result" -eq 0 && test "${codes[1]}" -ne 0; then result=${codes[1]}; fi
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/notifications-complete-gate/make-exit.txt"
          exit "$result"
      - name: Enforce original unfiltered statement and source-line floors
        run: |
          go run github.com/boumenot/gocover-cobertura@v1.4.0 < reports/coverage.out > "$RUNNER_TEMP/notifications-complete-gate/coverage.xml"
          set -o pipefail
          python3 scripts/check-coverage.py reports/coverage.out "$RUNNER_TEMP/notifications-complete-gate/coverage.xml" | tee "$RUNNER_TEMP/notifications-complete-gate/coverage.txt"
      - name: Preserve safe coverage and package outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'notifications-complete-gate'
          root.mkdir(parents=True, exist_ok=True)
          log = root.parent / 'notifications-full.log'
          text = log.read_text(errors='replace') if log.exists() else ''
          safe = [line for line in text.splitlines()
                  if re.match(r'^(ok\s+github\.com/|FAIL(?:\s|$)|\?\s+github\.com/|coverage:|Ran \d+ tests? in|OK$|FAILED \()', line)
                  or 'coverage gate' in line.lower() or 'source coverage' in line.lower()
                  or 'statement coverage' in line.lower()]
          result = root / 'make-exit.txt'
          (root / 'summary.json').write_text(json.dumps({
              'source': '60b960aae054e0d92f9628f16f99be303d525dfd',
              'command': 'make before-commit',
              'make_exit': int(result.read_text()) if result.exists() else None,
              'observed_summaries': safe,
              'scope': 'Unfiltered standard command. Failure remains failure; later phases are not inferred executed.'
          }, indent=2) + '\n')
          PY
          git status --porcelain > "$RUNNER_TEMP/notifications-complete-gate/post-status.txt"
          if test -f dist/tenkacloud-simulator; then
            go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/notifications-complete-gate/build.txt"
            sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/notifications-complete-gate/binary.sha256"
          fi
      - name: Retain exact complete-gate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: notifications-complete-gate-${{ github.run_id }}
          path: ${{ runner.temp }}/notifications-complete-gate/
          if-no-files-found: error
          retention-days: 14
