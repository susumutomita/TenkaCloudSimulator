name: MSK and Batch complete gate and stock SDK evidence
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Run the complete gate alone or together with the client fixtures'
        type: choice
        default: full-and-clients
        options: [full-and-clients, full-gate]
permissions:
  contents: read
jobs:
  complete-gate-and-stock-sdk:
    name: Complete gate, Kafka and Batch SDK, and MSK Scalar at 1478bba
    runs-on: ubuntu-22.04
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 1478bbacf026b2d5924dc6e20a1fe8f953d7c22f
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify the fixed source and isolated runner
        id: source
        run: |
          test "$(git rev-parse HEAD)" = 1478bbacf026b2d5924dc6e20a1fe8f953d7c22f
          test "$(git rev-parse HEAD^{tree})" = 2403d91da6395f54152d92eda62051d2f44827e4
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          mkdir -p "$RUNNER_TEMP/msk-batch-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/msk-batch-evidence/source.txt"
          uname -srmo > "$RUNNER_TEMP/msk-batch-evidence/platform.txt"
          go version > "$RUNNER_TEMP/msk-batch-evidence/go.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          if any(name.startswith(('AWS_', 'BOTO_')) for name in os.environ):
              raise SystemExit('Ambient AWS or Boto configuration detected')
          paths = [Path.home() / path for path in ('.aws/config', '.aws/credentials', '.boto')]
          if any(path.exists() or path.is_symlink() for path in [*paths, Path('/etc/boto.cfg')]):
              raise SystemExit('Ambient AWS or Boto configuration file detected')
          if any(os.environ.get(key) for key in ('GO_TEST_RUN_FILE', 'GO_TEST_PACKAGES', 'GOFLAGS', 'MAKEFLAGS')):
              raise SystemExit('Unexpected Go or Make override on the runner')
          PY
      - name: Set up CPython for the pinned SDK and Chromium tools
        id: python
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: |
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test -x "$python"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'
          "$python" --version > "$RUNNER_TEMP/msk-batch-evidence/python.txt"
      - name: Run unfiltered make before-commit
        id: gate
        env:
          # Use Ubuntu's interpreter and native trust store for the standard
          # repository gate. The browser and SDK keep their separately pinned venv.
          PYTHON: /usr/bin/python3
        run: |
          umask 077
          "$PYTHON" -c 'import sys; print(sys.version.split()[0], sys.executable)' > "$RUNNER_TEMP/msk-batch-evidence/gate-python.txt"
          for interpreter in "$PYTHON" "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"; do
            "$interpreter" - <<'TRUST' >> "$RUNNER_TEMP/msk-batch-evidence/python-trust.jsonl"
          import json, os, ssl, sys
          context = ssl.create_default_context()
          print(json.dumps({'interpreter': sys.executable, 'version': sys.version.split()[0],
                            'ca_roots': len(context.get_ca_certs(binary_form=True)),
                            'verify_required': context.verify_mode == ssl.CERT_REQUIRED,
                            'hostname_check': context.check_hostname,
                            'ca_file_override_present': 'SSL_CERT_FILE' in os.environ,
                            'ca_dir_override_present': 'SSL_CERT_DIR' in os.environ}))
          TRUST
          done
          git rev-parse --is-shallow-repository > "$RUNNER_TEMP/msk-batch-evidence/shallow.txt"
          df -Pk . "$RUNNER_TEMP" | awk 'NR > 1 {print $4}' > "$RUNNER_TEMP/msk-batch-evidence/free-kib-before.txt"
          result=0
          make before-commit > "$RUNNER_TEMP/msk-batch-make.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/msk-batch-evidence/make-exit.txt"
          df -Pk . "$RUNNER_TEMP" | awk 'NR > 1 {print $4}' > "$RUNNER_TEMP/msk-batch-evidence/free-kib-after.txt"
          git status --porcelain | wc -l > "$RUNNER_TEMP/msk-batch-evidence/post-gate-change-count.txt"
          exit "$result"
      - name: Verify the binary for the stock catalog fixtures
        id: binary
        if: ${{ !cancelled() && steps.source.outcome == 'success' && (steps.gate.outcome == 'success' || inputs.scope == 'full-and-clients') }}
        run: |
          test -z "$(git status --porcelain)"
          # The standard gate builds last. If it stopped earlier, still exercise
          # the SDK on a freshly built binary and preserve the original gate exit.
          if test ! -x dist/tenkacloud-simulator; then make build; fi
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/msk-batch-evidence/build.txt"
          grep -Fq 'vcs.revision=1478bbacf026b2d5924dc6e20a1fe8f953d7c22f' "$RUNNER_TEMP/msk-batch-evidence/build.txt"
          grep -Fq 'vcs.modified=false' "$RUNNER_TEMP/msk-batch-evidence/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/msk-batch-evidence/binary.sha256"
      - name: Install the checked-in SDK requirements
        id: sdk_tools
        if: ${{ !cancelled() && inputs.scope == 'full-and-clients' && steps.python.outcome == 'success' && steps.binary.outcome == 'success' }}
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/msk-batch-venv"
          "$RUNNER_TEMP/msk-batch-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/msk-batch-venv/bin/python" -c 'import boto3, botocore; print(boto3.__version__, botocore.__version__)' > "$RUNNER_TEMP/msk-batch-evidence/boto-versions.txt"
      - name: Run the stock Kafka and Batch catalog fixtures on two local teams
        id: sdk
        if: ${{ !cancelled() && steps.sdk_tools.outcome == 'success' }}
        env:
          SIMULATOR_BINARY: ${{ github.workspace }}/dist/tenkacloud-simulator
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1
        run: |
          umask 077
          result=0
          "$RUNNER_TEMP/msk-batch-venv/bin/python" test/e2e/aws_catalog_fixtures.py kafka batch > "$RUNNER_TEMP/msk-batch-sdk.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/msk-batch-evidence/sdk-exit.txt"
          test "$result" -eq 0
          grep -Fx 'Catalog fixture lifecycles passed for batch, kafka' "$RUNNER_TEMP/msk-batch-sdk.log" > "$RUNNER_TEMP/msk-batch-evidence/fixture-result.txt"
          sha256sum --check "$RUNNER_TEMP/msk-batch-evidence/binary.sha256"
          test -z "$(git status --porcelain)"
      - name: Install the Chromium build pinned by Playwright
        id: browser
        if: ${{ !cancelled() && steps.sdk_tools.outcome == 'success' }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/msk-chromium
        run: |
          "$RUNNER_TEMP/msk-batch-venv/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/msk-batch-venv/bin/python" - <<'PYCODE'
          import importlib.metadata, json, os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import playwright
          assert importlib.metadata.version('playwright') == '1.62.0'
          pins = json.loads((Path(playwright.__file__).parent / 'driver/package/browsers.json').read_text())
          pin = next(b for b in pins['browsers'] if b['name'] == 'chromium')
          assert pin['revision'] == '1234' and pin['browserVersion'] == '151.0.7922.34'
          with sync_playwright() as driver:
              executable = Path(driver.chromium.executable_path).resolve(strict=True)
          assert executable.is_relative_to(Path(os.environ['PLAYWRIGHT_BROWSERS_PATH']) / 'chromium-1234')
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'msk-chromium-executable').write_text(str(executable))
          (temp / 'msk-batch-evidence/browser.json').write_text(json.dumps({'playwright': '1.62.0', 'chromium': pin['browserVersion'], 'revision': pin['revision']})+'\n')
          PYCODE
      - name: Run the two-team stock SDK, Console and Scalar fixture
        id: scalar
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        env:
          SIMULATOR_BINARY: ${{ github.workspace }}/dist/tenkacloud-simulator
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1
        run: |
          umask 077
          export CHROMIUM_EXECUTABLE="$(cat "$RUNNER_TEMP/msk-chromium-executable")"
          result=0
          "$RUNNER_TEMP/msk-batch-venv/bin/python" test/e2e/msk_configuration_scalar.py > "$RUNNER_TEMP/msk-scalar.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/msk-batch-evidence/scalar-exit.txt"
          test "$result" -eq 0
          grep -Fx 'MSK stock SDK, Cloudscape, Scalar Send, restart, peer isolation and cleanup passed' "$RUNNER_TEMP/msk-scalar.log" > "$RUNNER_TEMP/msk-batch-evidence/scalar-result.txt"
          sha256sum --check "$RUNNER_TEMP/msk-batch-evidence/binary.sha256"
          test -z "$(git status --porcelain)"
      - name: Record phase outcomes and bounded diagnostics
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          BUILD_OUTCOME: ${{ steps.binary.outcome }}
          SDK_TOOLS_OUTCOME: ${{ steps.sdk_tools.outcome }}
          SDK_OUTCOME: ${{ steps.sdk.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          SCALAR_OUTCOME: ${{ steps.scalar.outcome }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          evidence = temp / 'msk-batch-evidence'
          evidence.mkdir(exist_ok=True)
          gate = temp / 'msk-batch-make.log'
          sdk = temp / 'msk-batch-sdk.log'
          text = gate.read_text(errors='replace') if gate.exists() else ''
          sdk_text = sdk.read_text(errors='replace') if sdk.exists() else ''
          scalar = temp / 'msk-scalar.log'
          scalar_text = scalar.read_text(errors='replace') if scalar.exists() else ''
          def classified_failure(output):
              return next((cls for cls in ('AssertionError','ClientError','ProfileNotFound','EndpointConnectionError','ReadTimeoutError','TimeoutError','Error')
                           if re.search(r'^([\w.]+\.)?'+cls+r'(:|$)', output, re.M)), None)
          def exit_code(name):
              path = evidence / name
              return int(path.read_text()) if path.is_file() else None
          # Retain stage identifiers and locations from this pinned checkout.
          # Raw diagnostics, source lines, exception details and environment stay private.
          markers = {
              'vet': 'go vet ./...', 'assets': 'python3 scripts/check-assets.py',
              'modules': 'go mod verify', 'recursive-test-build': 'make test build',
              'verification-tests': 'python3 -m unittest discover -s scripts/verification',
              'battle-tests': 'python3 -m unittest discover -s test/battle/image',
              'smithy-check': 'python3 scripts/smithy-contracts.py --check',
              'smithy-tests': 'python3 scripts/test-smithy-contracts.py',
              'factory-tests': 'python3 scripts/test-software-factory.py',
              'factory-acceptance-tests': 'python3 scripts/test-factory-acceptance.py',
              'factory-acceptance': 'python3 scripts/factory_acceptance.py',
              'coverage-tests': 'python3 scripts/test-coverage-gate.py',
              'go-race-coverage': 'go test -p 1 -race -coverpkg=./...',
              'coverage-gate': 'python3 scripts/check-coverage.py', 'build': 'CGO_ENABLED=0 go build',
          }
          lines = text.splitlines()
          entered = [name for name, command in markers.items() if any(line.startswith(command) for line in lines)]
          allowed_targets = {'format-check','vet','verify-assets','before-commit','test','test-scripts','test-go','build'}
          failed_targets = [{'line': int(number), 'target': target} for number, target in
                            re.findall(r'\[Makefile:(\d+): ([a-z-]+)\] Error', text) if target in allowed_targets]
          signals = {
              'dirty-checkout': 'dirty/untracked work is not exact HEAD',
              'factory-blocked': 'factory acceptance blocked:', 'formatted-files': 'Go formatting changed',
              'disk-full': 'no space left on device', 'permission-denied': 'permission denied',
              'missing-executable': 'executable file not found', 'missing-module': 'No module named',
              'offline-module-lookup': 'module lookup disabled by GOPROXY=off',
              'deadline': 'context deadline exceeded', 'killed': 'signal: killed',
              'invalid-git-object': 'not a valid object name', 'unavailable-git-object': 'bad object',
              'assertion': 'AssertionError', 'called-process-error': 'CalledProcessError',
              'git-identity': 'Author identity unknown', 'unrecognized-argument': 'unrecognized arguments:',
          }
          tracked = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          workspace = str(Path.cwd())+'/'
          locations = []
          for file, number in re.findall(r'^\s*File "([^"\n]+)", line (\d+)', text, re.M):
              relative = file.removeprefix(workspace)
              if relative in tracked and relative.endswith('.py'):
                  location = {'path': relative, 'line': int(number)}
                  if location not in locations: locations.append(location)
          summary = {
              'entered_make_phases': entered, 'failed_make_targets': failed_targets,
              'classified_make_signals': [name for name, marker in signals.items() if marker in text],
              'tracked_python_trace_locations': locations[-16:],
              'passing_python_suite_counts': [int(n) for n in re.findall(r'^Ran (\d+) tests? in [0-9.]+s\s+OK$', text, re.M)],
              'steps': {step: os.environ[step+'_OUTCOME'] for step in ('SOURCE','GATE','BUILD','SDK_TOOLS','SDK','BROWSER','SCALAR')},
              'make_exit': exit_code('make-exit.txt'), 'sdk_exit': exit_code('sdk-exit.txt'), 'scalar_exit': exit_code('scalar-exit.txt'),
              'failed_packages': re.findall(r'^FAIL\s+(github\.com/susumutomita/TenkaCloudSimulator/[\w./-]+)', text, re.M),
              'failed_go_tests': re.findall(r'^--- FAIL: (Test[A-Za-z0-9_]+)', text, re.M),
              'go_package_passes': len(re.findall(r'^ok\s+github\.com/susumutomita/TenkaCloudSimulator/', text, re.M)),
              'sdk_failure_class': classified_failure(sdk_text), 'scalar_failure_class': classified_failure(scalar_text),
          }
          (evidence/'outcome.json').write_text(json.dumps(summary, indent=2)+'\n')
          print(json.dumps(summary))
          PY
      - name: Retain verification receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: msk-batch-complete-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/msk-batch-evidence/
          if-no-files-found: error
          retention-days: 14
