name: Verify Auto Scaling Plans Console candidate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    name: Real Scaling Plans Console, native SDK and served reference
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PRODUCT: ef2dfd238a87646b6d97400b7b4feccdaca415d1
      PRODUCT_TREE: a558d293b749c7c7e43a0a8c245f27d27b196fe4
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ef2dfd238a87646b6d97400b7b4feccdaca415d1
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - name: Build the exact clean standalone simulator
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          mkdir "$RUNNER_TEMP/scaling-plan-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/scaling-plan-receipts/build.txt"
          grep -F "vcs.revision=$PRODUCT" "$RUNNER_TEMP/scaling-plan-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/scaling-plan-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/scaling-plan-receipts/binary.sha256"
      - name: Install the repository-pinned tools in the development runner
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/scaling-venv"
          "$RUNNER_TEMP/scaling-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/scaling-venv/bin/pip" check
          "$RUNNER_TEMP/scaling-venv/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/scaling-venv/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/scaling-axe"
      - name: Exercise normal SDK and Console in a private loopback namespace
        run: |
          python="$RUNNER_TEMP/scaling-venv/bin/python"
          "$python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          test "$(id -u)" -ne 0
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export AXE_SCRIPT="$RUNNER_TEMP/scaling-axe/axe.min.js"
          chromium=( "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux64/chrome )
          test "${#chromium[@]}" -eq 1
          test -x "${chromium[0]}"
          export CHROMIUM_EXECUTABLE="${chromium[0]}"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' verify sh -ec '
            actual_ifaces=$(awk -F: "NR>2 {gsub(/ /, \"\", \$1); print \$1}" /proc/net/dev)
            test "$actual_ifaces" = lo
            test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = 0000000000000000
            echo "Private loopback and zero effective capabilities verified"
            status=0
            "$1" -B test/e2e/autoscaling_plans_console.py --sdk > "$2/console.json" || status=1
            "$1" -B test/e2e/autoscaling_plans.py > "$2/native.json" || status=1
            exit "$status"
          ' verify "$python" "$RUNNER_TEMP/scaling-plan-receipts"
          jq -e '.stockSDKReadback and .capacity==[[2,9],[5,9],[5,9],[3,9],[3,9],[3,9]] and (.audits|length)==4 and .lostAcknowledgement=={"lost":1,"refreshFailures":1}' "$RUNNER_TEMP/scaling-plan-receipts/console.json"
          jq -e '.autoscalingPlansNativeSDK and .servedTemplates==5 and .participantTableAuthority and .actualCLIReopen and .teardown=="DELETED"' "$RUNNER_TEMP/scaling-plan-receipts/native.json"
          sha256sum --check "$RUNNER_TEMP/scaling-plan-receipts/binary.sha256"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: scaling-plan-console-${{ github.run_id }}
          path: ${{ runner.temp }}/scaling-plan-receipts/
          if-no-files-found: error
          retention-days: 14
