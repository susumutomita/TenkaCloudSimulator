name: Route53 saved-answer Scalar verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scalar:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PYTHONPYCACHEPREFIX: /tmp/route53-python-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: b88fb91a1d2f40525a8c1aaa636da424ce07b90f
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the clean immutable product before receipts
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = b88fb91a1d2f40525a8c1aaa636da424ce07b90f
          test -z "$(git status --porcelain)"
          make build
          mkdir -p "$RUNNER_TEMP/route53-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/route53-receipts/build.txt"
          grep -F 'vcs.revision=b88fb91a1d2f40525a8c1aaa636da424ce07b90f' "$RUNNER_TEMP/route53-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/route53-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/route53-receipts/binary.sha256"
      - name: Prepare pinned SDK-free fixture dependencies and Chromium
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv /tmp/route53-tests
          /tmp/route53-tests/bin/python -m pip install -r scripts/requirements-test.txt
          /tmp/route53-tests/bin/playwright install --with-deps chromium
      - name: Run the genuine saved-answer Scalar Send in loopback-only isolation
        run: |
          export PATH="/tmp/route53-tests/bin:$PATH"
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_BINARY_SHA256=$(cut -d ' ' -f 1 "$RUNNER_TEMP/route53-receipts/binary.sha256")
          export CHROMIUM_EXECUTABLE=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          set +e
          unshare --user --map-current-user --net --keep-caps sh -eu -c 'ip link set lo up; exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all python test/e2e/route53_scalar_send.py' > "$RUNNER_TEMP/route53-private.log" 2>&1
          result=$?
          set -e
          export ROUTE53_FIXTURE_EXIT="$result"
          python - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          text = (root / 'route53-private.log').read_text(errors='replace')
          result = int(os.environ['ROUTE53_FIXTURE_EXIT'])
          receipt = {'fixtureExit': result, 'sourceSha': 'b88fb91a1d2f40525a8c1aaa636da424ce07b90f'}
          if result == 0:
              records = [json.loads(line) for line in text.splitlines() if line.startswith('{"route53ScalarSend":')]
              assert len(records) == 1
              expected = {'route53ScalarSend': True, 'binarySha256': os.environ['SIMULATOR_BINARY_SHA256'],
                          'operation': 'TestDNSAnswer', 'method': 'GET', 'queryParameters': 3, 'sends': 1,
                          'nativeSnapshotsUnchanged': True, 'ownedCleanup': True, 'externalDNS': False}
              assert records[0] == expected
              receipt['verifiedFixture'] = records[0]
          else:
              receipt['frames'] = [{'file': pathlib.Path(name).name, 'line': int(line)}
                  for name, line in re.findall(r'File "([^"\n]+)", line ([0-9]+)', text)][-12:]
              receipt['exceptionTypes'] = re.findall(r'^([A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception))(?::|$)', text, re.MULTILINE)[-3:]
          (root / 'route53-receipts' / 'scalar.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Route53 Scalar fixture exit:', result)
          PY
          test -z "$(git status --porcelain)"
          test "$result" -eq 0
      - name: Retain safe source, build and fixture receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: route53-scalar-b88fb91a1d2f40525a8c1aaa636da424ce07b90f
          path: ${{ runner.temp }}/route53-receipts/
          if-no-files-found: error
          retention-days: 7
