name: CloudWatch custom metrics candidate verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    name: Native custom metric statistics and independent boundaries
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PRODUCT: c128cc37d1cc4d12f5daa699863771066a4195a1
      PRODUCT_TREE: 7a2e6fa9797808447a98a6e4e7afa928de1e9af8
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: c128cc37d1cc4d12f5daa699863771066a4195a1
          path: product
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          sparse-checkout: .github/metric-witnesses
          sparse-checkout-cone-mode: false
          path: witnesses
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: product/go.sum
      - name: Prepare pinned SDK and identify the exact clean simulator
        working-directory: product
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          receipts="$RUNNER_TEMP/metric-receipts"
          mkdir "$receipts"
          go version -m dist/tenkacloud-simulator > "$receipts/build.txt"
          grep -F "vcs.revision=$PRODUCT" "$receipts/build.txt"
          grep -F 'vcs.modified=false' "$receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$receipts/binary.sha256"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/metric-sdk"
          "$RUNNER_TEMP/metric-sdk/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/metric-sdk/bin/python" -m pip check
      - name: Run ordinary authenticated Query SDKs on isolated loopback
        working-directory: product
        run: |
          python="$RUNNER_TEMP/metric-sdk/bin/python"
          "$python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          receipts="$RUNNER_TEMP/metric-receipts"
          witnesses="$GITHUB_WORKSPACE/witnesses/.github/metric-witnesses"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' isolated sh -ec '
            python="$RUNNER_TEMP/metric-sdk/bin/python"
            "$python" -B test/e2e/cloudwatch_metrics.py > "$1/stock.json"
            "$python" -B "$2/tenka-58-independent-stock-witness.py" > "$1/independent.json"
            "$python" -B "$2/tenka-58-independent-point-limit.py" > "$1/bounds.json"
          ' metrics "$receipts" "$witnesses"
          jq -se 'length == 1 and (.[0] | .operations == ["PutMetricData","GetMetricStatistics"]
            and .transport == "AWS Query 2010-08-01" and .counts.calls > 0
            and .counts.calls == .counts.sends and .counts.sends == .counts.responses
            and .contentEncodings == ["gzip","identity"] and .twoTeamState == true
            and .restartPersisted == true and .cleanup == "owned temporary databases removed")' "$receipts/stock.json"
          jq -se 'length == 1 and (.[0] | .stockSDK == ["1.42.0","1.41.6"] and .fourSampleAverage == 3.5
            and .audited.call > 0 and .audited.call == .audited.send and .audited.send == .audited.response
            and .audited.plain > 0 and .audited.gzip > 0 and .databases == 2 and .processes == 2
            and .peerToken == 401 and .implicitAndExplicitDenials == 403 and .authenticated and .restart and .cleanup)' "$receipts/independent.json"
          jq -se 'length == 1 and (.[0] | .returnedBoundary == 1440 and .returnedExtra[0] == 1441
            and .slotBoundary == 1440 and .slotExtra[0] == 1441 and .audit.call > 0
            and .audit.call == .audit.send and .audit.send == .audit.response and .cleanup)' "$receipts/bounds.json"
          sha256sum --check "$receipts/binary.sha256"
      - name: Retain build identity and the three SDK observations
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cloudwatch-custom-metrics-c128cc3-${{ github.run_id }}
          path: ${{ runner.temp }}/metric-receipts/
          retention-days: 14
          if-no-files-found: error
