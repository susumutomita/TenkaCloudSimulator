name: STS SDK lifecycle and IAM Console verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-sts:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PRODUCT: 715a0b99b7369d562493800441f4923f3d672246
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 715a0b99b7369d562493800441f4923f3d672246
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the exact product and provision the pinned SDK and Chromium
        run: |
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/55-715a0b9-native-and-console
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          umask 077
          mkdir "$RUNNER_TEMP/sts-results" "$RUNNER_TEMP/sts-private"
          make build
          test -z "$(git status --porcelain)"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/sts-results/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/sts-results/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/sts-results/build.txt"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test "$("$python" --version)" = "Python 3.12.16"
          "$python" -m venv "$RUNNER_TEMP/sts-tools"
          "$RUNNER_TEMP/sts-tools/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/sts-tools/bin/playwright" install --with-deps chromium
      - name: Run both committed fixtures against the same binary in private loopback namespaces
        run: |
          umask 077
          set -euo pipefail
          python="$RUNNER_TEMP/sts-tools/bin/python"
          private="$RUNNER_TEMP/sts-private"
          receipts="$RUNNER_TEMP/sts-results"
          binary="$PWD/dist/tenkacloud-simulator"
          digest=$(sha256sum "$binary" | cut -d ' ' -f 1)
          "$python" -I -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ); assert "CHROMIUM_EXECUTABLE" not in os.environ; assert not any(os.path.lexists(p) for p in (Path.home()/".aws", Path.home()/".boto", "/etc/boto.cfg"))'
          cat > "$private/launch.py" <<'PY'
          import os, socket, sys
          from pathlib import Path
          sys.path.insert(0, str(Path.cwd() / "test/e2e"))
          import run_s3_multipart_paging as guard
          uid, net, user, script, binary, digest = sys.argv[1:]
          status = Path("/proc/self/status").read_text()
          guard.validate_inside_context(int(uid), int(net), int(user), uid=os.getuid(), euid=os.geteuid(),
                                        net=guard.namespace_inode("net"), user=guard.namespace_inode("user"),
                                        status=status, interfaces=[name for _, name in socket.if_nameindex()],
                                        lo_up=guard.loopback_up())
          assert next(row.split()[1] for row in status.splitlines() if row.startswith("CapBnd:")) == "0000000000000000"
          os.execv(sys.executable, [sys.executable, "-B", script, "--binary", binary, "--binary-sha256", digest])
          PY
          run_fixture() {
            local script=$1
            test "$(sha256sum "$binary" | cut -d ' ' -f 1)" = "$digest"
            if ! unshare --user --map-current-user --net --keep-caps sh -ec '
              ip link set lo up
              exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
            ' sts-check "$python" -IB "$private/launch.py" "$(id -u)" "$(stat -Lc %i /proc/self/ns/net)" \
              "$(stat -Lc %i /proc/self/ns/user)" "test/e2e/$script.py" "$binary" "$digest" \
              > "$private/$script.json" 2> "$private/$script.stderr"; then
              echo "$script failed" >&2
              exit 1
            fi
          }
          run_fixture sts_session_lifecycle
          jq -se --arg d "$digest" 'select(length==1) | .[0] | select(.=={
            status:"passed",binary_sha256:$d,sdk:"boto3 1.42.0 / botocore 1.41.6",two_processes:true,
            operator_and_assumed_identity:true,allowed_role_readback:true,persistent_role_after_restart:true,
            old_session_invalidated:true,peer_session_preserved:true,native_cleanup:true,temporary_state_removed:true})' \
            "$private/sts_session_lifecycle.json" > "$receipts/sdk.json"
          run_fixture sts_iam_console
          jq -se --arg d "$digest" 'select(length==1) | .[0] | select(.=={
            binary_sha256:$d,console_create_edit_delete:true,scalar_cookie_get_role:true,signed_sdk_role_session:true,
            read_only_participant_refused:true,cancel_preserved_trust:true,changed_trust_refused_new_session:true,
            owned_role_cleanup:true})' "$private/sts_iam_console.json" > "$receipts/console.json"
          jq -n --arg p "$PRODUCT" --arg w "$GITHUB_SHA" --arg d "$digest" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" '{product:$p,workflow:$w,binary_sha256:$d,run:$run,attempt:$attempt}' > "$receipts/run.json"
      - name: Retain the verified SDK and browser results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sts-sdk-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sts-results/
          if-no-files-found: error
          retention-days: 14
