name: Native ALB and EC2 placement verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    name: Native ALB placement, Lambda lifecycle and two-team persistence
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PRODUCT: 4c32b71522e4af2d1f49894befed2867774539ce
      PRODUCT_TREE: 4edad775a1a7f4d44bbe84cd154c40c190c4a7d2
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4c32b71522e4af2d1f49894befed2867774539ce
          path: product
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: product/go.sum
      - name: Prepare pinned SDK and identify the exact clean simulator
        working-directory: product
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          receipts="$RUNNER_TEMP/alb-receipts"
          mkdir "$receipts"
          go version -m dist/tenkacloud-simulator > "$receipts/build.txt"
          grep -F "vcs.revision=$PRODUCT" "$receipts/build.txt"
          grep -F 'vcs.modified=false' "$receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$receipts/binary.sha256"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/alb-sdk"
          "$RUNNER_TEMP/alb-sdk/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/alb-sdk/bin/python" -m pip check
      - name: Run ordinary authenticated Query SDKs on isolated loopback
        working-directory: product
        run: |
          python="$RUNNER_TEMP/alb-sdk/bin/python"
          "$python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          receipts="$RUNNER_TEMP/alb-receipts"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' isolated "$python" -B test/e2e/elb.py > "$receipts/stock.json"
          jq -se 'length == 1 and (.[0] | .elbNativeSDK and .lambdaTargetDataPlane
            and .periodicHealthChecks and .twoAuthenticatedProcesses and .actualCLIReopen
            and .copiedStandaloneWithoutExecutablesOnPath and .participantIAM and .teardown == "DELETED" and .placement.sameVpc
            and .placement.distinctZones == 2 and .placement.explicitGroups == 1
            and .placement.sharedOwnerDeleteProtected and .placement.crossRegionRejected
            and .placement.crossTeamRejected and .placement.restartVerified and .counts.calls > 0
            and .counts.calls == .counts.sends and .counts.sends == .counts.responses)' "$receipts/stock.json"
          sha256sum --check "$receipts/binary.sha256"
      - name: Retain build identity and available SDK observations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: alb-placement-4c32b71-${{ github.run_id }}
          path: ${{ runner.temp }}/alb-receipts/
          retention-days: 14
          if-no-files-found: error
  complete-before-commit:
    name: Unfiltered standard make before-commit at 4c32b71
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4c32b71522e4af2d1f49894befed2867774539ce
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify fixed product source and ordinary runner
        run: |
          test "$(git rev-parse HEAD)" = 4c32b71522e4af2d1f49894befed2867774539ce
          test "$(git rev-parse HEAD^{tree})" = 4edad775a1a7f4d44bbe84cd154c40c190c4a7d2
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          mkdir -p "$RUNNER_TEMP/alb-complete-gate"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/alb-complete-gate/source.txt"
          uname -srmo > "$RUNNER_TEMP/alb-complete-gate/platform.txt"
          go version > "$RUNNER_TEMP/alb-complete-gate/go.txt"
          python3 --version > "$RUNNER_TEMP/alb-complete-gate/python.txt"
      - name: Run original complete make before-commit
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          make before-commit 2>&1 | tee "$RUNNER_TEMP/alb-complete-gate/full.log"
          codes=("${PIPESTATUS[@]}")
          result=${codes[0]}
          if test "$result" -eq 0 && test "${codes[1]}" -ne 0; then result=${codes[1]}; fi
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/alb-complete-gate/make-exit.txt"
          exit "$result"
      - name: Preserve safe coverage and package outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'alb-complete-gate'
          root.mkdir(parents=True, exist_ok=True)
          log = root / 'full.log'
          text = log.read_text(errors='replace') if log.exists() else ''
          safe = [line for line in text.splitlines()
                  if re.match(r'^(ok\s+github\.com/|FAIL(?:\s|$)|\?\s+github\.com/|coverage:|Ran \d+ tests? in|OK$|FAILED \()', line)
                  or 'coverage gate' in line.lower() or 'source coverage' in line.lower()
                  or 'statement coverage' in line.lower() or line.startswith('Go statements (full module)')]
          result = root / 'make-exit.txt'
          (root / 'summary.json').write_text(json.dumps({
              'source': '4c32b71522e4af2d1f49894befed2867774539ce',
              'command': 'make before-commit',
              'make_exit': int(result.read_text()) if result.exists() else None,
              'observed_summaries': safe,
              'scope': 'Unfiltered standard command. Failure remains failure; later phases are not inferred executed.'
          }, indent=2) + '\n')
          PY
          git status --porcelain > "$RUNNER_TEMP/alb-complete-gate/post-status.txt"
          if test -f dist/tenkacloud-simulator; then
            go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/alb-complete-gate/build.txt"
            sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/alb-complete-gate/binary.sha256"
          fi
      - name: Retain exact complete-gate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: alb-complete-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/alb-complete-gate/
            !${{ runner.temp }}/alb-complete-gate/full.log
          if-no-files-found: error
          retention-days: 14
