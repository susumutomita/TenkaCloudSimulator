name: Immutable EC2 launch-template SDK dependency verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      GOMAXPROCS: '1'
      PYTHONPYCACHEPREFIX: /tmp/launch-template-python-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4c377104c02bcb6c8aebda821428fd29bf089d6a
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build clean immutable native dependency source
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = 4c377104c02bcb6c8aebda821428fd29bf089d6a
          test -z "$(git status --porcelain)"
          make build
          mkdir -p "$RUNNER_TEMP/launch-template-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/launch-template-receipts/build.txt"
          grep -F 'vcs.revision=4c377104c02bcb6c8aebda821428fd29bf089d6a' "$RUNNER_TEMP/launch-template-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/launch-template-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/launch-template-receipts/binary.sha256"
      - name: Install unchanged pinned SDK fixture dependencies
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv /tmp/launch-template-tests
          /tmp/launch-template-tests/bin/python -m pip install -r scripts/requirements-test.txt
      - name: Run the unchanged stock two-process SDK lifecycle in loopback isolation
        run: |
          export PATH="/tmp/launch-template-tests/bin:$PATH"
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          set +e
          unshare --user --map-current-user --net --keep-caps sh -eu -c 'ip link set lo up; exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all python test/e2e/ec2_launch_templates.py' > "$RUNNER_TEMP/launch-template-private.log" 2>&1
          result=$?
          set -e
          export LAUNCH_TEMPLATE_EXIT="$result"
          echo "$result" > "$RUNNER_TEMP/launch-template-receipts/sdk.exit"
          python - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          text = (root / 'launch-template-private.log').read_text(errors='replace')
          status = int(os.environ['LAUNCH_TEMPLATE_EXIT'])
          receipt = {'sourceSha': '4c377104c02bcb6c8aebda821428fd29bf089d6a',
                     'case': 'stock-ec2-launch-template-v1', 'fixtureExit': status}
          if status == 0:
              records = [json.loads(line) for line in text.splitlines() if line.startswith('{"templateVersion":')]
              expected = {'templateVersion': 1, 'nativeOperations': 4, 'ownedProcesses': 2,
                          'restart': True, 'retiredReplayWithoutResurrection': True,
                          'sameNameFreshIdentity': True, 'peerUnchanged': True, 'cleanup': True}
              assert records == [expected]
              receipt['verifiedFixture'] = records[0]
          else:
              receipt['frames'] = [{'file': pathlib.Path(name).name, 'line': int(line)}
                  for name, line in re.findall(r'File "([^"\n]+)", line ([0-9]+)', text)][-12:]
              receipt['exceptionTypes'] = re.findall(r'^([A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception))(?::|$)', text, re.MULTILINE)[-3:]
          (root / 'launch-template-receipts' / 'sdk.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Stock EC2 launch-template dependency fixture exit:', status)
          PY
          sha256sum --check "$RUNNER_TEMP/launch-template-receipts/binary.sha256"
          test -z "$(git status --porcelain)"
          test "$result" -eq 0
      - name: Retain safe immutable source and SDK receipts only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ec2-launch-template-sdk-4c377104c02bcb6c8aebda821428fd29bf089d6a
          path: ${{ runner.temp }}/launch-template-receipts/
          if-no-files-found: error
          retention-days: 7
