name: Verify CloudWatch metric alarms with the stock SDK and browser
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cloudwatch:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 555fdb81f59eac8294846837f30781b11fe2aa23
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the immutable simulator on a neutral runner
        run: |
          set -euo pipefail
          umask 077
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = 555fdb81f59eac8294846837f30781b11fe2aa23
          test "$(git rev-parse HEAD^{tree})" = a52c1d2f147aa3bb40f0de0279eb48a0afd55aa4
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert not any(key.startswith(('AWS_', 'BOTO_')) for key in os.environ)
          assert not os.environ.get('GOFLAGS')
          paths = [Path.home() / name for name in ('.aws/config','.aws/credentials','.boto')]
          assert not any(path.exists() or path.is_symlink() for path in [*paths, Path('/etc/boto.cfg')])
          PY
          mkdir -m 700 "$RUNNER_TEMP/cw-receipts"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/cw-receipts/source.txt"
          make build
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/cw-receipts/build.txt"
          grep -F 'vcs.revision=555fdb81f59eac8294846837f30781b11fe2aa23' "$RUNNER_TEMP/cw-receipts/build.txt"
          grep -F 'v0.2.1-0.20261128140607-555fdb81f59e' "$RUNNER_TEMP/cw-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/cw-receipts/observed.sha256"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/cw-receipts/build.txt"
          echo 'ad723f02097fc1120b006e497d1d953517cb2d91922caf00e5268d10bbec845a  dist/tenkacloud-simulator' > "$RUNNER_TEMP/cw-receipts/binary.sha256"
          sha256sum --check "$RUNNER_TEMP/cw-receipts/binary.sha256"
      - name: Install pinned SDK, browser and audit dependencies
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3,12,16)'
          "$python" -m venv "$RUNNER_TEMP/cw-venv"
          "$RUNNER_TEMP/cw-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/cw-venv/bin/pip" check
          "$RUNNER_TEMP/cw-venv/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/cw-axe"
          "$RUNNER_TEMP/cw-venv/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/cw-venv/bin/python" - <<'PY'
          from importlib.metadata import version
          assert version('boto3')=='1.42.0' and version('botocore')=='1.41.6' and version('playwright')=='1.62.0'
          PY
      - name: Exercise genuine CloudWatch SDK, Cloudscape, Scalar and Logs
        run: |
          set -euo pipefail
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_BINARY_SHA256=ad723f02097fc1120b006e497d1d953517cb2d91922caf00e5268d10bbec845a
          export AXE_SCRIPT="$RUNNER_TEMP/cw-axe/axe.min.js"
          export PYTHONDONTWRITEBYTECODE=1
          chromium=("$HOME"/.cache/ms-playwright/chromium-*/chrome-linux64/chrome)
          test "${#chromium[@]}" -eq 1
          test -x "${chromium[0]}"
          export CHROMIUM_EXECUTABLE="${chromium[0]}"
          result=0
          unshare --user --map-current-user --net --keep-caps sh -eu -c '
            ip link set lo up
            test "$(ip -o link show | cut -d: -f2 | tr -d " ")" = lo
            echo loopback-only > "$RUNNER_TEMP/cw-receipts/interfaces.txt"
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$RUNNER_TEMP/cw-venv/bin/python" -B test/e2e/cloudwatch_observability_console.py
          ' > "$RUNNER_TEMP/cw-private.log" 2>&1 || result=$?
          echo "$result" > "$RUNNER_TEMP/cw-receipts/fixture.exit"
          python3 - "$result" <<'PY'
          import json, os, re, subprocess, sys
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          text=(temp/'cw-private.log').read_text(errors='replace')
          status=int(sys.argv[1])
          data={'exit':status}
          if status:
              known=set(subprocess.check_output(['git','ls-files'],text=True).splitlines())
              frames=[(p.removeprefix(str(Path.cwd())+'/'),int(n)) for p,n in re.findall(r'File "([^"\n]+)", line (\d+)',text)]
              data['frames']=[{'path':p,'line':n} for p,n in frames if p in known][-12:]
          else:
              reports=[json.loads(line) for line in text.splitlines() if line.startswith('{"auditedWidths":')]
              assert len(reports)==1
              report=reports[0]
              assert type(report['monitoringSdkCalls']) is int and report['monitoringSdkCalls']>40
              for key in ('logsRead','replacedRead','twoProcesses','restart','nativeCleanup'):
                  assert report[key] is True
              assert report['scalarStatus']==[200,200,200,200,403,200]
              assert report['observedAlarmStates']==['INSUFFICIENT_DATA','OK','ALARM']
              assert report['revokedContinuation']==403 and report['deniedStatistic']==403
              assert report['auditedWidths']==[1300,390]
              data['fixture']={k:report[k] for k in ('monitoringSdkCalls','scalarStatus','observedAlarmStates','logsRead','replacedRead','twoProcesses','restart','nativeCleanup','revokedContinuation','deniedStatistic','auditedWidths')}
          (temp/'cw-receipts'/'fixture.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          sha256sum --check "$RUNNER_TEMP/cw-receipts/binary.sha256"
          test -z "$(git status --porcelain)"
          exit "$result"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cloudwatch-stock-console-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cw-receipts/
          if-no-files-found: error
          retention-days: 7
