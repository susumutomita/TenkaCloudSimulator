name: SimpleDB historical Terraform verification
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash

jobs:
  verify-simpledb-terraform:
    name: Run the reviewed Linux Terraform lifecycle on loopback
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      FIXTURE_REVISION: fc1938e77f680525a2f29adc09ac3b05c7aa2736
      VERIFY_DIR: .github/verification/simpledb-terraform
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
          persist-credentials: false
      - name: Verify source, runtime and absence of ambient AWS configuration
        id: preflight
        run: |
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/300-terraform-local-provider
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = 16e162df57773cbb07af09944c555266fe433697
          test "$(git rev-parse HEAD~2)" = "$FIXTURE_REVISION"
          test -z "$(git status --porcelain)"
          for file in test/e2e/simpledb_terraform_provider.py test/e2e/run_s3_multipart_paging.py; do
            test "$(git rev-parse "$FIXTURE_REVISION:$file")" = "$(git hash-object "$file")"
          done
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test "$("$python" -I --version)" = "Python 3.12.16"
          umask 077
          mkdir "$RUNNER_TEMP/simpledb-inputs" "$RUNNER_TEMP/simpledb-verdict"
          echo "PYTHON=$python" >> "$GITHUB_ENV"
          "$python" -IB "$VERIFY_DIR/verify.py" preflight
      - name: Download the exact source build and official Linux releases
        id: inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          cd "$RUNNER_TEMP/simpledb-inputs"
          api="repos/susumutomita/TenkaCloudSimulator/actions"
          gh api "$api/runs/46108834461" > build-run.json
          gh api "$api/artifacts/15249080577" > artifact.json
          gh api "$api/artifacts/15249080577/zip" > historical-build.zip
          for release in terraform/1.11.4 terraform-provider-aws/5.100.0; do
            product=${release%/*}
            version=${release#*/}
            for file in "${product}_${version}_SHA256SUMS" "${product}_${version}_linux_amd64.zip"; do
              curl --fail --silent --show-error --proto '=https' --tlsv1.2 --retry 2 \
                "https://releases.hashicorp.com/$release/$file" -o "$file"
            done
          done
          "$PYTHON" -IB "$GITHUB_WORKSPACE/$VERIFY_DIR/verify.py" prepare
      - name: Run the unmodified fixture in its own loopback-only namespace
        id: fixture
        run: bash "$VERIFY_DIR/isolate.sh" inside
      - name: Observe a separate stock fixture after a failure
        id: diagnostic
        if: failure() && steps.inputs.outcome == 'success' && steps.fixture.outcome == 'failure'
        run: bash "$VERIFY_DIR/isolate.sh" diagnose
      - name: Record which verification stages completed
        if: always()
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          INPUTS: ${{ steps.inputs.outcome }}
          FIXTURE: ${{ steps.fixture.outcome }}
          DIAGNOSTIC: ${{ steps.diagnostic.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/simpledb-verdict"
          jq -n --arg commit "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg preflight "$PREFLIGHT" --arg inputs "$INPUTS" --arg fixture "$FIXTURE" --arg diagnostic "$DIAGNOSTIC" \
            '{workflowRevision:$commit,runID:$run,runAttempt:$attempt,preflight:$preflight,verifiedInputs:$inputs,fixture:$fixture,diagnostic:$diagnostic}' \
            > "$RUNNER_TEMP/simpledb-verdict/stages.json"
      - name: Retain the sanitized verification result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: simpledb-terraform-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simpledb-verdict/
          if-no-files-found: error
          retention-days: 14
