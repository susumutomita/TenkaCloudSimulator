name: Verify native CodeCommit Git history
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 5faf8e53f3f0eecdfe7af5b3dd675385edf4228b
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
      - name: Build the exact product and install pinned clients
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 5faf8e53f3f0eecdfe7af5b3dd675385edf4228b
          test "$(git rev-parse 'HEAD^{tree}')" = d74960fe4e8bfa17d98d3693a61dfac4a1522425
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          mkdir "$RUNNER_TEMP/proof"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/proof/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/proof/build.txt"
          grep -F 'vcs.revision=5faf8e53f3f0eecdfe7af5b3dd675385edf4228b' "$RUNNER_TEMP/proof/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/proof/binary.sha256"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements-test.txt
      - name: Use Git and the stock SDK with two real, isolated simulator processes
        run: |
          set -euo pipefail
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          python="$RUNNER_TEMP/venv/bin/python"
          "$python" -IB -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_","BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in [Path.home()/".aws",Path.home()/".boto","/etc/boto.cfg"])'
          export ORIGINAL_UID="$(id -u)" ORIGINAL_NET="$(stat -Lc %i /proc/self/ns/net)" ORIGINAL_USER="$(stat -Lc %i /proc/self/ns/user)"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' neutral sh -ec '
            set -x
            test "$(id -u)" = "$ORIGINAL_UID"
            test "$(id -u)" -ne 0
            test "$(stat -Lc %i /proc/self/ns/net)" != "$ORIGINAL_NET"
            test "$(stat -Lc %i /proc/self/ns/user)" != "$ORIGINAL_USER"
            "$1" -IB -c "import socket; assert [name for _,name in socket.if_nameindex()] == [\"lo\"]"
            grep -Eq "^CapEff:[[:space:]]*0+$" /proc/self/status
            grep -Eq "^CapBnd:[[:space:]]*0+$" /proc/self/status
            "$1" -B -c "import boto3,botocore; assert (boto3.__version__,botocore.__version__) == (\"1.42.0\",\"1.41.6\")"
            "$1" -B test/e2e/aws_catalog_fixtures.py codecommit > "$RUNNER_TEMP/proof/catalog.txt"
            "$1" -B test/e2e/codecommit_git.py > "$RUNNER_TEMP/proof/git.json"
            git --version > "$RUNNER_TEMP/proof/git-version.txt"
          ' fixture "$python"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codecommit-git-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/
          retention-days: 14
