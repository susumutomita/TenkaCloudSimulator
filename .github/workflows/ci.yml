name: Verify native and Cloudscape CodeStar Notifications
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notifications:
    name: Real pinned SDK, Scalar and Cloudscape notifications on two immutable inputs
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      NATIVE: da4fa53a80b3e61ade21dc28bf480f973a94b278
      NATIVE_TREE: 5152c14cc8536303063d9434bbe2dd1f5a82f18f
      CONSOLE: b88d3d8dbe9b44a5ec0bd0cd25caeee395bfd32a
      CONSOLE_TREE: 74fb57ed2bcd2fd4f3458b922bbdd2ae17644dca
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: native
          ref: da4fa53a80b3e61ade21dc28bf480f973a94b278
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          path: console
          ref: b88d3d8dbe9b44a5ec0bd0cd25caeee395bfd32a
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: native/go.sum
      - name: Build and identify clean standalone inputs
        run: |
          test "$(go env GOVERSION)" = go1.26.11
          mkdir "$RUNNER_TEMP/receipts"
          build() (
            cd "$1"
            test "$(git rev-parse HEAD)" = "$2"
            test "$(git rev-parse 'HEAD^{tree}')" = "$3"
            test -z "$(git status --porcelain)"
            make build
            go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/$1-build.txt"
            grep -F "vcs.revision=$2" "$RUNNER_TEMP/receipts/$1-build.txt"
            grep -F 'vcs.modified=false' "$RUNNER_TEMP/receipts/$1-build.txt"
            sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/$1-binary.sha256"
          )
          build native "$NATIVE" "$NATIVE_TREE"
          build console "$CONSOLE" "$CONSOLE_TREE"
      - name: Install repository-pinned SDK, browser and accessibility audit
        working-directory: console
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/sdk/bin/pip" check
          "$RUNNER_TEMP/sdk/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/sdk/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/axe"
      - name: Verify exact SDK, Scalar and interactive Cloudscape with a private loopback
        run: |
          python="$RUNNER_TEMP/sdk/bin/python"
          "$python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          test "$(id -u)" -ne 0
          chromium=( "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux64/chrome )
          test "${#chromium[@]}" -eq 1
          test -x "${chromium[0]}"
          export CHROMIUM_EXECUTABLE="${chromium[0]}"
          export AXE_SCRIPT="$RUNNER_TEMP/axe/axe.min.js"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' verify sh -ec '
            test "$(awk -F: "NR>2 {gsub(/ /,\"\",\$1);print \$1}" /proc/net/dev)" = lo
            test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = 0000000000000000
            python="$1"
            status=0
            cd native
            export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
            "$python" -B test/e2e/codestar_notifications.py > "$RUNNER_TEMP/receipts/native-sdk.json" || status=1
            "$python" -B test/e2e/codestar_notification_scalar.py > "$RUNNER_TEMP/receipts/native-scalar.json" || status=1
            cd ../console
            export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
            "$python" -B test/e2e/codestar_notification_console.py > "$RUNNER_TEMP/receipts/console-sdk.json" || status=1
            cat "$RUNNER_TEMP"/receipts/*.json
            exit "$status"
          ' verify "$python"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: branch-notification-stack-${{ github.run_id }}
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error
