name: Kinesis Video isolated client verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kinesis-video-e2e:
    name: Isolated Kinesis Video SDK, browser and catalog
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: 3129de8000c4f99fb3ea59a589fc40f741c52175
          fetch-depth: 1
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Confirm the exact clean product
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "3129de8000c4f99fb3ea59a589fc40f741c52175"
          test "$(git rev-parse HEAD^{tree})" = "da5c17de7cf97e2362d997ab106294c4ca6c7712"
          test -z "$(git status --porcelain --untracked-files=no)"
      - name: Prepare pinned clients, browser, codecs and accessibility tools
        run: |
          set -euo pipefail
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/video-python"
          "$RUNNER_TEMP/video-python/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/video-python/bin/playwright" install --with-deps chromium
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          "$RUNNER_TEMP/video-python/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/video-audit"
          make prepare-kinesis-video-java PYTHON="$RUNNER_TEMP/video-python/bin/python" KINESIS_VIDEO_JARS="$RUNNER_TEMP/video-jars"
      - name: Run the three fixtures against the same build
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME_17_X64/bin:$PATH"
          export AXE_SCRIPT="$RUNNER_TEMP/video-audit/axe.min.js"
          export KINESIS_VIDEO_RECEIPT="$RUNNER_TEMP/kinesis-video-e2e.json"
          make e2e-kinesis-video PYTHON="$RUNNER_TEMP/video-python/bin/python" KINESIS_VIDEO_JARS="$RUNNER_TEMP/video-jars"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: kinesis-video-e2e-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kinesis-video-e2e.json
          if-no-files-found: error
          retention-days: 7
