name: Native historical reference candidate verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-reference:
    name: Native Logs, Secrets Manager, DynamoDB and navigation references
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PRODUCT: 7de43f8ae50a761d73fc7b72fbf76c48f0d96c51
      PRODUCT_TREE: 99d34741dff6bd560e36d7ebe45b5cf3a1aa1004
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 7de43f8ae50a761d73fc7b72fbf76c48f0d96c51
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the exact product and prepare its pinned SDK
        run: |
          test "$(id -u)" -ne 0
          test "$(go env GOVERSION)" = go1.26.11
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          make build
          receipts="$RUNNER_TEMP/native-reference-receipts"
          mkdir "$receipts"
          go version -m dist/tenkacloud-simulator > "$receipts/build.txt"
          grep -F "vcs.revision=$PRODUCT" "$receipts/build.txt"
          grep -F 'vcs.modified=false' "$receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$receipts/binary.sha256"
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv /tmp/native-reference-sdk
          /tmp/native-reference-sdk/bin/python -m pip install -r scripts/requirements-test.txt
          /tmp/native-reference-sdk/bin/python -m pip check
          cat > "$RUNNER_TEMP/native-navigation-check.py" <<'PYTHON'
          import json
          import urllib.request
          from pathlib import Path

          from api_cloud_sections_contract import compare_native, validate_document
          from check import running

          source = json.loads(Path('internal/server/apidocs/openapi.json').read_text())
          with running(authenticated=True) as (endpoint, token):
              opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
              request = urllib.request.Request(endpoint + '/_simulator/docs/openapi.json',
                                               headers={'X-Simulator-Token': token})
              with opener.open(request, timeout=5) as response:
                  assert response.status == 200
                  served = json.load(response)
              assert source == served
              compare_native(served, source)
              print(json.dumps(validate_document(served)))
          PYTHON
      - name: Run the stock native fixtures and reference regressions on isolated loopback
        run: |
          /tmp/native-reference-sdk/bin/python -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_REPORTS="$RUNNER_TEMP/native-reference-work"
          receipts="$RUNNER_TEMP/native-reference-receipts"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' isolated sh -ec '
            python=/tmp/native-reference-sdk/bin/python
            "$python" -B test/e2e/test_storage_reference_sakura_projection.py -v
            "$python" -B test/e2e/test_route53_reference_adapters.py -v
            "$python" -B test/e2e/test_openapi_json10.py -v
            "$python" -B test/e2e/api_cloud_sections_contract.py --self-test
            PYTHONPATH="$PWD/test/e2e" "$python" -B "$RUNNER_TEMP/native-navigation-check.py" > "$1/navigation.json"
            "$python" -B test/e2e/dynamodb_docs.py > "$1/dynamodb.json"
            "$python" -B test/e2e/cloudwatch_logs.py > "$1/logs.json"
            "$python" -B test/e2e/secrets_manager_docs.py > "$1/secrets.txt"
          ' fixtures "$receipts"
          jq -se 'length == 1 and (.[0] | .nativeSDK == "boto3 1.42.0" and (.operations | length == 8)
            and .counts.calls > 0 and .counts.sends == .counts.calls and .counts.responses == .counts.calls
            and .twoAuthenticatedProcesses == true and .twoPersistentSQLiteDatabases == true
            and .sameNamesIndependentState == true and .cursorAndIngestionSurviveRestart == true
            and .peerCleanupPersisted == true and .cleanup == "DELETED" and .realAWS == false
            and .reference.operationIDsPreserved == 67 and .reference.pathsPreserved == 36
            and .reference.sharedRootExamplesExecuted == 8 and .reference.SDKSameSQLiteBytes == true
            and .reference.cleanup == "DELETED")' "$receipts/logs.json"
          grep -Fx 'Secrets Manager served OpenAPI seven real HTTP examples/native SDK shared-state PASS' "$receipts/secrets.txt"
          jq -se 'length == 1 and (.[0] | .paths == 36 and .operationIDs == 67
            and .cloudGroups == ["AWS", "Google Cloud", "Azure", "Sakura Cloud"]
            and .controlGroup == "Simulator" and .documentationOnlyServiceGuides == 7
            and .SakuraOperations == 5)' "$receipts/navigation.json"
          jq -se 'length == 1 and (.[0] | .servedSevenTemplates ==
            ["CreateTable", "ListTables", "DescribeTable", "PutItem", "GetItem", "DeleteItem", "DeleteTable"]
            and .mainPaths == 36 and .mainOperationIDs == 67 and .nativeHTTPCounts == {"calls":7,"responses":7}
            and .SDKCounts.calls > 0 and .SDKCounts.calls == .SDKCounts.sends
            and .SDKCounts.sends == .SDKCounts.responses and .sharedSQLiteConfirmed == true
            and .sourceEqualsServed == true and .schemaValidatedNativeResponses == 7
            and .cleanup == "DELETED" and .realAWS == false)' "$receipts/dynamodb.json"
          sha256sum --check "$receipts/binary.sha256"
      - name: Retain product identity and native results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: native-reference-7de43f8-${{ github.run_id }}
          path: ${{ runner.temp }}/native-reference-receipts/
          if-no-files-found: error
          retention-days: 14
