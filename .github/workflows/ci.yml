name: Route 53 transaction rollback on the merged source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      REVISION: 17e30e18d0eb2216961158ae48f8ef42a20225e8
      TREE: 0f5776bef7e66bd003d8d628f78c564723efa7db
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: verification
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.REVISION }}
          path: product
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: product/go.sum
      - name: Run the native SQLite transaction and retry twice with the race detector
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$REVISION"
          test "$(git rev-parse HEAD^{tree})" = "$TREE"
          test -z "$(git status --porcelain)"
          export EVIDENCE="$GITHUB_WORKSPACE/verification/.github/verification/route53/receipt_rollback_test.go"
          echo "c4e151e1d329cd67846e82670b5435c52695d0b0098a0ebce1bd35a5c07a838e  $EVIDENCE" | sha256sum -c -
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          target = Path.cwd() / 'internal/aws/route53_active_receipt_test.go'
          assert not target.exists()
          (Path(os.environ['RUNNER_TEMP']) / 'overlay.json').write_text(json.dumps({
              'Replace': {str(target): os.environ['EVIDENCE']},
          }))
          PY
          set -o pipefail
          go test -overlay "$RUNNER_TEMP/overlay.json" -race -count=2 -p 1 -v -run '^TestRoute53InterruptedStagedReceipt$' ./internal/aws | tee "$RUNNER_TEMP/rollback.log"
          test "$(grep -c '^--- PASS: TestRoute53InterruptedStagedReceipt' "$RUNNER_TEMP/rollback.log")" = 2
          test "$(grep -c -- '--- PASS: TestRoute53InterruptedStagedReceipt/context_canceled' "$RUNNER_TEMP/rollback.log")" = 2
          test "$(grep -c -- '--- PASS: TestRoute53InterruptedStagedReceipt/context_deadline_exceeded' "$RUNNER_TEMP/rollback.log")" = 2
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: route53-rollback-${{ github.run_id }}
          path: ${{ runner.temp }}/rollback.log
          if-no-files-found: warn
          retention-days: 14
