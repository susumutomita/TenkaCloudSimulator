name: Native ALB and EC2 placement verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    name: Native ALB placement, Lambda lifecycle and two-team persistence
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PRODUCT: 65be0b4929858c786a9b72d1e950f61fd2b407ad
      PRODUCT_TREE: 15f682127c9403aec510a36edb29aea1fa0ac34c
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 65be0b4929858c786a9b72d1e950f61fd2b407ad
          path: product
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: product/go.sum
      - name: Prepare pinned SDK and identify the exact clean simulator
        working-directory: product
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          receipts="$RUNNER_TEMP/alb-receipts"
          mkdir "$receipts"
          go version -m dist/tenkacloud-simulator > "$receipts/build.txt"
          grep -F "vcs.revision=$PRODUCT" "$receipts/build.txt"
          grep -F 'vcs.modified=false' "$receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$receipts/binary.sha256"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/alb-sdk"
          "$RUNNER_TEMP/alb-sdk/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/alb-sdk/bin/python" -m pip check
      - name: Run ordinary authenticated Query SDKs on isolated loopback
        working-directory: product
        run: |
          python="$RUNNER_TEMP/alb-sdk/bin/python"
          "$python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          receipts="$RUNNER_TEMP/alb-receipts"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' isolated "$python" -B test/e2e/elb.py > "$receipts/stock.json"
          jq -se 'length == 1 and (.[0] | .elbNativeSDK and .lambdaTargetDataPlane
            and .periodicHealthChecks and .twoAuthenticatedProcesses and .actualCLIReopen
            and .participantIAM and .teardown == "DELETED" and .placement.sameVpc
            and .placement.distinctZones == 2 and .placement.explicitGroups == 1
            and .placement.sharedOwnerDeleteProtected and .placement.crossRegionRejected
            and .placement.crossTeamRejected and .placement.restartVerified and .counts.calls > 0
            and .counts.calls == .counts.sends and .counts.sends == .counts.responses)' "$receipts/stock.json"
          sha256sum --check "$receipts/binary.sha256"
      - name: Retain build identity and available SDK observations
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: alb-placement-65be0b4-${{ github.run_id }}
          path: ${{ runner.temp }}/alb-receipts/
          retention-days: 14
          if-no-files-found: error
