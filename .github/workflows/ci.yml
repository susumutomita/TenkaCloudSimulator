name: Verify ELBv2 Query reference candidate
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    name: Official ELBv2 SDK and genuine Scalar Query sends
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PRODUCT: 62c4a2bc49fc0a80a8bf1bf1e4828c1d2082a17a
      PRODUCT_TREE: 35a1eb33a9e883610301a48b98884fa66b77a716
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 62c4a2bc49fc0a80a8bf1bf1e4828c1d2082a17a
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: go.sum
      - name: Build the exact clean standalone simulator
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          mkdir "$RUNNER_TEMP/elb-query-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/elb-query-receipts/build.txt"
          grep -F "vcs.revision=$PRODUCT" "$RUNNER_TEMP/elb-query-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/elb-query-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/elb-query-receipts/binary.sha256"
      - name: Install the repository-pinned tools in the development runner
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/elb-query-venv"
          "$RUNNER_TEMP/elb-query-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/elb-query-venv/bin/pip" check
          "$RUNNER_TEMP/elb-query-venv/bin/playwright" install --with-deps chromium
      - name: Exercise the original ELBv2 SDK lifecycle and the shared Scalar reference on isolated loopback
        run: |
          python="$RUNNER_TEMP/elb-query-venv/bin/python"
          "$python" -c 'import os; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ)'
          test "$(id -u)" -ne 0
          export SIMULATOR_BINARY_SHA256="$(cut -d' ' -f1 "$RUNNER_TEMP/elb-query-receipts/binary.sha256")"
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          chromium=( "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux64/chrome )
          test "${#chromium[@]}" -eq 1
          test -x "${chromium[0]}"
          export CHROMIUM_EXECUTABLE="${chromium[0]}"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' verify sh -ec '
            actual_ifaces=$(awk -F: "NR>2 {gsub(/ /, \"\", \$1); print \$1}" /proc/net/dev)
            test "$actual_ifaces" = lo
            test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = 0000000000000000
            echo "Private loopback and zero effective capabilities verified"
            status=0
            "$1" -B test/e2e/elb.py > "$2/native.json" || status=1
            "$1" -B test/e2e/elb_scalar.py > "$2/scalar.json" || status=1
            exit "$status"
          ' verify "$python" "$RUNNER_TEMP/elb-query-receipts"
          jq -e '.elbNativeSDK and .lambdaTargetDataPlane and .periodicHealthChecks and .twoAuthenticatedProcesses and .actualCLIReopen and .copiedStandaloneWithoutExecutablesOnPath and .participantIAM and .placement.restartVerified and .teardown=="DELETED" and .counts.sends==.counts.responses and .counts.sends==.counts.calls and .counts.sends>0' "$RUNNER_TEMP/elb-query-receipts/native.json"
          jq -e --arg binary "$SIMULATOR_BINARY_SHA256" '.binary==$binary and .stockSDKReadback and .reopened and .peerPreserved and .cleanup and .scalarSends==[["CreateTargetGroup",200],["DescribeLoadBalancers",200],["DescribeTargetHealth",200],["DescribeLoadBalancers",200],["DeleteTargetGroup",403]]' "$RUNNER_TEMP/elb-query-receipts/scalar.json"
          sha256sum --check "$RUNNER_TEMP/elb-query-receipts/binary.sha256"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: elb-query-and-sdk-${{ github.run_id }}
          path: ${{ runner.temp }}/elb-query-receipts/
          if-no-files-found: error
          retention-days: 14
  complete-before-commit:
    name: Unfiltered standard make before-commit at 62c4a2b
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 62c4a2bc49fc0a80a8bf1bf1e4828c1d2082a17a
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify fixed product source and ordinary runner
        run: |
          test "$(git rev-parse HEAD)" = 62c4a2bc49fc0a80a8bf1bf1e4828c1d2082a17a
          test "$(git rev-parse HEAD^{tree})" = 35a1eb33a9e883610301a48b98884fa66b77a716
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          mkdir -p "$RUNNER_TEMP/elb-query-complete-gate"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/elb-query-complete-gate/source.txt"
          uname -srmo > "$RUNNER_TEMP/elb-query-complete-gate/platform.txt"
          go version > "$RUNNER_TEMP/elb-query-complete-gate/go.txt"
          python3 --version > "$RUNNER_TEMP/elb-query-complete-gate/python.txt"
      - name: Run original complete make before-commit
        run: |
          test -z "$(git status --porcelain --untracked-files=all)"
          set +e
          make before-commit 2>&1 | tee "$RUNNER_TEMP/elb-query-complete-gate/full.log"
          codes=("${PIPESTATUS[@]}")
          result=${codes[0]}
          if test "$result" -eq 0 && test "${codes[1]}" -ne 0; then result=${codes[1]}; fi
          set -e
          printf '%s\n' "$result" > "$RUNNER_TEMP/elb-query-complete-gate/make-exit.txt"
          exit "$result"
      - name: Preserve safe coverage and package outcomes
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'elb-query-complete-gate'
          root.mkdir(parents=True, exist_ok=True)
          log = root / 'full.log'
          text = log.read_text(errors='replace') if log.exists() else ''
          safe = [line for line in text.splitlines()
                  if re.match(r'^(ok\s+github\.com/|FAIL(?:\s|$)|\?\s+github\.com/|coverage:|Ran \d+ tests? in|OK$|FAILED \()', line)
                  or 'coverage gate' in line.lower() or 'source coverage' in line.lower()
                  or 'statement coverage' in line.lower() or line.startswith('Go statements (full module)')]
          result = root / 'make-exit.txt'
          (root / 'summary.json').write_text(json.dumps({
              'source': '62c4a2bc49fc0a80a8bf1bf1e4828c1d2082a17a',
              'command': 'make before-commit',
              'make_exit': int(result.read_text()) if result.exists() else None,
              'observed_summaries': safe,
              'scope': 'Unfiltered standard command. Failure remains failure; later phases are not inferred executed.'
          }, indent=2) + '\n')
          PY
          git status --porcelain > "$RUNNER_TEMP/elb-query-complete-gate/post-status.txt"
          if test -f dist/tenkacloud-simulator; then
            go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/elb-query-complete-gate/build.txt"
            sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/elb-query-complete-gate/binary.sha256"
          fi
      - name: Retain exact complete-gate evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: elb-query-complete-gate-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/elb-query-complete-gate/
            !${{ runner.temp }}/elb-query-complete-gate/full.log
          if-no-files-found: error
          retention-days: 14
