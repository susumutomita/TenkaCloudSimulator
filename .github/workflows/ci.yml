name: SimpleDB merged Console and Scalar verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: SimpleDB Console and Scalar on the exact merged revision
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    env:
      PRODUCT_REVISION: 8a9be8bd5a2d56959e6cbc6b5e80fb9b57e5935e
      PRODUCT_TREE: 89d19f4977786471b8f02e6fd49d51cce4996eb0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: verification
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.PRODUCT_REVISION }}
          path: product
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: product/go.sum
      - name: Build the clean product and install its pinned SDK and browser
        working-directory: product
        run: |
          test "$(git rev-parse HEAD)" = "$PRODUCT_REVISION"
          test "$(git rev-parse HEAD^{tree})" = "$PRODUCT_TREE"
          test -z "$(git status --porcelain)"
          test "$(id -u)" -ne 0
          make build
          mkdir -p "$RUNNER_TEMP/simpledb-receipt"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/simpledb-receipt/build.txt"
          grep -F "vcs.revision=$PRODUCT_REVISION" "$RUNNER_TEMP/simpledb-receipt/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/simpledb-receipt/build.txt"
          echo "PRODUCT_ROOT=$PWD" >> "$GITHUB_ENV"
          echo "PRODUCT_DIGEST=$(sha256sum dist/tenkacloud-simulator | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv "$RUNNER_TEMP/simpledb-tools"
          "$RUNNER_TEMP/simpledb-tools/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/simpledb-tools/bin/playwright" install --with-deps chromium
      - name: Run the original Scalar and Console fixtures with sandboxed Chromium
        run: |
          export CASE="$GITHUB_WORKSPACE/verification/.github/verification/simpledb/postmerge_browser.py"
          unshare --user --map-current-user --net --keep-caps sh -eu -c '
            ip link set lo up
            exec setpriv --no-new-privs --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$RUNNER_TEMP/simpledb-tools/bin/python" -B "$CASE"
          '
      - name: Save verified browser outcomes
        if: success()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: simpledb-merged-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/simpledb-receipt/
          if-no-files-found: error
          retention-days: 14
