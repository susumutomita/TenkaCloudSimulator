name: Verify the ELBv2 regional Cloudscape and Scalar
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    name: ELBv2 regional Cloudscape and Scalar / ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: before-commit
            os: ubuntu-24.04
          - check: sdk
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4f55ad54e4489cb19394f575026df51af3e096b5
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify the immutable source, toolchain and neutral runner
        run: |
          test "$(git rev-parse HEAD)" = 4f55ad54e4489cb19394f575026df51af3e096b5
          test "$(git rev-parse HEAD^{tree})" = e69ed4b33edd8ecbb6b1ab2f6ba1617e3a678ba9
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          mkdir -m 700 -p "$RUNNER_TEMP/elb-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/elb-evidence/source.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert not any(key.startswith(('AWS_', 'BOTO_')) for key in os.environ)
          assert not any(os.environ.get(key) for key in ('GOFLAGS', 'MAKEFLAGS', 'GO_TEST_RUN_FILE', 'GO_TEST_PACKAGES'))
          paths = [Path.home() / p for p in ('.aws/config', '.aws/credentials', '.boto')]
          assert not any(path.exists() or path.is_symlink() for path in [*paths, Path('/etc/boto.cfg')])
          PY
      - name: Run the unfiltered standard repository gate
        if: matrix.check == 'before-commit'
        run: |
          umask 077
          set +e
          make before-commit > "$RUNNER_TEMP/elb-private.log" 2>&1
          status=$?
          set -e
          printf '%d\n' "$status" > "$RUNNER_TEMP/elb-evidence/make-exit.txt"
          exit "$status"
      - name: Check both official coverage floors on the complete profile
        if: matrix.check == 'before-commit'
        run: |
          set -euo pipefail
          umask 077
          go run github.com/boumenot/gocover-cobertura@v1.4.0 < reports/coverage.out > "$RUNNER_TEMP/elb-coverage.xml"
          status=0
          python3 scripts/check-coverage.py reports/coverage.out "$RUNNER_TEMP/elb-coverage.xml" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/elb-evidence/coverage-exit.txt"
          cp "$RUNNER_TEMP/coverage-summary.md" "$RUNNER_TEMP/elb-evidence/coverage-summary.md"
          exit "$status"
      - name: Build the simulator for the SDK
        if: matrix.check == 'sdk'
        run: make build
      - name: Identify the exact binary
        run: |
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/elb-evidence/build.txt"
          grep -F 'vcs.revision=4f55ad54e4489cb19394f575026df51af3e096b5' "$RUNNER_TEMP/elb-evidence/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/elb-evidence/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/elb-evidence/binary.sha256"
      - name: Install the pinned SDK and Chromium
        if: matrix.check == 'sdk'
        run: |
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'
          "$python" -m venv "$RUNNER_TEMP/elb-venv"
          "$RUNNER_TEMP/elb-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/elb-venv/bin/pip" check
          "$RUNNER_TEMP/elb-venv/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/elb-axe"
          "$RUNNER_TEMP/elb-venv/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/elb-venv/bin/python" - <<'PYTHON' > "$RUNNER_TEMP/elb-evidence/sdk.txt"
          from importlib.metadata import version
          assert version('boto3') == '1.42.0' and version('botocore') == '1.41.6'
          assert version('playwright') == '1.62.0'
          print('playwright', version('playwright'))
          print('boto3', version('boto3'), 'botocore', version('botocore'))
          PYTHON
      - name: Check the served OpenAPI documents and historical reference controls
        if: matrix.check == 'sdk'
        run: |
          set -euo pipefail
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/reference-cache"
          python="$RUNNER_TEMP/elb-venv/bin/python"
          "$python" -B -m unittest discover -s test/e2e -p 'test_*openapi*.py'
          "$python" -B -m unittest discover -s test/e2e -p 'test_*reference*.py'
      - name: Exercise ELBv2 regional Cloudscape and Scalar with stock boto3
        if: matrix.check == 'sdk'
        run: |
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export PYTHONDONTWRITEBYTECODE=1
          export AXE_SCRIPT="$RUNNER_TEMP/elb-axe/axe.min.js"
          export SIMULATOR_BINARY_SHA256="$(cut -d ' ' -f 1 "$RUNNER_TEMP/elb-evidence/binary.sha256")"
          chromium=( "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux64/chrome )
          test "${#chromium[@]}" -eq 1 && test -x "${chromium[0]}"
          export CHROMIUM_EXECUTABLE="${chromium[0]}"
          result=0
          unshare --user --map-current-user --net --keep-caps sh -eu -c 'ip link set lo up; exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"' verify sh -eu -c '
            test "$(awk -F: "NR>2 {gsub(/ /, \"\", \$1); print \$1}" /proc/net/dev)" = lo
            test "$(awk "/^CapEff:/{print \$2}" /proc/self/status)" = 0000000000000000
            "$RUNNER_TEMP/elb-venv/bin/python" -B test/e2e/elb_console.py > "$RUNNER_TEMP/elb-console.json"
            "$RUNNER_TEMP/elb-venv/bin/python" -B test/e2e/elb_scalar.py > "$RUNNER_TEMP/elb-scalar.json"
            "$RUNNER_TEMP/elb-venv/bin/python" -B test/e2e/elb.py > "$RUNNER_TEMP/elb-native.json"
          ' > "$RUNNER_TEMP/elb-private.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/elb-evidence/sdk-exit.txt"
          test "$result" -eq 0 || exit "$result"
          jq -e '.console and .scope=="owner+peer" and .sdk and .scalar_sends==1 and .verified_and_ambiguous_writes==2 and .denied_write==1 and .real_listener_statuses==[200,404] and .owner_restart and .english_desktop and .japanese_mobile and .cleanup' "$RUNNER_TEMP/elb-console.json"
          jq -e '.elbNativeSDK and .lambdaTargetDataPlane and .periodicHealthChecks and .twoAuthenticatedProcesses and .actualCLIReopen and .copiedStandaloneWithoutExecutablesOnPath and .participantIAM and .placement.restartVerified and .teardown=="DELETED" and .counts.sends==.counts.responses and .counts.sends==.counts.calls and .counts.sends>0' "$RUNNER_TEMP/elb-native.json"
          jq -e --arg binary "$SIMULATOR_BINARY_SHA256" '.binary==$binary and .stockSDKReadback and .reopened and .peerPreserved and .cleanup and .scalarSends==[["CreateTargetGroup",200],["DescribeLoadBalancers",200],["DescribeTargetHealth",200],["DescribeLoadBalancers",200],["DeleteTargetGroup",403]]' "$RUNNER_TEMP/elb-scalar.json"
          jq '{stockSDKReadback,reopened,peerPreserved,cleanup,scalarSends,binary}' "$RUNNER_TEMP/elb-scalar.json" > "$RUNNER_TEMP/elb-evidence/scalar.json"
          cp "$RUNNER_TEMP/elb-console.json" "$RUNNER_TEMP/elb-evidence/console.json"
          jq '{elbNativeSDK,lambdaTargetDataPlane,periodicHealthChecks,twoAuthenticatedProcesses,actualCLIReopen,participantIAM,teardown,counts}' "$RUNNER_TEMP/elb-native.json" > "$RUNNER_TEMP/elb-evidence/native.json"
          sha256sum --check "$RUNNER_TEMP/elb-evidence/binary.sha256"
      - name: Record test counts and failure locations
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          out = temp / 'elb-evidence'
          out.mkdir(exist_ok=True)
          log = temp / 'elb-private.log'
          body = log.read_text(errors='replace') if log.is_file() else ''
          known = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          found = [(path.removeprefix(str(Path.cwd()) + '/'), int(line)) for path, line in re.findall(r'File "([^"\n]+)", line (\d+)', body)]
          module = 'github.com/susumutomita/TenkaCloudSimulator'
          packages = {module + '/' + str(Path(path).parent) for path in known if path.endswith('.go')}
          go_tests = set()
          for path in known:
              if path.endswith('_test.go'):
                  go_tests.update(re.findall(r'^func (Test[A-Za-z0-9_]+)\(', Path(path).read_text(), re.M))
          failed_packages = sorted(packages.intersection(re.findall(r'^FAIL\s+(\S+)', body, re.M)))
          failed_tests = sorted(go_tests.intersection(re.findall(r'^\s*--- FAIL: (Test[A-Za-z0-9_]+)', body, re.M)))
          terms = ('test timed out', 'no such table', 'race detected', 'permission denied', 'deadline exceeded', 'no space left on device', 'connection reset', 'signal: killed')
          coverage = re.search(r'^Go statements \(full module\): (\d+/\d+ \([\d.]+%; minimum \d+%\))$', body, re.M)
          data = {'go_packages_passed':len(re.findall(r'^ok\s+', body, re.M)), 'coverage':coverage.group(1) if coverage else None,
                  'locations':[{'path':path,'line':line} for path,line in found if path in known],
                  'failed_packages': failed_packages, 'failed_tests': failed_tests,
                  'fixed_diagnostics': [term for term in terms if term in body.lower()]}
          (out / 'checks.json').write_text(json.dumps(data)+'\n')
          PY
          test -z "$(git status --porcelain)"
      - name: Retain scoped verification receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: elb-regional-console-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/elb-evidence
          if-no-files-found: error
          retention-days: 14
