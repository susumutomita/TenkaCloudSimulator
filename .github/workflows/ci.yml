name: PCS bounded association SDK and Console evidence
on: workflow_dispatch
permissions:
  contents: read
jobs:
  associations:
    name: PCS / ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: before-commit
            os: ubuntu-24.04
          - check: sdk-console
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: fbe42537b6cbdb20f7953645033a9bb50556f3ae
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build clean immutable source before writing evidence
        run: |
          test "$(git rev-parse HEAD)" = fbe42537b6cbdb20f7953645033a9bb50556f3ae
          test "$(git rev-parse HEAD^{tree})" = b59cab18d9628ec8c9071dc9e7b310e37d1e306c
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          make build
          mkdir -m 700 "$RUNNER_TEMP/pcs-receipts"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/pcs-receipts/source.txt"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/pcs-receipts/build.txt"
          grep -F 'vcs.revision=fbe42537b6cbdb20f7953645033a9bb50556f3ae' "$RUNNER_TEMP/pcs-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/pcs-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/pcs-receipts/binary.sha256"
      - name: Run the unchanged complete repository gate
        if: matrix.check == 'before-commit'
        run: |
          umask 077
          set +e
          make before-commit > "$RUNNER_TEMP/pcs-private.log" 2>&1
          status=$?
          set -e
          printf '%d\n' "$status" > "$RUNNER_TEMP/pcs-receipts/before-commit.exit"
          exit "$status"
      - name: Install original pinned SDK and actual full Chromium
        if: matrix.check == 'sdk-console'
        run: |
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'
          "$python" -m venv "$RUNNER_TEMP/pcs-python"
          "$RUNNER_TEMP/pcs-python/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/pcs-python/bin/pip" check
          "$RUNNER_TEMP/pcs-python/bin/playwright" install --with-deps chromium
      - name: Run the stock SDK and real Console fixture in isolated numeric loopback
        if: matrix.check == 'sdk-console'
        run: |
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export CHROMIUM_EXECUTABLE=$("$RUNNER_TEMP/pcs-python/bin/python" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          export PYTHONDONTWRITEBYTECODE=1
          set +e
          unshare --user --map-current-user --net --keep-caps sh -eu -c 'ip link set lo up; exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$1" "$2"' pcs "$RUNNER_TEMP/pcs-python/bin/python" "$PWD/test/e2e/pcs_queue_associations.py" > "$RUNNER_TEMP/pcs-private.log" 2>&1
          status=$?
          set -e
          printf '%d\n' "$status" > "$RUNNER_TEMP/pcs-receipts/fixture.exit"
          test -z "$(git status --porcelain)"
          exit "$status"
      - name: Retain safe failure locations from either original command
        if: always()
        run: |
          python3 - <<'PYDIAG'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          log = root / 'pcs-private.log'
          text = log.read_text(errors='replace') if log.exists() else ''
          frames = [{'file': pathlib.Path(name).name, 'line': int(line)}
                    for name, line in re.findall(r'File "([^"\n]+)", line ([0-9]+)', text)]
          kinds = re.findall(r'^([A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception))(?::|$)', text, re.MULTILINE)
          (root / 'pcs-receipts/diagnostics.json').write_text(json.dumps({'frames': frames[-12:], 'exception_types': kinds[-3:]}) + '\n')
          PYDIAG      - name: Keep safe provenance and actual status only
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: pcs-associations-fbe4253-${{ matrix.check }}-${{ github.run_id }}
          path: ${{ runner.temp }}/pcs-receipts
          if-no-files-found: error
          retention-days: 14
