name: Verify the KMS scheduled deletion
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    name: KMS scheduled deletion / ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: before-commit
            os: ubuntu-24.04
          - check: sdk
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: d769a48ad0483766d100c1a25a872cd91fbd3146
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify the immutable source, toolchain and neutral runner
        run: |
          test "$(git rev-parse HEAD)" = d769a48ad0483766d100c1a25a872cd91fbd3146
          test "$(git rev-parse HEAD^{tree})" = 4e8d1f43aa875bbd9a27270205b559100715cadb
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          mkdir -m 700 -p "$RUNNER_TEMP/kms-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/kms-evidence/source.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert not any(key.startswith(('AWS_', 'BOTO_')) for key in os.environ)
          assert not any(os.environ.get(key) for key in ('GOFLAGS', 'MAKEFLAGS', 'GO_TEST_RUN_FILE', 'GO_TEST_PACKAGES'))
          paths = [Path.home() / p for p in ('.aws/config', '.aws/credentials', '.boto')]
          assert not any(path.exists() or path.is_symlink() for path in [*paths, Path('/etc/boto.cfg')])
          PY
      - name: Run the unfiltered standard repository gate
        if: matrix.check == 'before-commit'
        run: |
          umask 077
          set +e
          make before-commit > "$RUNNER_TEMP/kms-private.log" 2>&1
          status=$?
          set -e
          printf '%d\n' "$status" > "$RUNNER_TEMP/kms-evidence/make-exit.txt"
          exit "$status"
      - name: Check both official coverage floors on the complete profile
        if: matrix.check == 'before-commit'
        run: |
          set -euo pipefail
          umask 077
          go run github.com/boumenot/gocover-cobertura@v1.4.0 < reports/coverage.out > "$RUNNER_TEMP/kms-coverage.xml"
          status=0
          python3 scripts/check-coverage.py reports/coverage.out "$RUNNER_TEMP/kms-coverage.xml" || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/kms-evidence/coverage-exit.txt"
          cp "$RUNNER_TEMP/coverage-summary.md" "$RUNNER_TEMP/kms-evidence/coverage-summary.md"
          exit "$status"
      - name: Build the simulator for the SDK
        if: matrix.check == 'sdk'
        run: make build
      - name: Identify the exact binary
        run: |
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/kms-evidence/build.txt"
          grep -F 'vcs.revision=d769a48ad0483766d100c1a25a872cd91fbd3146' "$RUNNER_TEMP/kms-evidence/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/kms-evidence/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/kms-evidence/binary.sha256"
          test "$(cut -d ' ' -f 1 "$RUNNER_TEMP/kms-evidence/binary.sha256")" = a18a39264b4f5fce227cb4237c560a775bcc1f9dbe2c04ce90a37197994daf4b
      - name: Install the pinned SDK
        if: matrix.check == 'sdk'
        run: |
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'
          "$python" -m venv "$RUNNER_TEMP/kms-venv"
          "$RUNNER_TEMP/kms-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/kms-venv/bin/pip" check
          "$RUNNER_TEMP/kms-venv/bin/python" - <<'PYTHON' > "$RUNNER_TEMP/kms-evidence/sdk.txt"
          from importlib.metadata import version
          assert version('boto3') == '1.42.0' and version('botocore') == '1.41.6'
          print('boto3', version('boto3'), 'botocore', version('botocore'))
          PYTHON
      - name: Exercise KMS scheduled deletion with stock boto3
        if: matrix.check == 'sdk'
        run: |
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export PYTHONDONTWRITEBYTECODE=1
          result=0
          unshare --user --map-current-user --net --keep-caps sh -eu -c 'ip link set lo up; exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all sh -eu -c "$1"' sh '
            "$RUNNER_TEMP/kms-venv/bin/python" test/e2e/kms_grants.py --binary "$SIMULATOR_BINARY" --binary-sha256 a18a39264b4f5fce227cb4237c560a775bcc1f9dbe2c04ce90a37197994daf4b
            "$RUNNER_TEMP/kms-venv/bin/python" test/e2e/kms_key_deletion.py --binary "$SIMULATOR_BINARY" --binary-sha256 a18a39264b4f5fce227cb4237c560a775bcc1f9dbe2c04ce90a37197994daf4b
            "$RUNNER_TEMP/kms-venv/bin/python" test/e2e/kms.py
            "$RUNNER_TEMP/kms-venv/bin/python" test/e2e/kms_alias_docs.py
          ' > "$RUNNER_TEMP/kms-private.log" 2>&1 || result=$?
          printf '%s\n' "$result" > "$RUNNER_TEMP/kms-evidence/sdk-exit.txt"
          test "$result" -eq 0 || exit "$result"
          "$RUNNER_TEMP/kms-venv/bin/python" - <<'PYTHON'
          import json, os
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          lines = (temp / 'kms-private.log').read_text().splitlines()
          assert 'KMS grant lifecycle, effective signed role metadata, peer, restart, revocation and cleanup passed' in lines
          assert 'KMS SDK schedule, cancel, crypto, restart, past-due cleanup and isolated peer passed' in lines
          legacy = [json.loads(line) for line in lines if line.startswith('{')]
          assert any(x.get('nativeEightOperations') and x.get('strictServedKMSOperationSet') == 17 for x in legacy)
          assert any(x.get('actualAliasExamples') == 4 and x.get('sameSQLiteNativeCrypto') for x in legacy)
          (temp / 'kms-evidence/fixture-result.json').write_text(json.dumps({'scheduled_deletion': True, 'signed_role_grant': True, 'existing_key_operations': 8, 'existing_alias_examples': 4, 'served_operations': 17, 'network': 'loopback-only'})+'\n')
          PYTHON
          sha256sum --check "$RUNNER_TEMP/kms-evidence/binary.sha256"
      - name: Record test counts and failure locations
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          out = temp / 'kms-evidence'
          out.mkdir(exist_ok=True)
          log = temp / 'kms-private.log'
          body = log.read_text(errors='replace') if log.is_file() else ''
          known = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          found = [(path.removeprefix(str(Path.cwd()) + '/'), int(line)) for path, line in re.findall(r'File "([^"\n]+)", line (\d+)', body)]
          module = 'github.com/susumutomita/TenkaCloudSimulator'
          packages = {module + '/' + str(Path(path).parent) for path in known if path.endswith('.go')}
          go_tests = set()
          for path in known:
              if path.endswith('_test.go'):
                  go_tests.update(re.findall(r'^func (Test[A-Za-z0-9_]+)\(', Path(path).read_text(), re.M))
          failed_packages = sorted(packages.intersection(re.findall(r'^FAIL\s+(\S+)', body, re.M)))
          failed_tests = sorted(go_tests.intersection(re.findall(r'^\s*--- FAIL: (Test[A-Za-z0-9_]+)', body, re.M)))
          terms = ('test timed out', 'no such table', 'race detected', 'permission denied', 'deadline exceeded', 'no space left on device', 'connection reset', 'signal: killed')
          coverage = re.search(r'^Go statements \(full module\): (\d+/\d+ \([\d.]+%; minimum \d+%\))$', body, re.M)
          data = {'go_packages_passed':len(re.findall(r'^ok\s+', body, re.M)), 'coverage':coverage.group(1) if coverage else None,
                  'locations':[{'path':path,'line':line} for path,line in found if path in known],
                  'failed_packages': failed_packages, 'failed_tests': failed_tests,
                  'fixed_diagnostics': [term for term in terms if term in body.lower()]}
          (out / 'checks.json').write_text(json.dumps(data)+'\n')
          PY
          test -z "$(git status --porcelain)"
      - name: Retain scoped verification receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: kms-scheduled-deletion-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kms-evidence
          if-no-files-found: error
          retention-days: 14
