name: CloudFront private local-content verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-and-scalar:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PYTHONPYCACHEPREFIX: /tmp/cloudfront-python-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 5b740845f4b7ffe22d451eeef1382cb43fe77cc4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the clean immutable composed product
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = 5b740845f4b7ffe22d451eeef1382cb43fe77cc4
          test -z "$(git status --porcelain)"
          make build
          mkdir -p "$RUNNER_TEMP/cloudfront-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/cloudfront-receipts/build.txt"
          grep -F 'vcs.revision=5b740845f4b7ffe22d451eeef1382cb43fe77cc4' "$RUNNER_TEMP/cloudfront-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/cloudfront-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/cloudfront-receipts/binary.sha256"
      - name: Install stock pinned SDK and Chromium dependencies
        run: |
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv /tmp/cloudfront-tests
          /tmp/cloudfront-tests/bin/python -m pip install -r scripts/requirements-test.txt
          /tmp/cloudfront-tests/bin/playwright install --with-deps chromium
      - name: Run both unchanged fixtures in nonroot loopback-only isolation
        run: |
          export PATH="/tmp/cloudfront-tests/bin:$PATH"
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_BINARY_SHA256=$(cut -d ' ' -f 1 "$RUNNER_TEMP/cloudfront-receipts/binary.sha256")
          export CHROMIUM_EXECUTABLE=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          for case in sdk scalar; do
            set +e
            if [ "$case" = sdk ]; then
              unshare --user --map-current-user --net --keep-caps sh -eu -c 'ip link set lo up; exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all python test/e2e/cloudfront_local_content.py --binary "$SIMULATOR_BINARY" --binary-sha256 "$SIMULATOR_BINARY_SHA256"' > "$RUNNER_TEMP/cloudfront-$case-private.log" 2>&1
            else
              unshare --user --map-current-user --net --keep-caps sh -eu -c 'ip link set lo up; exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all python test/e2e/cloudfront_local_scalar.py' > "$RUNNER_TEMP/cloudfront-$case-private.log" 2>&1
            fi
            result=$?
            set -e
            echo "$result" > "$RUNNER_TEMP/cloudfront-receipts/$case.exit"
            export CLOUDFRONT_CASE="$case" CLOUDFRONT_EXIT="$result"
            python - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          case, result = os.environ['CLOUDFRONT_CASE'], int(os.environ['CLOUDFRONT_EXIT'])
          text = (root / f'cloudfront-{case}-private.log').read_text(errors='replace')
          receipt = {'sourceSha': '5b740845f4b7ffe22d451eeef1382cb43fe77cc4', 'case': case, 'fixtureExit': result}
          if result == 0:
              records = [json.loads(line) for line in text.splitlines() if line.startswith('{"ok":')]
              expected = ({'ok': True, 'nativeCloudFrontOperations': 8, 'origin': 'saved local S3 bytes',
                           'cacheHitAndInvalidation': True, 'freshHitAuthorization': True, 'peerUnchanged': True,
                           'restart': True, 'cleanup': True, 'externalOriginFetch': False} if case == 'sdk' else
                          {'ok': True, 'binarySha256': os.environ['SIMULATOR_BINARY_SHA256'], 'nativeCloudFrontSends': 2,
                           'simulatorOnlyContentSends': 1, 'freshVisibleDownloadedBytes': True, 'freshHitDenial': True,
                           'peerUnchangedAcrossReopen': True, 'cleanup': True, 'outsideRequests': 0, 'externalOriginFetch': False})
              assert records == [expected]
              receipt['verifiedFixture'] = records[0]
          else:
              receipt['frames'] = [{'file': pathlib.Path(name).name, 'line': int(line)}
                  for name, line in re.findall(r'File "([^"\n]+)", line ([0-9]+)', text)][-12:]
              receipt['exceptionTypes'] = re.findall(r'^([A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception))(?::|$)', text, re.MULTILINE)[-3:]
              receipt['nativeErrors'] = [{'code': code, 'operation': operation} for code, operation in
                  re.findall(r'An error occurred \(([A-Za-z0-9_]{1,80})\) when calling the ([A-Za-z0-9_]{1,80}) operation', text)][-3:]
          (root / 'cloudfront-receipts' / f'{case}.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('CloudFront fixture', case, 'exit', result)
          PY
          done
          test -z "$(git status --porcelain)"
          test "$(cat "$RUNNER_TEMP/cloudfront-receipts/sdk.exit")" -eq 0
          test "$(cat "$RUNNER_TEMP/cloudfront-receipts/scalar.exit")" -eq 0
      - name: Retain only safe immutable source and fixture receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cloudfront-runtime-5b740845f4b7ffe22d451eeef1382cb43fe77cc4
          path: ${{ runner.temp }}/cloudfront-receipts/
          if-no-files-found: error
          retention-days: 7
  whole-standard-gate:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      GOMAXPROCS: '1'
      PYTHONPYCACHEPREFIX: /tmp/cloudfront-gate-python-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 5b740845f4b7ffe22d451eeef1382cb43fe77cc4
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the clean source and install stock pinned test requirements
        run: |
          test "$(id -u)" -ne 0
          test "$(git rev-parse HEAD)" = 5b740845f4b7ffe22d451eeef1382cb43fe77cc4
          test -z "$(git status --porcelain)"
          make build
          mkdir -p "$RUNNER_TEMP/cloudfront-gate-receipts"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/cloudfront-gate-receipts/build.txt"
          grep -F 'vcs.revision=5b740845f4b7ffe22d451eeef1382cb43fe77cc4' "$RUNNER_TEMP/cloudfront-gate-receipts/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/cloudfront-gate-receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/cloudfront-gate-receipts/binary.sha256"
          "$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12" -m venv /tmp/cloudfront-gate-tests
          /tmp/cloudfront-gate-tests/bin/python -m pip install -r scripts/requirements-test.txt
      - name: Run the complete standard gate without test selection or skips
        run: |
          export PATH="/tmp/cloudfront-gate-tests/bin:$PATH"
          export SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
          test -r "$SSL_CERT_FILE"
          python -c 'import ssl; context = ssl.create_default_context(); assert context.get_ca_certs(); assert context.verify_mode == ssl.CERT_REQUIRED and context.check_hostname'
          set +e
          make before-commit > "$RUNNER_TEMP/cloudfront-whole-private.log" 2>&1
          result=$?
          set -e
          export CLOUDFRONT_GATE_EXIT="$result"
          python - <<'PY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          text = (root / 'cloudfront-whole-private.log').read_text(errors='replace')
          receipt = {'sourceSha': '5b740845f4b7ffe22d451eeef1382cb43fe77cc4', 'command': 'make before-commit',
                     'exit': int(os.environ['CLOUDFRONT_GATE_EXIT']),
                     'packages': re.findall(r'^(?:ok|FAIL)\s+(github\.com/susumutomita/TenkaCloudSimulator/[A-Za-z0-9_/.-]+)', text, re.MULTILINE),
                     'failedTests': re.findall(r'^--- FAIL: (Test[A-Za-z0-9_]+)', text, re.MULTILINE),
                     'coverage': re.findall(r'^.*?(?:coverage|Coverage)[^\n]*?([0-9]+(?:\.[0-9]+)?%)', text, re.MULTILINE)}
          receipt['failedMakeTargets'] = [{'line': int(line), 'target': target} for line, target in
              re.findall(r'^make(?:\[[0-9]+\])?: \*\*\* \[Makefile:([0-9]+): ([A-Za-z0-9_-]+)\]', text, re.MULTILINE)]
          receipt['frames'] = [{'file': pathlib.Path(name).name, 'line': int(line)}
              for name, line in re.findall(r'File "([^"\n]+)", line ([0-9]+)', text)][-12:]
          receipt['exceptionTypes'] = re.findall(r'^([A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception))(?::|$)', text, re.MULTILINE)[-3:]
          receipt['goLocations'] = [{'file': pathlib.Path(name).name, 'line': int(line)} for name, line in
              re.findall(r'^([A-Za-z0-9_/.-]+\.go):([0-9]+):', text, re.MULTILINE)][-12:]
          (root / 'cloudfront-gate-receipts' / 'whole.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print('Complete CloudFront private gate exit:', receipt['exit'])
          PY
          test -z "$(git status --porcelain)"
          test "$result" -eq 0
      - name: Retain safe whole-gate status and exact build identity
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cloudfront-whole-5b740845f4b7ffe22d451eeef1382cb43fe77cc4
          path: ${{ runner.temp }}/cloudfront-gate-receipts/
          if-no-files-found: error
          retention-days: 7
