name: Verify native CodeCommit Git history
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 591298e6889ff15f85df789516a570eb6da25c1e
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
      - name: Build the exact product and install pinned clients
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 591298e6889ff15f85df789516a570eb6da25c1e
          test "$(git rev-parse 'HEAD^{tree}')" = 6f4a278d09a4d256ca937beb08affe0d11ac6e1f
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          mkdir "$RUNNER_TEMP/proof"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/proof/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/proof/build.txt"
          grep -F 'vcs.revision=591298e6889ff15f85df789516a570eb6da25c1e' "$RUNNER_TEMP/proof/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/proof/binary.sha256"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements-test.txt
      - name: Use Git and the stock SDK with two real, isolated simulator processes
        run: |
          set -euo pipefail
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          python="$RUNNER_TEMP/venv/bin/python"
          "$python" -IB -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_","BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in [Path.home()/".aws",Path.home()/".boto","/etc/boto.cfg"])'
          export ORIGINAL_UID="$(id -u)" ORIGINAL_NET="$(stat -Lc %i /proc/self/ns/net)" ORIGINAL_USER="$(stat -Lc %i /proc/self/ns/user)"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' neutral sh -ec '
            set -x
            test "$(id -u)" = "$ORIGINAL_UID"
            test "$(id -u)" -ne 0
            test "$(stat -Lc %i /proc/self/ns/net)" != "$ORIGINAL_NET"
            test "$(stat -Lc %i /proc/self/ns/user)" != "$ORIGINAL_USER"
            "$1" -IB -c "import socket; assert [name for _,name in socket.if_nameindex()] == [\"lo\"]"
            grep -Eq "^CapEff:[[:space:]]*0+$" /proc/self/status
            grep -Eq "^CapBnd:[[:space:]]*0+$" /proc/self/status
            "$1" -B -c "import boto3,botocore; assert (boto3.__version__,botocore.__version__) == (\"1.42.0\",\"1.41.6\")"
            "$1" -B test/e2e/aws_catalog_fixtures.py codecommit > "$RUNNER_TEMP/proof/catalog.txt"
            "$1" -B test/e2e/codecommit_git.py > "$RUNNER_TEMP/proof/git.json"
            git --version > "$RUNNER_TEMP/proof/git-version.txt"
          ' fixture "$python"
          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codecommit-git-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/
          retention-days: 14
  before-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRODUCT: 591298e6889ff15f85df789516a570eb6da25c1e
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 591298e6889ff15f85df789516a570eb6da25c1e
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify clean source and run the repository gate
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/207-group-console
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = 6f4a278d09a4d256ca937beb08affe0d11ac6e1f
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          mkdir "$RUNNER_TEMP/receipts"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 scripts/check-formal-applicability.py check --base fd803075c37af3faa377f550c8e1cd52b3cfbbb1
          umask 077
          test -z "${GOFLAGS:-}${MAKEFLAGS:-}${GO_TEST_RUN_FILE:-}${GO_TEST_PACKAGES:-}"
          status=0
          make before-commit > "$RUNNER_TEMP/private-before-commit.log" 2>&1 || status=$?
          printf '%d\n' "$status" > "$RUNNER_TEMP/receipts/make-exit.txt"
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          lines = (root / "private-before-commit.log").read_text(errors="replace").splitlines()
          packages = [m.group(1) for line in lines if (m := re.match(r"^ok\s+(github\.com/susumutomita/TenkaCloudSimulator/[^\s]+)\s", line))]
          failed = [m.group(1) for line in lines if (m := re.match(r"^\s*--- FAIL: ([a-zA-Z0-9_/]+)", line))]
          (root / "receipts/native-cases.txt").write_text("\n".join(sorted(set(packages + failed))) + "\n")
          PYTHON
          test "$status" -eq 0
          go run github.com/boumenot/gocover-cobertura@v1.4.0 < reports/coverage.out > "$RUNNER_TEMP/coverage.xml"
          status=0
          python3 scripts/check-coverage.py reports/coverage.out "$RUNNER_TEMP/coverage.xml" || status=$?
          printf '%d\n' "$status" > "$RUNNER_TEMP/receipts/coverage-exit.txt"
          cp "$RUNNER_TEMP/coverage-summary.md" "$RUNNER_TEMP/receipts/coverage-summary.md"
          test "$status" -eq 0
          test -z "$(git status --porcelain)"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/binary.sha256"
      - name: Retain native gate results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: codecommit-git-standard-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
          retention-days: 14
