name: Verify CodeCommit repository contents across clients
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 67b4c1c277a2774f808e103b8af43b7e6a7446e5
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
      - name: Build the exact product and install pinned clients
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 67b4c1c277a2774f808e103b8af43b7e6a7446e5
          test "$(git rev-parse 'HEAD^{tree}')" = fc5be02a48ac5487a95f742b0f10706cbe60589d
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          make build
          echo "94bb7a2d8c726b511521d3356002013d79c8e59a79a8c3a8284a812a03c4f6d7  dist/tenkacloud-simulator" | sha256sum --check
          mkdir "$RUNNER_TEMP/proof"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/proof/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/proof/build.txt"
          grep -F 'vcs.revision=67b4c1c277a2774f808e103b8af43b7e6a7446e5' "$RUNNER_TEMP/proof/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/proof/binary.sha256"
          echo "d40e46a4f5ec99f7365d27e0961f9ca13a859a170f894782c9ff816aade8ae76  test/e2e/codecommit_console.py" | sha256sum --check
          echo "59152efaa47a3dc0672620b7f6421f1391d3675d90522c6aaf0d502fcef16f3b  test/e2e/codecommit_git.py" | sha256sum --check
          echo "dc82101603f6a1bfc565ab56275f1a1be38efe5038a18eb193349098b8d68253  test/e2e/aws_catalog_fixtures.py" | sha256sum --check
          echo "c472771465eaadecfc060be690e20232a3cd5f0d139095989213f0cba70f6a44  test/e2e/catalog_fixtures/codecommit.json" | sha256sum --check
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/venv/bin/pip" check
          "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/venv/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/axe"
      - name: Use stock SDK, Git, Console and Scalar in private loopback
        run: |
          set -euo pipefail
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export AXE_SCRIPT="$RUNNER_TEMP/axe/axe.min.js"
          chromium=( "$HOME"/.cache/ms-playwright/chromium-*/chrome-linux64/chrome )
          test "${#chromium[@]}" -eq 1
          test -x "${chromium[0]}"
          export CHROMIUM_EXECUTABLE="${chromium[0]}"
          python="$RUNNER_TEMP/venv/bin/python"
          "$python" -IB -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_","BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in [Path.home()/".aws",Path.home()/".boto","/etc/boto.cfg"])'
          export ORIGINAL_UID="$(id -u)" ORIGINAL_NET="$(stat -Lc %i /proc/self/ns/net)" ORIGINAL_USER="$(stat -Lc %i /proc/self/ns/user)"
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' neutral sh -ec '
            set -x
            test "$(id -u)" = "$ORIGINAL_UID"
            test "$(id -u)" -ne 0
            test "$(stat -Lc %i /proc/self/ns/net)" != "$ORIGINAL_NET"
            test "$(stat -Lc %i /proc/self/ns/user)" != "$ORIGINAL_USER"
            "$1" -IB -c "import socket; assert [name for _,name in socket.if_nameindex()] == [\"lo\"]"
            grep -Eq "^CapEff:[[:space:]]*0+$" /proc/self/status
            grep -Eq "^CapBnd:[[:space:]]*0+$" /proc/self/status
            "$1" -B -c "import boto3,botocore; assert (boto3.__version__,botocore.__version__) == (\"1.42.0\",\"1.41.6\")"
            "$1" -B test/e2e/aws_catalog_fixtures.py codecommit > "$RUNNER_TEMP/proof/catalog.txt"
            "$1" -B test/e2e/codecommit_git.py > "$RUNNER_TEMP/proof/git.json"
            "$1" -B test/e2e/codecommit_console.py --sdk > "$RUNNER_TEMP/proof/console.json"
            git --version > "$RUNNER_TEMP/proof/git-version.txt"
          ' fixture "$python"
          jq -e '.stockSDK and .signed==.sdkResponses and .signed>25 and (.audits|length)==4 and .scalar==["GetFile","PutFile"] and .reopenedDatabases==2 and .lostAcknowledgements==1 and .largestFileBytes==65536 and .staleReadStatuses==[200,403] and .replacedRepositoryWriteSends==0 and .preSendLossCheckedAgainstMissingFile and .cleanup' "$RUNNER_TEMP/proof/console.json"
          sha256sum --check "$RUNNER_TEMP/proof/binary.sha256"

          test -z "$(git status --porcelain)"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: codecommit-contents-${{ github.run_id }}
          path: ${{ runner.temp }}/proof/
          retention-days: 14
