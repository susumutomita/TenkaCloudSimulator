name: Verify the SSM document version Scalar fixture
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    name: SSM document versions / ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: before-commit
            os: ubuntu-24.04
          - check: sdk-scalar
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: e8edb0210ed4e897a70d1401a4327aed43844508
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify the immutable source, toolchain and neutral runner
        run: |
          test "$(git rev-parse HEAD)" = e8edb0210ed4e897a70d1401a4327aed43844508
          test "$(git rev-parse HEAD^{tree})" = def5dfbe5205d81df94e5fc92ee9ca47f41f5abc
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          mkdir -m 700 -p "$RUNNER_TEMP/ssm-evidence"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/ssm-evidence/source.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          assert not any(key.startswith(('AWS_', 'BOTO_')) for key in os.environ)
          assert not any(os.environ.get(key) for key in ('GOFLAGS', 'MAKEFLAGS', 'GO_TEST_RUN_FILE', 'GO_TEST_PACKAGES'))
          paths = [Path.home() / p for p in ('.aws/config', '.aws/credentials', '.boto')]
          assert not any(path.exists() or path.is_symlink() for path in [*paths, Path('/etc/boto.cfg')])
          PY
      - name: Run the unfiltered standard repository gate
        if: matrix.check == 'before-commit'
        run: |
          umask 077
          set +e
          make before-commit > "$RUNNER_TEMP/ssm-private.log" 2>&1
          status=$?
          set -e
          printf '%d\n' "$status" > "$RUNNER_TEMP/ssm-evidence/make-exit.txt"
          exit "$status"
      - name: Build the simulator for the SDK and browser
        if: matrix.check == 'sdk-scalar'
        run: make build
      - name: Identify the exact binary
        run: |
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/ssm-evidence/build.txt"
          grep -F 'vcs.revision=e8edb0210ed4e897a70d1401a4327aed43844508' "$RUNNER_TEMP/ssm-evidence/build.txt"
          grep -F 'vcs.modified=false' "$RUNNER_TEMP/ssm-evidence/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/ssm-evidence/binary.sha256"
          test "$(cut -d ' ' -f 1 "$RUNNER_TEMP/ssm-evidence/binary.sha256")" = 7aefbd808a08fbf718ea500497a88e2e6e16d746c7f51e1ba9d574e3aa607358
      - name: Install the pinned SDK and Chromium
        if: matrix.check == 'sdk-scalar'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/ssm-browser
        run: |
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -c 'import sys; assert sys.version_info[:3] == (3, 12, 16)'
          "$python" -m venv "$RUNNER_TEMP/ssm-venv"
          "$RUNNER_TEMP/ssm-venv/bin/pip" install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/ssm-venv/bin/pip" check
          "$RUNNER_TEMP/ssm-venv/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/ssm-venv/bin/python" - <<'PY'
          import json, os
          from importlib.metadata import version
          from pathlib import Path
          import playwright
          from playwright.sync_api import sync_playwright
          assert version('boto3') == '1.42.0' and version('playwright') == '1.62.0'
          pins = json.loads((Path(playwright.__file__).parent / 'driver/package/browsers.json').read_bytes())
          pin = next(b for b in pins['browsers'] if b['name'] == 'chromium')
          assert (pin['revision'], pin['browserVersion']) == ('1234', '151.0.7922.34')
          with sync_playwright() as driver:
              executable = Path(driver.chromium.executable_path).resolve(strict=True)
          assert executable.is_relative_to(Path(os.environ['PLAYWRIGHT_BROWSERS_PATH']) / 'chromium-1234')
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'ssm-chromium').write_text(str(executable))
          (temp / 'ssm-evidence/tools.json').write_text(json.dumps({'boto3': version('boto3'), 'playwright': version('playwright'), 'chromium': pin['browserVersion']})+'\n')
          PY
      - name: Run the checked-in two-version SDK and Scalar case
        if: matrix.check == 'sdk-scalar'
        run: |
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_REPORTS="$RUNNER_TEMP/ssm-reports"
          export CHROMIUM_EXECUTABLE="$(cat "$RUNNER_TEMP/ssm-chromium")"
          export PYTHONDONTWRITEBYTECODE=1
          set +e
          "$RUNNER_TEMP/ssm-venv/bin/python" test/e2e/check.py Conformance.test_ssm_document_versions_scalar_and_sdk > "$RUNNER_TEMP/ssm-private.log" 2>&1
          status=$?
          set -e
          printf '%d\n' "$status" > "$RUNNER_TEMP/ssm-evidence/sdk-scalar-exit.txt"
          exit "$status"
      - name: Record test counts and failure locations
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          out = temp / 'ssm-evidence'
          out.mkdir(exist_ok=True)
          log = temp / 'ssm-private.log'
          body = log.read_text(errors='replace') if log.is_file() else ''
          known = set(subprocess.check_output(['git', 'ls-files'], text=True).splitlines())
          found = [(path.removeprefix(str(Path.cwd()) + '/'), int(line)) for path, line in re.findall(r'File "([^"\n]+)", line (\d+)', body)]
          coverage = re.search(r'^Go statements \(full module\): (\d+/\d+ \([\d.]+%; minimum \d+%\))$', body, re.M)
          data = {'go_packages_passed':len(re.findall(r'^ok\s+', body, re.M)), 'coverage':coverage.group(1) if coverage else None,
                  'scalar_case_passed':bool(re.search(r'Ran 1 test in [\d.]+s\s+OK\s*$', body)),
                  'locations':[{'path':path,'line':line} for path,line in found if path in known]}
          (out / 'checks.json').write_text(json.dumps(data)+'\n')
          PY
          test -z "$(git status --porcelain)"
      - name: Retain scoped verification receipts
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ssm-document-versions-${{ matrix.check }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ssm-evidence
          if-no-files-found: error
          retention-days: 14
