name: Verify Resource Groups service IAM, SDK, console and standard gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      PRODUCT: 4a095d881de1b02219e95398bca2da7b33df68f0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4a095d881de1b02219e95398bca2da7b33df68f0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build clean pinned simulator and install repository SDK pins
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/207-4a095d8-integrated-clients
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = 3a7a7f4896161c911b6505579e98af45fe543e74
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          umask 077
          mkdir "$RUNNER_TEMP/receipts"
          make build
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/receipts/build.txt"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test "$("$python" --version)" = "Python 3.12.16"
          "$python" -m venv "$RUNNER_TEMP/client-tools"
          "$RUNNER_TEMP/client-tools/bin/python" -m pip install -r scripts/requirements-test.txt awscli==1.43.6
      - name: Run checked-in SDK fixtures on isolated numeric loopback
        run: |
          set -euo pipefail
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          python="$RUNNER_TEMP/client-tools/bin/python"
          "$python" -I -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in (Path.home()/".aws", Path.home()/".boto", "/etc/boto.cfg"))'
          cat > "$RUNNER_TEMP/cli_members.py" <<'PY'
          import contextlib
          import io
          import json
          import sys
          import tempfile
          from importlib.metadata import version
          from pathlib import Path
          from urllib.parse import urlsplit

          from awscli.clidriver import create_clidriver

          sys.path.insert(0, str(Path.cwd() / 'test/e2e'))
          from aws_catalog import Team

          assert version('awscli') == '1.43.6' and version('botocore') == '1.41.6'
          with tempfile.TemporaryDirectory(prefix='group-cli-') as directory:
              team = Team(directory)
              try:
                  team.start()
                  driver = create_clidriver()
                  driver.session.set_credentials('TCSIMCLIFIXTURE', 'dummy-local-only')

                  def local(request, **kwargs):
                      origin = urlsplit(request.url)
                      assert origin.scheme == 'http' and origin.netloc == f'127.0.0.1:{team.port}'

                  def authorize(request, **kwargs):
                      local(request)
                      request.headers.add_header('X-Simulator-Token', team.token)

                  driver.session.register('before-sign.*.*', authorize)
                  driver.session.register('before-send.*.*', local)

                  def cli(service, op, *args):
                      stdout, stderr = io.StringIO(), io.StringIO()
                      with contextlib.redirect_stdout(stdout), contextlib.redirect_stderr(stderr):
                          code = driver.main(['--endpoint-url', team.endpoint, '--region', 'us-east-1', '--output', 'json',
                                              '--no-paginate', service, op, *args])
                      assert code == 0, f'{service} {op} failed'
                      data = stdout.getvalue()
                      return json.loads(data) if data.strip() else {}

                  definition = {'Type': 'TAG_FILTERS_1_0', 'Query': json.dumps({
                      'ResourceTypeFilters': ['AWS::ECR::Repository'], 'TagFilters': [{'Key': 'Team', 'Values': ['blue']}]})}
                  group = cli('resource-groups', 'create-group', '--name', 'cli-group', '--resource-query', json.dumps(definition))['Group']['GroupArn']
                  arn = cli('ecr', 'create-repository', '--repository-name', 'cli-repo')['repository']['repositoryArn']
                  def members():
                      rep = cli('resource-groups', 'list-group-resources', '--group', group)
                      ids = rep['ResourceIdentifiers']
                      assert rep['Resources'] == [{'Identifier': item} for item in ids]
                      return [item['ResourceArn'] for item in ids]
                  assert members() == []
                  cli('ecr', 'tag-resource', '--resource-arn', arn, '--tags', 'Key=Team,Value=blue')
                  assert members() == [arn]
                  cli('ecr', 'untag-resource', '--resource-arn', arn, '--tag-keys', 'Team')
                  assert members() == []
                  cli('ecr', 'tag-resource', '--resource-arn', arn, '--tags', 'Key=Team,Value=blue')
                  assert members() == [arn]
                  cli('ecr', 'delete-repository', '--repository-name', 'cli-repo')
                  assert members() == []
                  cli('resource-groups', 'delete-group', '--group', group)
                  assert not cli('resource-groups', 'list-groups')['Groups']
                  assert not cli('ecr', 'describe-repositories')['repositories']
              finally:
                  if team.process is not None:
                      team.stop()
          PY
          cat > "$RUNNER_TEMP/measure.py" <<'PY'
          import hashlib, json, os, re, socket, subprocess, sys, time
          from pathlib import Path
          from importlib.metadata import version
          tests = Path.cwd() / 'test/e2e'
          sys.path.insert(0, str(tests))
          import run_s3_multipart_paging as guard
          uid, net, user = map(int, sys.argv[1:])
          status = Path('/proc/self/status').read_text()
          guard.validate_inside_context(uid, net, user, uid=os.getuid(), euid=os.geteuid(), net=guard.namespace_inode('net'), user=guard.namespace_inode('user'), status=status, interfaces=[n for _, n in socket.if_nameindex()], lo_up=guard.loopback_up())
          assert next(r.split()[1] for r in status.splitlines() if r.startswith('CapBnd:')) == '0000000000000000'
          assert (version('boto3'), version('botocore')) == ('1.42.0', '1.41.6')
          def digest(path):
              with path.open('rb') as stream: return hashlib.file_digest(stream, 'sha256').hexdigest()
          binary = Path(os.environ['SIMULATOR_BINARY'])
          initial = digest(binary)
          assert initial == "0d4520f28230b4db06f466cf39b3bec66404997c42cebf0dd00593000d4719f2"
          assert digest(tests/"catalog_fixtures/resource-groups.json") == "365b357be8f765365368ee8564617669e1cf4a002ce85f40b5794cfe90d2233a"
          assert digest(tests/"resource_group_ecr_members.py") == "7d5c6ae694f97226871f6b1b91bd4281cbb65edf36bdb23e9df8a29087bf3f4b"
          receipt = {'sha': os.environ['PRODUCT'], 'binarySha256': initial, 'sdk': [version('boto3'), version('botocore')], 'cli': version('awscli'), 'isolation': 'nonroot private user/net, only lo, zero capabilities', 'cases': []}
          path = Path(os.environ['RUNNER_TEMP']) / 'receipts/receipt.json'
          for source, args in [('aws_catalog_fixtures.py', ['resource-groups']), ('resource_group_ecr_members.py', []), ('cli_members.py', [])]:
              start = time.monotonic()
              fixture = Path(os.environ['RUNNER_TEMP']) / source if source == 'cli_members.py' else tests/source
              proc = subprocess.run([sys.executable, '-B', str(fixture), *args], capture_output=True, timeout=150)
              case = {'source': source, 'fixtureSha256': digest(fixture), 'args': args, 'exit': proc.returncode, 'seconds': round(time.monotonic()-start, 2)}
              if proc.returncode:
                  frames = re.findall(rb'File "[^"\n]*/[a-z_]+\.py", line (\d+), in ([a-zA-Z_][a-zA-Z_0-9]{0,49}|<module>)', proc.stderr)
                  case['frames'] = [[int(n), f.decode()] for n, f in frames[-4:]]
                  classes = re.findall(rb'^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):', proc.stderr, re.M)
                  case['exception'] = classes[-1].decode() if classes else 'unclassified'
              receipt['cases'].append(case)
              path.write_text(json.dumps(receipt, indent=2)+'\n')
              print(source, proc.returncode, flush=True)
          assert all(c['exit'] == 0 for c in receipt['cases']) and digest(binary) == initial
          PY
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' groups "$python" -IB "$RUNNER_TEMP/measure.py" "$(id -u)" "$(stat -Lc %i /proc/self/ns/net)" "$(stat -Lc %i /proc/self/ns/user)"
      - name: Retain pinned build and sanitized SDK results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: resource-group-clients-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
          retention-days: 14
  group-console:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PRODUCT: 4a095d881de1b02219e95398bca2da7b33df68f0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4a095d881de1b02219e95398bca2da7b33df68f0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build the fixed product and provision its pinned clients and sandboxed Chromium
        run: |
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/207-4a095d8-integrated-clients
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = 3a7a7f4896161c911b6505579e98af45fe543e74
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          umask 077
          mkdir "$RUNNER_TEMP/group-receipts" "$RUNNER_TEMP/group-private"
          make build
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/group-receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/group-receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/group-receipts/build.txt"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test "$("$python" --version)" = "Python 3.12.16"
          "$python" -m venv "$RUNNER_TEMP/group-tools"
          "$RUNNER_TEMP/group-tools/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/group-tools/bin/playwright" install --with-deps chromium
      - name: Verify the checked-in browser and SDK fixture in a loopback-only network namespace
        run: |
          set -euo pipefail
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          export SIMULATOR_BINARY_SHA256=0d4520f28230b4db06f466cf39b3bec66404997c42cebf0dd00593000d4719f2
          python="$RUNNER_TEMP/group-tools/bin/python"
          "$python" -I -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_","BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in (Path.home()/".aws",Path.home()/".boto","/etc/boto.cfg"))'
          cat > "$RUNNER_TEMP/group-private/verify.py" <<'PYTHON'
          import hashlib, json, os, socket, subprocess, sys
          from pathlib import Path
          from importlib.metadata import version
          tests = Path.cwd() / "test/e2e"
          sys.path.insert(0, str(tests))
          import run_s3_multipart_paging as guard
          uid, net, user = map(int, sys.argv[1:])
          status = Path("/proc/self/status").read_text()
          guard.validate_inside_context(uid, net, user, uid=os.getuid(), euid=os.geteuid(), net=guard.namespace_inode("net"),
                                        user=guard.namespace_inode("user"), status=status,
                                        interfaces=[name for _, name in socket.if_nameindex()], lo_up=guard.loopback_up())
          assert next(line.split()[1] for line in status.splitlines() if line.startswith("CapBnd:")) == "0000000000000000"
          versions = {name: version(name) for name in ("boto3","botocore","playwright")}
          assert list(versions.values()) == ["1.42.0","1.41.6","1.62.0"]
          binary = Path(os.environ["SIMULATOR_BINARY"])
          fixture = tests / "resource_group_query_console.py"
          scalar = tests / "resource_groups_scalar.py"
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              os.environ["CHROMIUM_EXECUTABLE"] = p.chromium.executable_path
          def digest(path):
              with path.open("rb") as source:
                  return hashlib.file_digest(source, "sha256").hexdigest()
          assert digest(binary) == os.environ["SIMULATOR_BINARY_SHA256"]
          assert digest(fixture) == "13d60bb1f19a09313560d16a4ad4e9bfdf9bfe513c975ca711954c8dee0d40b9"
          assert digest(scalar) == "514c5e0303a3e8e3a456611ce7be55b285c2d395f971b6ddf95d6ee72ed28a22"
          result = subprocess.run([sys.executable, "-B", str(fixture), "--with-sdk"], capture_output=True, timeout=180)
          assert digest(binary) == os.environ["SIMULATOR_BINARY_SHA256"]
          sends = subprocess.run([sys.executable, "-B", str(scalar)], capture_output=True, timeout=180)
          assert digest(binary) == os.environ["SIMULATOR_BINARY_SHA256"]
          evidence = {"scalarFixtureSha256":digest(scalar),"scalarExit":sends.returncode,"source":os.environ["PRODUCT"],"fixtureSha256":digest(fixture),"clients":versions,"exit":result.returncode}
          if result.returncode == 0:
              measured = json.loads(result.stdout)
              assert measured == {"resourceGroupConsole":True,"binarySha256":digest(binary),"widths":[1440,390],"nativePages":2,
                                  "sameGroupScalarSends":2,"deniedContinuation":403,"updatedThenEmpty":True,"regionChangeDuringRead":True,
                                  "lostUpdateReconciled":True,"reopened":True,"teamsClean":2,"outsideRequests":0,"sdkSharedState":True}
              evidence["result"] = measured
          if sends.returncode == 0:
              measured = json.loads(sends.stdout)
              assert measured == {"ok":True,"binarySha256":digest(binary),"scalarSends":6,"tagChangesVisible":True,
                                  "partialPermissionDenied":True,"peerUnchangedAcrossReopen":True,"cleanup":True,"outsideRequests":0}
              evidence["scalar"] = measured
          (Path(os.environ["RUNNER_TEMP"])/"group-receipts/result.json").write_text(json.dumps(evidence,indent=2)+"\n")
          assert result.returncode == 0 and sends.returncode == 0, "group browser/SDK/Scalar failed; raw output withheld"
          PYTHON
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' group "$python" -IB "$RUNNER_TEMP/group-private/verify.py" "$(id -u)" "$(stat -Lc %i /proc/self/ns/net)" "$(stat -Lc %i /proc/self/ns/user)"
      - name: Retain clean executable identity and sanitized application results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: group-console-sdk-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/group-receipts/
          if-no-files-found: error
          retention-days: 14
  before-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRODUCT: 4a095d881de1b02219e95398bca2da7b33df68f0
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 4a095d881de1b02219e95398bca2da7b33df68f0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify clean source and run the repository gate
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/207-4a095d8-integrated-clients
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = 3a7a7f4896161c911b6505579e98af45fe543e74
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          mkdir "$RUNNER_TEMP/receipts"
          PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 scripts/check-formal-applicability.py check --base ffd2258ec28391a3607e06ecd5aaec3152b9a542
          umask 077
          test -z "${GOFLAGS:-}${MAKEFLAGS:-}${GO_TEST_RUN_FILE:-}${GO_TEST_PACKAGES:-}"
          status=0
          make before-commit > "$RUNNER_TEMP/private-before-commit.log" 2>&1 || status=$?
          printf '%d\n' "$status" > "$RUNNER_TEMP/receipts/make-exit.txt"
          python3 - <<'PYTHON'
          import os, re
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          lines = (root / "private-before-commit.log").read_text(errors="replace").splitlines()
          packages = [m.group(1) for line in lines if (m := re.match(r"^ok\s+(github\.com/susumutomita/TenkaCloudSimulator/[^\s]+)\s", line))]
          failed = [m.group(1) for line in lines if (m := re.match(r"^\s*--- FAIL: ([a-zA-Z0-9_/]+)", line))]
          (root / "receipts/native-cases.txt").write_text("\n".join(sorted(set(packages + failed))) + "\n")
          PYTHON
          test "$status" -eq 0
          go run github.com/boumenot/gocover-cobertura@v1.4.0 < reports/coverage.out > "$RUNNER_TEMP/coverage.xml"
          status=0
          python3 scripts/check-coverage.py reports/coverage.out "$RUNNER_TEMP/coverage.xml" || status=$?
          printf '%d\n' "$status" > "$RUNNER_TEMP/receipts/coverage-exit.txt"
          cp "$RUNNER_TEMP/coverage-summary.md" "$RUNNER_TEMP/receipts/coverage-summary.md"
          test "$status" -eq 0
          test -z "$(git status --porcelain)"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/receipts/build.txt"
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/binary.sha256"
      - name: Retain native gate results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: group-console-standard-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
          retention-days: 14
