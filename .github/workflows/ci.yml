name: Verify local SES domain ownership with the stock SDK
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 0348d2ff1eb2bebdc6e20b307b3d099b106380a3
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Verify pinned source and compile the standalone simulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/98-0348d2f-domain-proof
          test "$(git rev-parse HEAD)" = 0348d2ff1eb2bebdc6e20b307b3d099b106380a3
          test "$(git rev-parse 'HEAD^{tree}')" = c2c054e2558e17b572529a873c868f4cac008faa
          test -z "$(git status --porcelain)"
          printf '%s\n' '572f8b4a4b07ae4f03227d5f8573b9f53868f39dd6159fc89b062288acedfefb  test/e2e/ses_domain_identity.py' '7d75ef091a0cd15844fde21f51fc938f168a8f9e9d89f7e80467920fc12ce80c  test/e2e/sts_session_lifecycle.py' | sha256sum -c -
          make build
          mkdir -m 700 "$RUNNER_TEMP/ses-proof"
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/ses-proof/build.txt"
          grep -Fx $'\tbuild\tvcs.modified=false' "$RUNNER_TEMP/ses-proof/build.txt"
          grep -Fx $'\tbuild\tvcs.revision=0348d2ff1eb2bebdc6e20b307b3d099b106380a3' "$RUNNER_TEMP/ses-proof/build.txt"
          printf '%s\n' '93b10f1c666b0b7a606f1e52119daa904382ed8bdca5a73f1cdadc9c566c660c  dist/tenkacloud-simulator' | sha256sum -c -
          sha256sum dist/tenkacloud-simulator > "$RUNNER_TEMP/ses-proof/binary.sha256"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          "$python" -m venv "$RUNNER_TEMP/ses-tools"
          "$RUNNER_TEMP/ses-tools/bin/python" -m pip install -r scripts/requirements-test.txt
      - name: Run the genuine SES and Route 53 clients on private loopback
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python="$RUNNER_TEMP/ses-tools/bin/python"
          "$python" -I -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in (Path.home()/".aws", Path.home()/".boto", "/etc/boto.cfg"))'
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' ses-proof "$python" -B -c '
          import os, socket, sys, subprocess, re
          from pathlib import Path
          uid, oldnet, olduser = map(int, sys.argv[1:])
          status = Path("/proc/self/status").read_text()
          assert uid>0 and os.getuid()==uid and os.stat("/proc/self/ns/net").st_ino!=oldnet and os.stat("/proc/self/ns/user").st_ino!=olduser
          for kind in ("CapEff", "CapPrm", "CapBnd"): assert int(re.search(r"^"+kind+r":\s*([a-fA-F0-9]+)$", status, re.M)[1],16)==0
          assert socket.if_nameindex()==[(1,"lo")]
          cmd=[sys.executable,"-B","test/e2e/ses_domain_identity.py","--binary",str(Path("dist/tenkacloud-simulator").resolve()),"--binary-sha256","93b10f1c666b0b7a606f1e52119daa904382ed8bdca5a73f1cdadc9c566c660c"]
          r=subprocess.run(cmd,capture_output=True,text=True,timeout=120)
          if r.returncode:
              print("fixture frames",re.findall(r'\''File "[^"\n]*/([a-z_]+\.py)", line (\d+), in ([a-zA-Z_][\w]*|<module>)'\'',r.stderr)[-6:])
              sys.exit(r.returncode)
          receipt=r.stdout.strip()
          assert re.fullmatch(r"SESv2/Route53 stock SDK passed [1-9][0-9]+ signed requests and responses; two teams, restart, cleanup",receipt)
          Path(os.environ["RUNNER_TEMP"],"ses-proof","receipt.txt").write_text(receipt+"\nPrivate user and network namespace, loopback only, dropped capabilities.\n")
          print(receipt)
          ' "$(id -u)" "$(stat -Lc %i /proc/self/ns/net)" "$(stat -Lc %i /proc/self/ns/user)"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ses-domain-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ses-proof
          if-no-files-found: error
          retention-days: 7
