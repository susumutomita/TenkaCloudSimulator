name: Verify merged scaling plan interruption
on: workflow_dispatch
permissions:
  contents: read
jobs:
  verify:
    name: Real cancel and deadline after plan and target writes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: evidence
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: 64e5dd28dbe43f43480dfab555ffdd9aff572eb0
          path: product
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache-dependency-path: product/go.sum
      - name: Bind test, preregistration and product Git identities
        run: |
          test "$(git -C evidence rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C product rev-parse HEAD)" = 64e5dd28dbe43f43480dfab555ffdd9aff572eb0
          test "$(git -C product rev-parse HEAD^{tree})" = dc9016f1da1760e0af03a0527164a6e97851c325
          test -z "$(git -C product status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          mkdir "$RUNNER_TEMP/scaling-interrupt"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          output = Path(os.environ["RUNNER_TEMP"]) / "scaling-interrupt"
          files = {"native_interrupt_test.go": "b3c0d08891726c95559d47e0ab04c8e41b440d65bcf3e023f15ab8d219137183",
                   "prereg.json": "df2d568e7cb594bf8a0a2f6e2fd3e8626e6d5b657841e5d497668ca70c14525d"}
          for name, digest in files.items():
              assert hashlib.sha256((workspace / "evidence/verification/290" / name).read_bytes()).hexdigest() == digest
          overlay = {"Replace": {str(workspace / "product/internal/aws/qualification_native_interrupt_test.go"):
                                 str(workspace / "evidence/verification/290/native_interrupt_test.go")}}
          (output / "overlay.json").write_text(json.dumps(overlay))
          PY
      - name: Run the four real loopback and SQLite interruption cases
        working-directory: product
        env:
          GOMAXPROCS: '2'
        run: |
          set -o pipefail
          go test -race -count=1 -timeout=100s -overlay="$RUNNER_TEMP/scaling-interrupt/overlay.json" ./internal/aws -run '^TestMergedScalingPlannerNativeInterruption$' -v | tee "$RUNNER_TEMP/scaling-interrupt/result.log"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD HEAD^{tree} > "$RUNNER_TEMP/scaling-interrupt/source.txt"
          go version > "$RUNNER_TEMP/scaling-interrupt/toolchain.txt"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: scaling-plan-interrupt-${{ github.run_id }}
          path: ${{ runner.temp }}/scaling-interrupt/
          if-no-files-found: error
          retention-days: 14
