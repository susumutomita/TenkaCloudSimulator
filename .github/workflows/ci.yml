name: Verify Service Quotas with the official SDK, Scalar and Cloudscape
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      PRODUCT: 063e46f1d90089e96eccb5370f2b3661668d34bb
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 063e46f1d90089e96eccb5370f2b3661668d34bb
          persist-credentials: false
      - uses: actions/setup-go@v6.5.0
        with:
          go-version: '1.26.11'
          cache: true
      - name: Build clean pinned simulator and install repository SDK pins
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = susumutomita/TenkaCloudSimulator
          test "$GITHUB_REF" = refs/heads/verify/210-063e46f-quota-workflow
          test "$(git rev-parse HEAD)" = "$PRODUCT"
          test "$(git rev-parse 'HEAD^{tree}')" = 5eec1c422839ca9d5278e5599a987cf9709aca13
          test -z "$(git status --porcelain)"
          test "$(go env GOVERSION)" = go1.26.11
          test "$(id -u)" -ne 0
          umask 077
          mkdir "$RUNNER_TEMP/receipts"
          make build
          go version -m dist/tenkacloud-simulator > "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.revision=%s' "$PRODUCT")" "$RUNNER_TEMP/receipts/build.txt"
          grep -Fx "$(printf '\tbuild\tvcs.modified=false')" "$RUNNER_TEMP/receipts/build.txt"
          python="$RUNNER_TOOL_CACHE/Python/3.12.16/x64/bin/python3.12"
          test "$("$python" --version)" = "Python 3.12.16"
          "$python" -m venv "$RUNNER_TEMP/quota-tools"
          "$RUNNER_TEMP/quota-tools/bin/python" -m pip install -r scripts/requirements-test.txt
          "$RUNNER_TEMP/quota-tools/bin/playwright" install --with-deps chromium
          "$RUNNER_TEMP/quota-tools/bin/python" scripts/get-audit-tools.py "$RUNNER_TEMP/quota-axe"
      - name: Run checked-in SDK fixtures on isolated numeric loopback
        run: |
          set -euo pipefail
          umask 077
          export SIMULATOR_BINARY="$PWD/dist/tenkacloud-simulator"
          python="$RUNNER_TEMP/quota-tools/bin/python"
          "$python" -I -c 'import os; from pathlib import Path; assert not any(k.startswith(("AWS_", "BOTO_")) for k in os.environ); assert not any(os.path.lexists(p) for p in (Path.home()/".aws", Path.home()/".boto", "/etc/boto.cfg"))'
          cat > "$RUNNER_TEMP/measure.py" <<'PY'
          import hashlib, json, os, re, socket, subprocess, sys, time
          from pathlib import Path
          from importlib.metadata import version
          tests = Path.cwd() / 'test/e2e'
          sys.path.insert(0, str(tests))
          import run_s3_multipart_paging as guard
          uid, net, user = map(int, sys.argv[1:])
          status = Path('/proc/self/status').read_text()
          guard.validate_inside_context(uid, net, user, uid=os.getuid(), euid=os.geteuid(), net=guard.namespace_inode('net'), user=guard.namespace_inode('user'), status=status, interfaces=[n for _, n in socket.if_nameindex()], lo_up=guard.loopback_up())
          assert next(r.split()[1] for r in status.splitlines() if r.startswith('CapBnd:')) == '0000000000000000'
          assert (version('boto3'), version('botocore')) == ('1.42.0', '1.41.6')
          def digest(path):
              with path.open('rb') as stream: return hashlib.file_digest(stream, 'sha256').hexdigest()
          binary = Path(os.environ['SIMULATOR_BINARY'])
          initial = digest(binary)
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              os.environ['CHROMIUM_EXECUTABLE'] = p.chromium.executable_path
          os.environ['AXE_SCRIPT'] = str(Path(os.environ['RUNNER_TEMP']) / 'quota-axe/axe.min.js')
          receipt = {'sha': os.environ['PRODUCT'], 'binarySha256': initial, 'sdk': [version('boto3'), version('botocore')], 'isolation': 'nonroot private user/net, only lo, zero capabilities', 'cases': []}
          path = Path(os.environ['RUNNER_TEMP']) / 'receipts/receipt.json'
          for source, args in [('aws_catalog_fixtures.py', ['service-quotas']), ('service_quotas_profiles.py', []), ('service_quotas_discovery.py', []), ('service_quotas_scalar.py', []), ('service_quotas_console.py', [])]:
              start = time.monotonic()
              proc = subprocess.run([sys.executable, '-B', str(tests/source), *args], capture_output=True, timeout=300)
              case = {'source': source, 'fixtureSha256': digest(tests/source), 'args': args, 'exit': proc.returncode, 'seconds': round(time.monotonic()-start, 2)}
              if proc.returncode == 0 and source in ('service_quotas_scalar.py', 'service_quotas_console.py'):
                  observed = [json.loads(line) for line in proc.stdout.splitlines() if line.startswith(b'{')]
                  assert len(observed) == 1 and observed[0]['cleanup' if source.endswith('_scalar.py') else 'peerRestartCleanup'] is True
                  case['observed'] = observed[0]
              if proc.returncode:
                  frames = re.findall(rb'File "[^"\n]*/[a-z_]+\.py", line (\d+), in ([a-zA-Z_][a-zA-Z_0-9]{0,49}|<module>)', proc.stderr)
                  case['frames'] = [[int(n), f.decode()] for n, f in frames[-4:]]
                  classes = re.findall(rb'^([A-Za-z_][A-Za-z0-9_.]*(?:Error|Exception)):', proc.stderr, re.M)
                  case['exception'] = classes[-1].decode() if classes else 'unclassified'
              receipt['cases'].append(case)
              path.write_text(json.dumps(receipt, indent=2)+'\n')
              print(source, proc.returncode, flush=True)
          assert len(receipt['cases']) == 5 and all(c['exit'] == 0 for c in receipt['cases']) and digest(binary) == initial
          PY
          unshare --user --map-current-user --net --keep-caps sh -ec '
            ip link set lo up
            exec setpriv --inh-caps=-all --ambient-caps=-all --bounding-set=-all "$@"
          ' quota "$python" -IB "$RUNNER_TEMP/measure.py" "$(id -u)" "$(stat -Lc %i /proc/self/ns/net)" "$(stat -Lc %i /proc/self/ns/user)"
      - name: Retain pinned build and sanitized SDK results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: b2bi-account-quota-workflow-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts/
          if-no-files-found: error
          retention-days: 14
