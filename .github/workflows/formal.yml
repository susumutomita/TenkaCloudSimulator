name: Formal validation
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  formal:
    name: Formal validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Exercise applicability and gate negative controls
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/formal-python-cache
        run: |
          python3 scripts/test-formal-gate.py
          python3 scripts/test-formal-applicability.py
      - name: Validate exact changed blobs and declared model applicability
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/formal-python-cache
        run: |
          base=$(python3 scripts/check-formal-applicability.py event-base --event "$GITHUB_EVENT_PATH")
          python3 scripts/check-formal-applicability.py check --base "$base"
      - name: Run all finite models and required invariant counterexamples
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/formal-python-cache
        run: |
          curl --fail --location https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar --output /tmp/tla2tools.jar
          TLA_JAR=/tmp/tla2tools.jar python3 scripts/check-formal.py --merge-gate
      - name: Retain exact formal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/formal/
          if-no-files-found: error
          retention-days: 14
